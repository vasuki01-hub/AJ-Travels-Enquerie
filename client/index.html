<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A J Travels - Inquiry Portal</title>
    <meta name="description" content="Professional travel inquiry and booking management portal for A J Travels">
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="apple-touch-icon" href="favicon.jpg">
    <meta name="theme-color" content="#1a237e">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            overflow: auto;
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        :root {
            --background: hsl(210, 20%, 98%);
            --foreground: hsl(217, 13%, 34%);
            --card: hsl(0, 0%, 100%);
            --card-foreground: hsl(215, 25%, 15%);
            --primary: hsl(200, 95%, 42%);
            --primary-foreground: hsl(0, 0%, 100%);
            --secondary: hsl(210, 30%, 92%);
            --secondary-foreground: hsl(215, 25%, 15%);
            --muted: hsl(210, 30%, 94%);
            --muted-foreground: hsl(215, 16%, 45%);
            --accent: hsl(185, 85%, 50%);
            --accent-foreground: hsl(0, 0%, 100%);
            --destructive: hsl(0, 72%, 51%);
            --destructive-foreground: hsl(0, 0%, 100%);
            --success: hsl(142, 76%, 36%);
            --success-foreground: hsl(0, 0%, 100%);
            --warning: hsl(38, 92%, 50%);
            --warning-foreground: hsl(0, 0%, 100%);
            --border: hsl(210, 30%, 88%);
            --input: hsl(210, 30%, 90%);
            --ring: hsl(200, 95%, 42%)
        }

        [data-theme="dark"] {
            --background: hsl(215, 28%, 17%);
            --foreground: hsl(210, 20%, 95%);
            --card: hsl(215, 28%, 20%);
            --card-foreground: hsl(210, 20%, 95%);
            --primary: hsl(200, 95%, 50%);
            --primary-foreground: hsl(0, 0%, 100%);
            --secondary: hsl(215, 25%, 25%);
            --secondary-foreground: hsl(210, 20%, 85%);
            --muted: hsl(215, 25%, 23%);
            --muted-foreground: hsl(215, 16%, 65%);
            --accent: hsl(185, 85%, 60%);
            --accent-foreground: hsl(0, 0%, 100%);
            --destructive: hsl(0, 72%, 60%);
            --destructive-foreground: hsl(0, 0%, 100%);
            --success: hsl(142, 76%, 45%);
            --success-foreground: hsl(0, 0%, 100%);
            --warning: hsl(38, 92%, 60%);
            --warning-foreground: hsl(0, 0%, 100%);
            --border: hsl(215, 25%, 30%);
            --input: hsl(215, 25%, 28%);
            --ring: hsl(200, 95%, 50%)
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background);
            color: var(--foreground);
            line-height: 1.6;
            transition: background .3s, color .3s
        }

        .hidden {
            display: none !important
        }

        .app-container {
            display: flex;
            height: 100vh
        }

        .sidebar {
            overflow: auto;
            color: #e89700;
            margin: 1rem;
            border-radius: 2rem;
            width: 256px;
            background: #00000047;
            border: 3px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1)
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 24px;
            border-bottom: 1px solid var(--border)
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-foreground);
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .sidebar-title h2 {
            font-size: 18px;
            font-weight: bold
        }

        .sidebar-title p {
            font-size: 12px;
            color: hsl(0deg 0% 100%);
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: hsl(0deg 0% 100%);
            font-weight: 700;
            transition: all .25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            margin-bottom: 4px;
            position: relative;
            overflow: hidden
        }

        .nav-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--primary);
            opacity: 0;
            transition: opacity .25s;
            transform: scaleX(0);
            transform-origin: left
        }

        .nav-item:hover {
            background: var(--secondary);
            transform: translateY(-1px)
        }

        .nav-item:hover::before {
            opacity: 0.1;
            transform: scaleX(1)
        }

        .nav-item.active {
            background: var(--primary);
            color: var(--primary-foreground);
            box-shadow: 0 4px 12px hsla(200, 95%, 42%, .2)
        }

        .nav-item.active::before {
            opacity: 0.2;
            transform: scaleX(1)
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border)
        }

        .user-info {
            padding: 12px;
            border-radius: 20px;
            background: #000000e6;
            margin-bottom: 12px;
            transition: transform .2s
        }

        .user-info:hover {
            transform: translateY(-2px)
        }

        .user-info p {
            font-size: 14px;
            font-weight: 500
        }

        .user-info small {
            font-size: 12px;
            color: var(--muted-foreground)
        }

        .user-role {
            font-size: 12px;
            color: var(--accent);
            text-transform: capitalize;
            margin-top: 4px
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .header {
            height: 64px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 16px
        }

        .header h1 {
            font-size: 20px;
            font-weight: bold
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all .25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            position: relative;
            overflow: hidden
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, .2);
            border-radius: inherit;
            transform: scale(0);
            transition: transform .4s cubic-bezier(0.4, 0, 0.2, 1)
        }

        .btn:active::before {
            transform: scale(2);
            opacity: 0
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1)
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-foreground)
        }

        .btn-primary:hover {
            opacity: .9;
            transform: scale(1.02)
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--secondary-foreground)
        }

        .btn-outline {
            border-radius: 1rem;
            background: #000000;
            border: 1px solid var(--border);
            color: hsl(355.14deg 100% 50%);
            font-weight: 800;
            font-size: medium;
        }

        .btn-ghost {
            background: transparent;
            color: var(--foreground)
        }

        .btn-ghost:hover {
            background: var(--secondary);
            transform: scale(1.05)
        }

        .btn-icon {
            padding: 8px;
            width: 36px;
            height: 36px
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 12px
        }

        .w-full {
            width: 100%
        }

        .card {
            background: var(--card);
            border: 4px solid var(--border);
            border-radius: 30px;
            overflow: auto;
            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(20px)
        }

        .card.animate {
            opacity: 1;
            transform: translateY(0)
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, .1), 0 10px 10px -5px rgba(0, 0, 0, .04)
        }

        .card-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border)
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .card-title {
            font-size: 18px;
            font-weight: 600
        }

        .card-description {
            font-size: 14px;
            color: var(--muted-foreground);
            margin-top: 4px
        }

        .card-content {
            padding: 24px
        }

        .form-group {
            margin-bottom: 16px;
            position: relative
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            transition: all .2s;
            transform-origin: left
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--background);
            font-size: 14px;
            color: var(--foreground);
            transition: all .25s cubic-bezier(0.4, 0, 0.2, 1)
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--ring);
            box-shadow: 0 0 0 3px hsla(200, 95%, 42%, .2);
            transform: scale(1.02)
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical
        }

        .grid {
            display: grid;
            gap: 16px
        }

        .grid-cols-2 {
            grid-template-columns: repeat(2, 1fr)
        }

        .grid-cols-3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .grid-cols-4 {
            grid-template-columns: repeat(2, 2fr)
        }

        .table-container {
            overflow-x: auto
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        .table thead tr {
            opacity: 1 !important;
            transform: none !important
        }

        .table th {
            text-align: left;
            padding: 12px;
            background: var(--muted);
            font-weight: 600;
            color: var(--foreground);
            border-bottom: 1px solid var(--border);
            opacity: 1 !important
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            transition: background .2s;
            color: var(--foreground);
            vertical-align: top
        }

        .table tbody tr.data-animate {
            opacity: 0;
            transform: translateY(10px);
            transition: all .3s
        }

        .table tbody tr.data-animate.animate {
            opacity: 1;
            transform: translateY(0)
        }

        .table tr:hover {
            background: hsla(210, 30%, 94%, .5);
            transform: translateY(-1px)
        }

        [data-theme="dark"] .table tr:hover {
            background: hsla(215, 25%, 30%, .5)
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            transition: transform .2s
        }

        .badge:hover {
            transform: scale(1.1)
        }

        .badge-success {
            background: hsla(142, 76%, 36%, .1);
            color: var(--success)
        }

        .badge-warning {
            background: hsla(38, 92%, 50%, .1);
            color: var(--warning)
        }

        .badge-destructive {
            background: hsla(0, 72%, 51%, .1);
            color: var(--destructive)
        }

        .badge-secondary {
            background: var(--secondary);
            color: var(--secondary-foreground)
        }

        .metric-card {
            padding: 20px;
            text-align: center;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.02)
            }
        }

        .metric-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--muted-foreground)
        }

        .metric-card-title {
            font-weight: 500
        }

        .metric-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 4px;
            transition: transform .3s
        }

        .metric-card:hover .metric-value {
            transform: scale(1.1)
        }

        .metric-label {
            font-size: 12px;
            color: var(--muted-foreground)
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
            opacity: 0;
            animation: fadeIn .3s forwards
        }

        @keyframes fadeIn {
            to {
                opacity: 1
            }
        }

        .modal {
            background: var(--card);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, .1);
            transform: scale(0.9);
            animation: modalPop .3s cubic-bezier(0.4, 0, 0.2, 1) forwards
        }

        @keyframes modalPop {
            to {
                transform: scale(1)
            }
        }

        .modal-header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid var(--border)
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600
        }

        .modal-description {
            font-size: 14px;
            color: var(--muted-foreground);
            margin-top: 4px
        }

        .modal-content {
            padding: 24px
        }

        .flex {
            display: flex
        }

        .flex-col {
            flex-direction: column
        }

        .items-center {
            align-items: center
        }

        .justify-between {
            justify-content: space-between
        }

        .gap-1 {
            gap: 4px
        }

        .gap-2 {
            gap: 8px
        }

        .gap-3 {
            gap: 12px
        }

        .gap-4 {
            gap: 16px
        }

        .space-y-4>*+* {
            margin-top: 16px
        }

        .space-y-6>*+* {
            margin-top: 24px
        }

        .mt-4 {
            margin-top: 16px
        }

        .mb-4 {
            margin-bottom: 16px
        }

        .text-center {
            text-align: center
        }

        .font-mono {
            font-family: monospace
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, hsla(200, 95%, 42%, .1), var(--background), hsla(185, 85%, 50%, .1));
            padding: 16px;
            transition: background .3s
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            opacity: 0;
            transform: translateY(20px)
        }

        .login-card.animate {
            opacity: 1;
            transform: translateY(0);
            transition: opacity .6s ease-out, transform .6s ease-out
        }

        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-foreground);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform .3s
        }

        .login-logo:hover {
            transform: scale(1.05)
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px
        }

        .demo-credentials {
            margin-top: 24px;
            padding: 16px;
            background: var(--muted);
            border-radius: 8px;
            transition: transform .2s
        }

        .demo-credentials:hover {
            transform: translateY(-2px)
        }

        .demo-credentials p {
            font-size: 12px;
            color: var(--muted-foreground);
            margin: 4px 0
        }

        .demo-credentials p:first-child {
            font-weight: 500;
            margin-bottom: 8px
        }

        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 2000
        }

        .toast {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1);
            min-width: 300px;
            animation: slideIn .3s ease, fadeOut 0.3s 2.7s forwards
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(100%)
            }
        }

        .toast-title {
            font-weight: 600;
            margin-bottom: 4px
        }

        .toast-description {
            font-size: 14px;
            color: var(--muted-foreground)
        }

        .toast.error {
            border-color: var(--destructive)
        }

        .toast.error .toast-title {
            color: var(--destructive)
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 16px;
            opacity: 0;
            transform: translateY(20px);
            transition: all .6s
        }

        .chart-container.animate {
            opacity: 1;
            transform: translateY(0)
        }

        .mobile-menu-btn {
            display: none
        }

        @media(max-width:1024px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 100;
                transform: translateX(-100%)
            }

            .sidebar.open {
                transform: translateX(0)
            }

            .mobile-menu-btn {
                display: block
            }

            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, .5);
                backdrop-filter: blur(4px);
                z-index: 99;
                opacity: 0;
                visibility: hidden;
                transition: opacity .3s
            }

            .sidebar-overlay.open {
                opacity: 1;
                visibility: visible
            }
        }

        .actions-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px
        }

        .search-box {
            position: relative
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted-foreground);
            transition: color .2s
        }

        .search-box input {
            padding-left: 36px
        }

        .search-box input:focus~.search-icon {
            color: var(--primary)
        }

        .info-box {
            margin-top: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: hsla(210, 30%, 94%, .5);
            transition: all .2s
        }

        .info-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, .1)
        }

        [data-theme="dark"] .info-box {
            background: hsla(215, 25%, 25%, .5)
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 14px
        }

        .info-grid div {
            padding: 4px 0
        }

        .summary-box {
            margin-top: 16px;
            padding: 16px;
            background: var(--muted);
            border-radius: 8px;
            transition: transform .2s
        }

        .summary-box:hover {
            transform: scale(1.02)
        }

        .summary-box p {
            font-size: 14px;
            color: var(--muted-foreground);
            margin: 4px 0
        }

        .summary-box span {
            font-weight: 600;
            color: var(--foreground)
        }

        .theme-toggle {
            position: relative;
            width: 40px;
            height: 24px;
            background: var(--muted);
            border-radius: 999px;
            cursor: pointer;
            transition: background .3s
        }

        .theme-toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: var(--card);
            border-radius: 50%;
            transition: transform .3s cubic-bezier(0.4, 0, 1, 1), background .3s;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .2)
        }

        [data-theme="dark"] .theme-toggle::after {
            transform: translateX(16px)
        }

        .theme-toggle:active::after {
            transform: scale(0.9)
        }

        @media (max-width: 768px) {
            .header {
                padding: 0 16px;
            }

            .content {
                padding: 16px;
            }

            .card-header,
            .card-content {
                padding: 16px;
            }


            .metric-card {
                padding: 16px;
            }

            .table th,
            .table td {
                padding: 8px 4px;
                font-size: 13px;
            }

            .nav-item {
                padding: 12px 12px;
                font-size: 14px;
            }

            .sidebar-header {
                padding: 16px;
            }

            .form-input,
            .form-select,
            .form-textarea {
                font-size: 16px;
            }

            td.flex {
                flex-direction: column !important;
                gap: 4px;
            }

            td.flex .btn {
                width: 100%;
                justify-content: center;
            }

            .actions-flex {
                flex-direction: column;
            }

            .actions-flex .btn {
                width: 100%;
            }

            .modal {
                max-width: 95vw;
                margin: 0 auto;
            }

            .login-container {
                padding: 8px;
            }
        }

        @media (max-width: 480px) {

        /* ---------- Theme Manager ---------- */
        const Theme = {
            init() {
                const saved = localStorage.getItem('ajTravelsTheme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = saved || (prefersDark ? 'dark' : 'light');
                this.setTheme(theme);
            },
            setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('ajTravelsTheme', theme);
                this.updateToggle();
            },
            toggle() {
                const current = document.documentElement.getAttribute('data-theme') || 'light';
                this.setTheme(current === 'light' ? 'dark' : 'light');
            },
            renderToggle() {
                const header = document.querySelector('.header');
                if (!header) return;
                let actions = header.querySelector('.header-actions');
                if (!actions) {
                    actions = document.createElement('div');
                    actions.className = 'header-actions';
                    header.appendChild(actions);
                }
                if (!document.getElementById('currencySelect')) {
                    const sel = document.createElement('select');
                    sel.id = 'currencySelect';
                    sel.className = 'currency-select';
                    sel.title = 'Portal currency';
                    sel.innerHTML = Currency.optionsHtml();
                    sel.value = Currency.getCode();
                    sel.onchange = () => { Currency.set(sel.value); Currency.refreshDisplayedAmounts(); };
                    actions.appendChild(sel);
                }
                if (!document.getElementById('themeToggle')) {
                    const toggle = document.createElement('button');
                    toggle.id = 'themeToggle';
                    toggle.className = 'btn btn-ghost btn-icon theme-toggle';
                    toggle.title = 'Toggle dark/light mode';
                    toggle.onclick = () => this.toggle();
                    actions.appendChild(toggle);
                }
                this.updateToggle();
            },
            updateToggle() {
                const toggle = document.getElementById('themeToggle');
                if (!toggle) return;
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                toggle.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
            }

            searchCurrencies(query) {
                const q = String(query || '').toLowerCase().trim();
                if (!q) return this.OPTIONS;
                return this.OPTIONS.filter(o => 
                    o.code.toLowerCase().includes(q) || 
                    o.name.toLowerCase().includes(q) || 
                    (o.country && o.country.toLowerCase().includes(q))
                );
            },
            showSelectorModal() {
                const current = this.getCode();
                const m = Modal.open({
                    title: 'Select Operating Currency (200+ Countries)',
                    html: `
                        <div class="space-y-4">
                            <div class="form-group">
                                <label class="form-label">Search Currency by Country, Name, or ISO Code</label>
                                <div class="search-box">
                                    <span class="search-icon">⌕</span>
                                    <input type="text" id="curSearchInput" class="form-input" placeholder="e.g. USD, Pound, Rupee, Japan..." oninput="Currency.filterModalGrid(this.value)">
                                </div>
                            </div>
                            <div id="curModalGrid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:8px;max-height:420px;overflow-y:auto;padding:4px">
                                ${this.renderGridItems(this.OPTIONS, current)}
                            </div>
                        </div>
                    `,
                    footer: '<button class="btn btn-outline" onclick="Modal.close()">Close</button>'
                });
            },
            renderGridItems(list, currentCode) {
                return list.map(c => `
                    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:${c.code === currentCode ? 'var(--muted)' : 'var(--card)'};transition:all .15s ease" 
                         onclick="Currency.selectFromModal('${c.code}')">
                        <span style="font-size:22px;line-height:1">${c.flag || '🌐'}</span>
                        <div style="min-width:0;flex:1">
                            <div style="font-weight:700;font-size:13px">${c.code} (${c.symbol})</div>
                            <div style="font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.name} ${c.country ? '· ' + c.country : ''}</div>
                        </div>
                    </div>
                `).join('');
            },
            filterModalGrid(q) {
                const grid = document.getElementById('curModalGrid');
                if (!grid) return;
                const filtered = this.searchCurrencies(q);
                const current = this.getCode();
                grid.innerHTML = filtered.length ? this.renderGridItems(filtered, current) : '<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--muted-foreground)">No currencies found.</div>';
            },
            async selectFromModal(code) {
                this.set(code);
                const u = Auth.getUser();
                if (u && window.Firebase?.db) {
                    try {
                        const F = window.Firebase;
                        await F.setDoc(F.doc(F.db, 'users', u.id), { currencyCode: code }, { merge: true });
                    } catch (_) {}
                }
                Modal.close();
                this.refreshDisplayedAmounts();
            },
            optionsHtml() {
                return this.OPTIONS.map(o => `<option value="${o.code}">${o.label}</option>`).join('');
            },
            getCode() {
                return localStorage.getItem(this.KEY) || 'INR';
            },
            get() {
                return this.OPTIONS.find(o => o.code === this.getCode()) || this.OPTIONS[0];
            },
            set(code) {
                localStorage.setItem(this.KEY, code);
                Utils.showToast('Currency', `Display set to ${this.get().label}`);
            },
            refreshDisplayedAmounts() {
                const page = window.location.hash.slice(1) || 'dashboard';
                Router.navigate(page);
            }
        };

        /* ---------- Storage ---------- */
        const Storage = {
            _inquiries: [],
            _bookings: [],
            _employees: [],

            _writeInquiries(a) { this._inquiries = a; },
            _writeBookings(a) { this._bookings = a; },
            _writeEmployees(a) { this._employees = a; },

            _adminStaffFilter: 'all',
            getInquiries() {
                const u = Auth.getUser();
                if (!u) return [];
                if (u.role === 'admin') {
                    if (this._adminStaffFilter && this._adminStaffFilter !== 'all') {
                        return this._inquiries.filter(i => (i.employeeId === this._adminStaffFilter || i.assignedTo === this._adminStaffFilter || i.createdBy === this._adminStaffFilter));
                    }
                    return this._inquiries;
                }
                return this._inquiries.filter(i => (i.employeeId === u.id || i.assignedTo === u.id || i.createdBy === u.id || (i.email && i.email === u.email)));
            },
            getAllInquiriesRaw() { return this._inquiries; },
            saveInquiry(i) {
                const u = Auth.getUser();
                if (u) {
                    i.employeeId = i.employeeId || u.id;
                    i.employeeName = i.employeeName || u.name;
                    i.assignedTo = i.assignedTo || u.id;
                    i.createdBy = i.createdBy || u.id;
                    i.creatorRank = i.creatorRank || u.rank || 'Travel Consultant';
                }
                const a = this._inquiries;
                const idx = a.findIndex(x => x.id === i.id);
                const isNew = idx < 0;
                idx >= 0 ? a[idx] = i : a.push(i);
                this._writeInquiries(a);
                FirestoreSync.saveDoc('inquiries', i.id, i);
                Audit.log(isNew ? 'create_inquiry' : 'update_inquiry', i.id, { client: i.name || i.clientName, status: i.status });
            },
            deleteInquiry(id) {
                let a = this._inquiries;
                a = a.filter(x => x.id !== id);
                this._writeInquiries(a);
                FirestoreSync.deleteDoc('inquiries', id);
                Audit.log('delete_inquiry', id);
            },

            getBookings() {
                const u = Auth.getUser();
                if (!u) return [];
                if (u.role === 'admin') {
                    if (this._adminStaffFilter && this._adminStaffFilter !== 'all') {
                        return this._bookings.filter(b => (b.employeeId === this._adminStaffFilter || b.assignedTo === this._adminStaffFilter || b.createdBy === this._adminStaffFilter));
                    }
                    return this._bookings;
                }
                return this._bookings.filter(b => (b.employeeId === u.id || b.assignedTo === u.id || b.createdBy === u.id || (b.email && b.email === u.email)));
            },
            getAllBookingsRaw() { return this._bookings; },
            saveBooking(b) {
                const u = Auth.getUser();
                if (u) {
                    b.employeeId = b.employeeId || u.id;
                    b.employeeName = b.employeeName || u.name;
                    b.assignedTo = b.assignedTo || u.id;
                    b.createdBy = b.createdBy || u.id;
                }
                const a = this._bookings;
                const idx = a.findIndex(x => x.id === b.id);
                const isNew = idx < 0;
                idx >= 0 ? a[idx] = b : a.push(b);
                this._writeBookings(a);
                FirestoreSync.saveDoc('bookings', b.id, b);
                Audit.log(isNew ? 'create_booking' : 'update_booking', b.id, { client: b.clientName, pnr: b.airlinePnr });
            },
            deleteBooking(id) {
                let a = this._bookings;
                a = a.filter(x => x.id !== id);
                this._writeBookings(a);
                FirestoreSync.deleteDoc('bookings', id);
                Audit.log('delete_booking', id);
            },
            async reassign(type, recordId, newEmpId, newEmpName) {
                const col = type === 'inquiry' ? 'inquiries' : 'bookings';
                const arr = type === 'inquiry' ? this._inquiries : this._bookings;
                const item = arr.find(x => x.id === recordId);
                if (item) {
                    item.employeeId = newEmpId;
                    item.employeeName = newEmpName;
                    item.assignedTo = newEmpId;
                    item.assignedToName = newEmpName;
                    item.reassignedAt = new Date().toISOString();
                    await FirestoreSync.saveDoc(col, recordId, item);
                    await Audit.log('reassign_' + type, recordId, { to: newEmpName, toId: newEmpId });
                    Utils.showToast('Reassigned', `Record successfully transferred to ${newEmpName}`);

            getEmployees() { return this._employees; },
            saveEmployee(e) { const a = this.getEmployees(); const idx = a.findIndex(x => x.id === e.id); idx >= 0 ? a[idx] = e : a.push(e); this._writeEmployees(a); FirestoreSync.saveDoc('users', e.id, e); },
            deleteEmployee(id) { let a = this.getEmployees(); a = a.filter(x => x.id !== id); this._writeEmployees(a); FirestoreSync.deleteDoc('users', id); },

            replaceAll(data) {
                if (data.inquiries) this._writeInquiries(data.inquiries);
                if (data.bookings) this._writeBookings(data.bookings);
                if (data.employees) this._writeEmployees(data.employees);

        const FirestoreSync = {
            enabled: true,

            _unsubscribes: [],

            init() {
                if (!window.Firebase?.db) return;
                this.listenAll();
            },

            listenAll() {
                if (!this.enabled) return;
                const F = window.Firebase;
                if (!F?.db) return;

                // Clear previous listeners if any
                this._unsubscribes.forEach(u => u && u());
                this._unsubscribes = [];

                const listen = (colName, storageKey) => {
                    if (!F.onSnapshot) return;
                    const unsub = F.onSnapshot(F.collection(F.db, colName), (snapshot) => {
                        const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        Storage.replaceAll({ [storageKey]: data });

                        // Automatically refresh the current view with the new data
                        const page = window.location.hash.slice(1) || 'dashboard';
                        if (['dashboard', 'inquiries', 'my-bookings', 'employees', 'details', 'reports'].includes(page)) {
                            Router.navigate(page);
                        }
                    }, (error) => {
                        console.warn(`Firestore listen failed for ${colName}`, error);
                    });
                    this._unsubscribes.push(unsub);
                };

                listen('inquiries', 'inquiries');
                listen('bookings', 'bookings');
                listen('users', 'employees');
                if (F.onSnapshot) {
                    const unsubAudit = F.onSnapshot(F.collection(F.db, 'audit_logs'), (snapshot) => {
                        Audit._logs = snapshot.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => String(b.timestamp).localeCompare(String(a.timestamp)));
                        const page = window.location.hash.slice(1) || 'dashboard';
                        if (page === 'audit-logs') Router.navigate('audit-logs');
                    }, () => {});
                    this._unsubscribes.push(unsubAudit);
                }
            },

            async saveDoc(col, id, data) {
                if (!this.enabled || !window.Firebase?.db) return;
                try {
                    const F = window.Firebase;
                    await F.setDoc(F.doc(F.db, col, id), { ...data, updatedAt: new Date().toISOString() });
                } catch (e) {
                    if (!(e?.message || '').includes('not found'))
                        console.warn('Firestore save', col, e);
                }
            },
            async deleteDoc(col, id) {
                if (!this.enabled || !window.Firebase?.db) return;
                try {
                    const F = window.Firebase;
                    await F.deleteDoc(F.doc(F.db, col, id));
                } catch (e) {
                    if (!(e?.message || '').includes('not found'))
                        console.warn('Firestore delete', col, e);
                }
            },
            normalizeContact(c) { return String(c || '').replace(/\D/g, ''); },
            async resolveEmail(identifier) {
                const id = String(identifier || '').trim();
                if (id.includes('@')) return id;
                if (!this.enabled) throw new Error('Use your email address to login.');
                const F = window.Firebase;
                if (!F?.db) throw new Error('Firebase not ready');
                const key = this.normalizeContact(id);
                const snap = await F.getDoc(F.doc(F.db, 'contactIndex', key));
                if (snap.exists()) return snap.data().email;
                throw new Error('No account found for this contact. Use your email.');
            }
        };

        /* ---------- Auth ---------- */
        const Auth = {
            USER_KEY: 'ajTravelsUser', currentUser: null, firebaseUser: null,
            init() { const s = localStorage.getItem(this.USER_KEY); if (s) this.currentUser = JSON.parse(s); },
            setUser(u) { this.currentUser = u; if (u) localStorage.setItem(this.USER_KEY, JSON.stringify(u)); else localStorage.removeItem(this.USER_KEY); },
            // Unified login: tries Firebase first, falls back to demo accounts
            async login(identifier, password) {
                const F = window.Firebase;
                // Try Firebase Auth first if available
                if (F) {
                    try {
                        const email = identifier.includes('@') ? identifier : await FirestoreSync.resolveEmail(identifier).catch(() => identifier);
                        const cred = await F.signInWithEmailAndPassword(F.auth, email, password);
                        this.firebaseUser = cred.user;
                        let name = cred.user.displayName || cred.user.email;
                        let role = 'employee';
                        let contact = '';
                        if (F.db) {
                            try {
                                const prof = await F.getDoc(F.doc(F.db, 'users', cred.user.uid));
                                if (prof.exists()) {
                                    const p = prof.data();
                                    name = p.fullName || name;
                                    role = p.role || role;
                                    contact = p.contact || '';
                                }
                            } catch (_) { }
                        }
                        this.setUser({ id: cred.user.uid, name, email: cred.user.email, contact, role, source: 'firebase' });
                        await FirestoreSync.init();
                        return { success: true };
                    } catch (fbErr) {
                        const code = fbErr?.code || '';
                        return { success: false, error: this._friendlyAuthError(code) };
                    }
                }
                return { success: false, error: 'Firebase not initialized.' };
            },
            _friendlyAuthError(code) {
                const map = {
                    'auth/user-not-found': 'No account found with this email.',
                    'auth/wrong-password': 'Incorrect password.',
                    'auth/invalid-credential': 'Incorrect email or password.',
                    'auth/invalid-email': 'Please enter a valid email address.',
                    'auth/too-many-requests': 'Too many failed attempts. Please try again later.',
                    'auth/user-disabled': 'This account has been disabled.',
                    'auth/unauthorized-domain': 'This domain (Vercel) is not authorized in Firebase. Please add it in Firebase Console -> Authentication -> Settings -> Authorized Domains.'
                };
                return map[code] || 'Login failed (' + code + '). Please try again.';
            },
            async signupFirebase({ fullName, contact, email, password, otp, expectedOtp }) {
                if (String(otp).trim() !== String(expectedOtp)) return { success: false, error: 'Invalid OTP' };
                const F = window.Firebase;
                if (!F) return { success: false, error: 'Firebase not ready' };
                let cred;
                try {
                    cred = await F.createUserWithEmailAndPassword(F.auth, email, password);
                } catch (e) {
                    // Map auth errors — e.g. email-already-in-use
                    return { success: false, error: this._friendlyAuthError(e?.code) || e.message || 'Signup failed' };
                }
                // Auth account created — now create Firestore profile
                const uid = cred.user.uid;
                const profile = { fullName, contact, email, role: 'employee', createdAt: new Date().toISOString() };
                if (F.db) {
                    try {
                        await F.setDoc(F.doc(F.db, 'users', uid), profile);
                        const cKey = FirestoreSync.normalizeContact(contact);
                        if (cKey) await F.setDoc(F.doc(F.db, 'contactIndex', cKey), { email, uid });
                    } catch (_) { /* Firestore optional — don't fail signup */ }
                }
                this.firebaseUser = cred.user;
                this.setUser({ id: uid, name: fullName, email, contact, role: 'employee', source: 'firebase' });
                if (FirestoreSync.dbAvailable === true) await FirestoreSync.init();
                return { success: true };
            },
            async deleteAccount() {
                const F = window.Firebase;
                const user = this.currentUser;
                // Get current firebase user from auth state (handles page-refresh case)
                const fbUser = this.firebaseUser || F?.auth?.currentUser;
                // Delete Firestore user data if available
                if (F && fbUser && FirestoreSync.dbAvailable === true && F.db) {
                    try {
                        await F.deleteDoc(F.doc(F.db, 'users', fbUser.uid));
                        const cKey = FirestoreSync.normalizeContact(user?.contact || '');
                        if (cKey) await F.deleteDoc(F.doc(F.db, 'contactIndex', cKey));
                    } catch (_) { }
                }
                // Delete Firebase Auth account (permanent)
                if (F && fbUser) {
                    try {
                        await fbUser.delete();
                    } catch (e) {
                        if (e?.code === 'auth/requires-recent-login')
                            return { success: false, error: 'For security, please log out and log back in before deleting your account.' };
                        return { success: false, error: e.message || 'Failed to delete Firebase account' };
                    }
                }
                this.firebaseUser = null;
                this.setUser(null);
                FirestoreSync.enabled = false;
                return { success: true };
            },
            async logout() {
                if (window.Firebase?.auth && Auth.firebaseUser) {
                    try { await window.Firebase.signOut(window.Firebase.auth); } catch (_) { }
                }
                this.firebaseUser = null;
                this.setUser(null);
                FirestoreSync.enabled = false;
            },
            isAuthenticated() { return this.currentUser !== null; },
            getUser() { return this.currentUser; }
        };

            createToastContainer() {
                const c = document.createElement('div');

            },
            formatDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString(); },
            escapeHtml(s) { if (s == null) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); },
            passwordInput(id, placeholder = '') {
                return `<div class="password-wrap"><input type="password" id="${id}" class="form-input" placeholder="${placeholder}" required><button type="button" class="pwd-toggle" tabindex="-1" onclick="Utils.togglePassword('${id}', this)" aria-label="Show password">👁</button></div>`;
            },
            togglePassword(id, btn) {
                const el = document.getElementById(id);
                if (!el) return;
                const show = el.type === 'password';
                el.type = show ? 'text' : 'password';
                btn.textContent = show ? '🙈' : '👁';
            },
            formatCurrency(a) {
                const sym = Currency.get().symbol;
                const n = Number(a);
                if (Number.isNaN(n)) return `${sym} 0`;
                return `${sym} ${n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
            },
            monthKey(d) { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`; },
            monthLabel(key) { const [y, m] = key.split('-'); return new Date(Number(y), Number(m) - 1, 1).toLocaleString('default', { month: 'long', year: 'numeric' }); },
            startOfMonth(d) { const x = new Date(d); return new Date(x.getFullYear(), x.getMonth(), 1); },
            endOfMonth(d) { const x = new Date(d); return new Date(x.getFullYear(), x.getMonth() + 1, 0, 23, 59, 59, 999); },
            daysUntil(dateStr) {
                const t = new Date(); t.setHours(0, 0, 0, 0);
                const tr = this.parseDateOnly(dateStr);
                if (!tr) return NaN;
                return Math.round((tr - t) / 86400000);
            },
            parseDateOnly(s) {
                if (!s) return null;
                const p = String(s).slice(0, 10).split('-').map(Number);
                if (p.length < 3 || p.some(n => Number.isNaN(n))) return null;
                return new Date(p[0], p[1] - 1, p[2]);
            },
            compareDateOnly(a, b) {
                const da = this.parseDateOnly(a), db = this.parseDateOnly(b);
                if (!da || !db) return 0;
                return da.getTime() - db.getTime();
            },
            isTravelBeforeToday(travelDate) {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const tr = this.parseDateOnly(travelDate);
                return tr ? tr < today : false;
            },
            isTravelOnOrAfterToday(travelDate) {
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const tr = this.parseDateOnly(travelDate);
                return tr ? tr >= today : false;
            },
            salesAmount(b) { return Number(b?.salesAmount ?? b?.amount ?? 0); },
            issuedAmount(b) { return Number(b?.amount ?? 0); },
            profitAmount(b) { return this.salesAmount(b) - this.issuedAmount(b); },
            monthHeaderRow(colspan, label) { return MonthGroups.headerRow(colspan, null, label, 'generic', null); },
            currentMonthKey() { return this.monthKey(new Date()); },
            formatPaymentDisplay(b) {
                if (!b) return '—';
                if (b.paymentStatus === 'Partially Paid' && Array.isArray(b.partialPayments) && b.partialPayments.length)
                    return b.partialPayments.map(p => `${this.formatCurrency(p.amount)} (${p.mode})`).join('; ');
                if (b.partialAmount != null && b.paymentMode) return `${this.formatCurrency(b.partialAmount)} (${b.paymentMode})`;
                if (b.paymentStatus === 'Paid') return b.paymentMode || '—';
                return b.paymentMode || '—';
            },
            bookingMonthKey(b) { return this.monthKey(b.issuedDate || b.closingDate || b.travelDate); },
            getStatusBadgeClass(s) {
                const m = { 'Successful': 'badge-success', 'Under Process': 'badge-warning', 'Unsuccessful': 'badge-destructive', 'Pending': 'badge-warning', 'Paid': 'badge-success', 'Partially Paid': 'badge-warning', 'Fail': 'badge-destructive' };
                return m[s] || 'badge-secondary';
            }
        };

        const MonthGroups = {
            expanded: {},
            ensure(section) {
                if (!this.expanded[section]) this.expanded[section] = new Set([Utils.currentMonthKey()]);
                return this.expanded[section];
            },
            isExpanded(section, monthKey) { return this.ensure(section).has(monthKey); },
            toggle(section, monthKey) {
                const set = this.ensure(section);
                if (set.has(monthKey)) set.delete(monthKey); else set.add(monthKey);
                this.apply(section);
            },
            apply(section) {
                document.querySelectorAll(`tr.month-data-row[data-section="${section}"]`).forEach(tr => {
                    tr.classList.toggle('month-hidden', !this.isExpanded(section, tr.dataset.monthGroup));
                });
                document.querySelectorAll(`tr.month-row-toggle[data-section="${section}"]`).forEach(tr => {
                    const icon = tr.querySelector('.month-toggle-icon');
                    if (icon) icon.textContent = this.isExpanded(section, tr.dataset.monthGroup) ? '▼' : '▶';
                });
            },
            hiddenClass(section, monthKey) { return this.isExpanded(section, monthKey) ? '' : ' month-hidden'; },
            syncVisible(section, monthKeys) {
                if (!monthKeys.length) { this.apply(section); return; }
                const set = this.ensure(section);
                if (!monthKeys.some(k => set.has(k))) {
                    set.clear();
                    const cur = Utils.currentMonthKey();
                    set.add(monthKeys.includes(cur) ? cur : monthKeys[0]);
                }
                this.apply(section);
            },
            reset(section) { delete this.expanded[section]; },
            headerRow(colspan, monthKey, label, section, profitText) {
                const exp = monthKey ? this.isExpanded(section, monthKey) : true;
                const profit = profitText ? `<span class="month-profit-badge">${profitText}</span>` : '';
                const mk = monthKey || '';
                const click = monthKey ? `onclick="MonthGroups.toggle('${section}','${monthKey}')"` : '';
                return `<tr class="month-row month-row-toggle" data-month-group="${mk}" data-section="${section}" ${click}>
            <td colspan="${colspan}" class="month-header-cell"><span class="month-toggle-icon">${monthKey ? (exp ? '▼' : '▶') : ''}</span><span>${label}</span>${profit}</td></tr>`;

        const ExportUtil = {
            downloadExcel(sheetName, headers, rows, monthGroups) {
                const wb = XLSX.utils.book_new();
                const aoa = [];
                if (monthGroups) {
                    monthGroups.forEach(g => {
                        aoa.push([g.profitLabel ? `${g.label}  |  ${g.profitLabel}` : g.label]);
                        if (g.profitLabel) aoa.push(['Total Profit', g.profitValue ?? '']);
                        aoa.push(headers);
                        g.rows.forEach(r => aoa.push(r));
                        aoa.push([]);
                    });
                } else {
                    aoa.push(headers);
                    rows.forEach(r => aoa.push(r));
                }
                const ws = XLSX.utils.aoa_to_sheet(aoa);
                XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31));
                XLSX.writeFile(wb, `${sheetName.replace(/\s+/g, '_')}.xlsx`);
            },
            downloadPdf(title, headers, rows, monthGroups) {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: headers.length > 6 ? 'landscape' : 'portrait' });
                doc.setFontSize(14);
                doc.text(title, 14, 16);
                let startY = 22;
                const addTable = (head, body) => {
                    doc.autoTable({ head: [head], body, startY, theme: 'grid', styles: { fontSize: 8, cellPadding: 2 }, headStyles: { fillColor: [32, 150, 210] } });
                    startY = doc.lastAutoTable.finalY + 8;
                };
                if (monthGroups) {
                    monthGroups.forEach(g => {
                        if (startY > 250) { doc.addPage(); startY = 16; }
                        doc.setFillColor(32, 150, 210);
                        doc.rect(14, startY - 5, doc.internal.pageSize.getWidth() - 28, 8, 'F');

                        doc.setFontSize(11);
                        doc.text(g.label, 16, startY);
                        if (g.profitLabel) {
                            doc.setFillColor(198, 239, 206);
                            const pw = doc.getTextWidth(g.profitLabel) + 8;
                            doc.rect(doc.internal.pageSize.getWidth() - 14 - pw, startY - 5, pw, 7, 'F');

                            doc.text(g.profitLabel, doc.internal.pageSize.getWidth() - 14 - pw + 4, startY);

        /* ---------- Dashboard ---------- */

        const MyBookings = {
            SECTION: 'bookings',
            HEADERS: ['Sr. No.', 'Invoice', 'Client', 'Phone', 'Email', 'From', 'Destination', 'Travel date', 'Type', 'Airline PNR', 'GDS PNR', 'Issued amount', 'Sales amount', 'Payment', 'Mode', 'Details', 'Actions'],
            render() {
                const u = Auth.getUser();
                const bks = Storage.getBookings().filter(b => u.role === 'admin' || b.employeeId === u.id);
                this.lastList = bks;
                const content = `
            <div class="space-y-6"><div class="card"><div class="card-header"><div class="card-title">My Bookings</div></div>
                <div class="card-content">
                    <div class="page-split" id="bookingsPreviewWrap">

                    <div class="export-bar">

                    </div>
                    <div id="bookingsTableArea">${this.tableHtml(bks)}</div>
                    <div class="summary-box"><p>Total: <span id="totalCount">${bks.length}</span> | Revenue (Sales): <span id="totalRev">${Utils.formatCurrency(bks.reduce((s, b) => s + Utils.salesAmount(b), 0))}</span></p></div>
                    </div></div>
                </div></div></div>`;
                return Layout.render('My Bookings', content);
            },
            groupByMonth(bks) {
                const map = new Map();
                bks.forEach(b => {
                    const k = Utils.bookingMonthKey(b);
                    if (!map.has(k)) map.set(k, []);
                    map.get(k).push(b);
                });
                return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
            },
            monthProfit(items) { return items.reduce((s, b) => s + Utils.profitAmount(b), 0); },
            exportRow(b, sr) {
                return [sr, b.invoiceNumber, b.clientName, b.contactNumber || '', b.email || '', b.fromLocation || '', b.destination, Utils.formatDate(b.travelDate), b.inquiryFor || '', b.airlinePNR || '', b.gdsPNR || '', Utils.issuedAmount(b), Utils.salesAmount(b), b.paymentStatus || '', Utils.formatPaymentDisplay(b), b.bookingDetails || ''];
            },
            tableHtml(bks) {
                if (!bks.length) return '<p class="text-center" style="padding:24px;color:var(--muted-foreground)">No bookings</p>';
                const cols = this.HEADERS.length + 1;
                const sec = this.SECTION;
                let html = `<div class="table-container"><table class="table table-bordered"><thead><tr>${this.HEADERS.map(h => `<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>`;
                this.groupByMonth(bks).forEach(([key, items]) => {
                    const profit = this.monthProfit(items);
                    const profitLabel = `Total Profit: ${Utils.formatCurrency(profit)}`;
                    html += MonthGroups.headerRow(cols, key, Utils.monthLabel(key), sec, profitLabel);
                    html += this.dataRows(items, key, sec);
                });
                html += '</tbody></table></div>';
                this.lastList = bks;
                return html;
            },
            dataRows(bks, monthKey, section) {
                let sr = 0;
                return bks.map(b => {
                    sr++;
                    const hc = MonthGroups.hiddenClass(section, monthKey);
                    return `<tr class="month-data-row data-animate tr-clickable${hc}" data-month-group="${monthKey}" data-section="${section}" data-booking-id="${b.id}" onclick="MyBookings.openPreview('${b.id}', this)">
        <td>${sr}</td><td class="font-mono">${Utils.escapeHtml(b.invoiceNumber)}</td><td>${Utils.escapeHtml(b.clientName)}</td><td>${Utils.escapeHtml(b.contactNumber || '—')}</td><td>${Utils.escapeHtml(b.email || '—')}</td>
        <td>${Utils.escapeHtml(b.fromLocation || '—')}</td><td>${Utils.escapeHtml(b.destination)}</td><td>${Utils.formatDate(b.travelDate)}</td><td>${Utils.escapeHtml(b.inquiryFor || '—')}</td>
        <td class="font-mono">${Utils.escapeHtml(b.airlinePNR || '—')}</td><td class="font-mono">${Utils.escapeHtml(b.gdsPNR || '—')}</td>
        <td>${Utils.formatCurrency(Utils.issuedAmount(b))}</td><td>${Utils.formatCurrency(Utils.salesAmount(b))}</td>
        <td><span class="badge ${Utils.getStatusBadgeClass(b.paymentStatus)}">${Utils.escapeHtml(b.paymentStatus || '—')}</span></td>
        <td>${Utils.escapeHtml(Utils.formatPaymentDisplay(b))}</td><td>${Utils.escapeHtml(b.bookingDetails || '—')}</td>
        <td onclick="event.stopPropagation()"><div class="row-actions">
            <button class="btn btn-ghost btn-sm icon-btn" title="Edit" onclick="MyBookings.edit('${b.id}')">✎</button>
            ${u.role === 'admin' ? `<button class="btn btn-ghost btn-sm" onclick="Inquiries.showReassignModal('booking', '${b.id}')" title="Reassign Staff">Reassign</button>` : ''}
            <button class="btn btn-ghost btn-sm icon-btn" title="Delete" style="color:var(--destructive)" onclick="MyBookings.del('${b.id}')">🗑</button>
        </div></td></tr>`;
                }).join('');
            },
            exportGroups(list) {
                return this.groupByMonth(list).map(([k, items]) => {
                    const profit = this.monthProfit(items);
                    const profitLabel = `Total Profit: ${Utils.formatCurrency(profit)}`;
                    let sr = 0;
                    return { label: Utils.monthLabel(k), profitLabel, profitValue: profit, rows: items.map(b => this.exportRow(b, ++sr)) };
                });
            },
            exportPdf() {
                ExportUtil.downloadPdf('Bookings', this.HEADERS, [], this.exportGroups(this.lastList || []));
            },
            exportExcel() {
                ExportUtil.downloadExcel('Bookings', this.HEADERS, [], this.exportGroups(this.lastList || []));
            },
            afterRender() {
                const keys = this.groupByMonth(this.lastList || []).map(([k]) => k);
                MonthGroups.syncVisible(this.SECTION, keys);
            },

                <div class="form-group"><label class="form-label">GDS PNR</label><input type="text" id="ebGPnr" class="form-input" value="${Utils.escapeHtml(b.gdsPNR || '')}"></div>

            filter() {

        };
        /* ---------- Inquiries ---------- */
        const Inquiries = {
            SECTION: 'inquiries',

            checkDuplicate(contact) {
                const c = String(contact || '').trim().toLowerCase();
                const warnBox = document.getElementById('inqDupWarn');
                if (!warnBox) return;
                if (!c || c.length < 5) {
                    warnBox.classList.add('hidden');
                    return;
                }
                const pool = [...Storage.getAllInquiriesRaw(), ...Storage.getAllBookingsRaw()];
                const found = pool.find(x => (x.phone && x.phone.toLowerCase().includes(c)) || (x.email && x.email.toLowerCase().includes(c)) || (x.contactNumber && x.contactNumber.toLowerCase().includes(c)));
                if (found) {
                    warnBox.innerHTML = '⚠️ <strong>Duplicate Warning:</strong> A record with contact "' + Utils.escapeHtml(c) + '" already exists (Client: ' + Utils.escapeHtml(found.name || found.clientName || '') + ').';
                    warnBox.classList.remove('hidden');
                } else {
                    warnBox.classList.add('hidden');
                }

            initialList() {
                const range = this.defaultRange();
                const from = new Date(range.start);
                const to = new Date(range.end + 'T23:59:59');
                return this.baseList.filter(i => {
                    const d = new Date(i.inquiryDate || i.travelDate);
                    return d >= from && d <= to;
                }).sort((a, b) => new Date(b.inquiryDate) - new Date(a.inquiryDate));
            },
            statusMatch(i, filter) {
                if (filter === 'all') return true;
                if (filter === 'process') return i.status === 'Under Process';
                if (filter === 'success') return i.status === 'Successful';
                if (filter === 'fail') return i.status === 'Unsuccessful';
                return true;
            },
            getFiltered() {
                const fromEl = document.getElementById('inqDateFrom');
                const toEl = document.getElementById('inqDateTo');
                const from = fromEl ? new Date(fromEl.value) : Utils.startOfMonth(new Date());
                const to = toEl ? new Date(toEl.value + 'T23:59:59') : Utils.endOfMonth(new Date());
                const status = document.getElementById('inqStatusFilter')?.value || 'all';
                const q = (document.getElementById('inqSearch')?.value || '').toLowerCase().trim();
                return this.baseList.filter(i => {
                    const d = new Date(i.inquiryDate || i.travelDate);
                    if (d < from || d > to) return false;
                    if (!this.statusMatch(i, status)) return false;
                    if (!q) return true;
                    const hay = [i.id, i.clientName, i.fromLocation, i.destination, i.travelDate, i.inquiryFor, i.status, Utils.formatDate(i.travelDate)].join(' ').toLowerCase();
                    return hay.includes(q);
                }).sort((a, b) => new Date(b.inquiryDate) - new Date(a.inquiryDate));
            },
            groupByMonth(list) {
                const map = new Map();
                list.forEach(i => {
                    const k = Utils.monthKey(i.inquiryDate || i.travelDate);
                    if (!map.has(k)) map.set(k, []);
                    map.get(k).push(i);
                });
                return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
            },
            tableHtml(list) {

                let html = '<div class="table-container"><table class="table table-bordered"><thead><tr><th>Sr. No.</th><th>ID</th><th>Client</th><th>From</th><th>Dest</th><th>Inquiry Date</th><th>Travel Date</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
                const sec = this.SECTION;
                groups.forEach(([key, items]) => {
                    html += MonthGroups.headerRow(10, key, Utils.monthLabel(key), sec, null);
                    html += this.rows(items, key, sec);
                });
                html += '</tbody></table></div>';
                this.filteredList = list;
                return html;
            },
            applyFilters() {
                const area = document.getElementById('inqTableArea');
                if (area) area.innerHTML = this.tableHtml(this.getFiltered());
                const keys = this.groupByMonth(this.getFiltered()).map(([k]) => k);
                MonthGroups.syncVisible(this.SECTION, keys);
            },
            rows(list, monthKey, section) {

            switchTab(t) { this.tab = t; MonthGroups.reset(this.SECTION); Router.navigate('details'); },
            getBookings() {
                const u = Auth.getUser();
                return Storage.getBookings().filter(b => u.role === 'admin' || b.employeeId === u.id);
            },
            filtered() {
                let list = this.getBookings();
                if (this.tab === 'completed') list = list.filter(b => Utils.isTravelBeforeToday(b.travelDate));
                else list = list.filter(b => Utils.isTravelOnOrAfterToday(b.travelDate));
                const fromEl = document.getElementById('detDateFrom');
                const toEl = document.getElementById('detDateTo');
                if (fromEl?.value) {
                    const f = Utils.parseDateOnly(fromEl.value);
                    if (f) list = list.filter(b => { const td = Utils.parseDateOnly(b.travelDate); return td && td >= f; });
                }
                if (toEl?.value) {
                    const t = Utils.parseDateOnly(toEl.value);
                    if (t) { t.setHours(23, 59, 59, 999); list = list.filter(b => { const td = Utils.parseDateOnly(b.travelDate); return td && td <= t; }); }
                }
                const q = (document.getElementById('detSearch')?.value || '').toLowerCase();
                if (q) list = list.filter(b => JSON.stringify(b).toLowerCase().includes(q));
                return list.sort((a, b) => Utils.compareDateOnly(a.travelDate, b.travelDate));
            },
            tableHtml() {
                const list = this.filtered();
                if (!list.length) return '<p class="text-center" style="padding:24px;color:var(--muted-foreground)">No records</p>';
                const groups = new Map();
                list.forEach(b => {
                    const k = Utils.monthKey(b.travelDate);
                    if (!groups.has(k)) groups.set(k, []);
                    groups.get(k).push(b);
                });
                let html = '<div class="page-split" id="detailsPreviewWrap"><div><div class="table-container"><table class="table table-bordered"><thead><tr><th>Sr. No.</th><th>Invoice</th><th>Client</th><th>Contact</th><th>From</th><th>Dest</th><th>Travel</th><th>PNR / GDS</th><th>Flight / package</th><th>Issued</th><th>Sales</th><th>Payment</th></tr></thead><tbody>';
                const sec = this.SECTION;
                Array.from(groups.entries()).sort((a, b) => a[0].localeCompare(b[0])).forEach(([key, items]) => {
                    html += MonthGroups.headerRow(12, key, Utils.monthLabel(key), sec, null);
                    let sr = 0;
                    items.forEach(b => {
                        sr++;
                        const urgent = this.tab === 'upcoming' && Utils.daysUntil(b.travelDate) >= 0 && Utils.daysUntil(b.travelDate) <= 3;
                        const hc = MonthGroups.hiddenClass(sec, key);
                        html += `<tr class="month-data-row data-animate tr-clickable${hc} ${urgent ? 'upcoming-urgent' : ''}" data-month-group="${key}" data-section="${sec}" onclick="Details.openPreview('${b.id}')">
                    <td>${sr}</td><td class="font-mono">${Utils.escapeHtml(b.invoiceNumber)}</td>
                    <td>${Utils.escapeHtml(b.clientName)}</td>
                    <td>${Utils.escapeHtml(b.contactNumber || '—')}</td>
                    <td>${Utils.escapeHtml(b.fromLocation || '—')}</td>
                    <td>${Utils.escapeHtml(b.destination)}</td>
                    <td>${Utils.formatDate(b.travelDate)}</td>
                    <td class="font-mono">${Utils.escapeHtml(b.airlinePNR || '—')} / ${Utils.escapeHtml(b.gdsPNR || '—')}</td>
                    <td>${Utils.escapeHtml(b.bookingDetails || '—')}</td>
                    <td>${Utils.formatCurrency(Utils.issuedAmount(b))}</td>
                    <td>${Utils.formatCurrency(Utils.salesAmount(b))}</td>
                    <td><span class="badge ${Utils.getStatusBadgeClass(b.paymentStatus)}">${Utils.escapeHtml(b.paymentStatus || '—')}</span></td>
                </tr>`;
                    });
                });
                html += '</tbody></table></div></div></div>';
                this.lastFiltered = list;
                this.lastMonthKeys = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b));
                return html;
            },
            openPreview(id) {
                const b = Storage.getBookings().find(x => x.id === id);
                if (b) Preview.mount('detailsPreviewWrap', Preview.booking(b));
            },
            refresh() {
                const el = document.getElementById('detailsTable');
                if (el) el.innerHTML = this.tableHtml();
                MonthGroups.syncVisible(this.SECTION, this.lastMonthKeys || []);
            },
            exportRow(b, sr) {
                return [sr, b.invoiceNumber, b.clientName, b.contactNumber || '', b.fromLocation || '', b.destination, Utils.formatDate(b.travelDate), `${b.airlinePNR || ''} / ${b.gdsPNR || ''}`, b.bookingDetails || '', b.amount, b.salesAmount ?? b.amount, b.paymentStatus];
            },
            exportPdf() {
                const list = this.lastFiltered || this.filtered();
                const title = this.tab === 'upcoming' ? 'Upcoming_Travel' : 'Completed_Travel';
                const headers = ['Sr. No.', 'Invoice', 'Client', 'Contact', 'From', 'Dest', 'Travel', 'PNR/GDS', 'Details', 'Issued', 'Sales', 'Payment'];
                const map = new Map();
                list.forEach(b => { const k = Utils.monthKey(b.travelDate); if (!map.has(k)) map.set(k, []); map.get(k).push(b); });
                const groups = Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([k, items]) => { let s = 0; return { label: Utils.monthLabel(k), rows: items.map(b => this.exportRow(b, ++s)) }; });
                ExportUtil.downloadPdf(title, headers, [], groups);
            },
            exportExcel() {
                const list = this.lastFiltered || this.filtered();
                const title = this.tab === 'upcoming' ? 'Upcoming_Travel' : 'Completed_Travel';
                const headers = ['Sr. No.', 'Invoice', 'Client', 'Contact', 'From', 'Dest', 'Travel', 'PNR/GDS', 'Details', 'Issued', 'Sales', 'Payment'];
                const map = new Map();
                list.forEach(b => { const k = Utils.monthKey(b.travelDate); if (!map.has(k)) map.set(k, []); map.get(k).push(b); });
                const groups = Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([k, items]) => { let s = 0; return { label: Utils.monthLabel(k), rows: items.map(b => this.exportRow(b, ++s)) }; });
                ExportUtil.downloadExcel(title, headers, [], groups);
