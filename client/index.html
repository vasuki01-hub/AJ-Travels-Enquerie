            backupFullJSON() {
                const dump = {
                    version: '2.5',
                    exportDate: new Date().toISOString(),
                    company: Storage.getCompanySettings(),
                    leaveTypes: Storage.getLeaveTypes(),
                    customFilters: Storage.getCustomFilters(),
                    operationFields: Storage.getCustomOperationFields(),
                    policyFields: Storage.getCustomPolicyFields(),
                    employees: Storage.getAllEmployeesRaw(),
                    trashEmployees: Storage.getTrashEmployees(),
                    bookings: Storage.getAllBookingsRaw(),
                    inquiries: Storage.getAllInquiriesRaw(),
                    attendance: Storage.getAttendance(),
                    leaves: Storage.getAllLeavesRaw(),
                    holidays: Storage.getHolidays(),
                    expenses: Storage.getExpenses()
                };

                const str = JSON.stringify(dump, null, 2);
                const blob = new Blob([str], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AJ_Travels_Enterprise_Backup_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                Utils.showToast('JSON Backup Ready', 'Raw enterprise JSON database snapshot downloaded.');

            backupFullExcel() {
                const wb = XLSX.utils.book_new();

                const emps = Storage.getAllEmployeesRaw() || [];
                const empRows = [['ID', 'Name', 'Email', 'Role', 'Rank', 'Phone', 'Join Date', 'Shift In', 'Shift Out', 'Salary']];
                emps.forEach(e => empRows.push([e.id, e.name, e.email, e.role, e.rank, e.phone || '', e.joinDate || '', e.shiftIn || '', e.shiftOut || '', e.baseSalary || '']));
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(empRows), 'Staff');

                const bks = Storage.getAllBookingsRaw() || [];
                const bkRows = [['ID', 'Client', 'Destination', 'Travel Date', 'PNR', 'Sales Fare', 'Status', 'Consultant']];
                bks.forEach(b => bkRows.push([b.bookingId || b.id, b.clientName, b.destination, b.travelDate, b.pnr, Utils.salesAmount(b), b.status, b.consultantName || '']));
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(bkRows), 'Bookings');

                const inqs = Storage.getAllInquiriesRaw() || [];
                const inqRows = [['ID', 'Client', 'Destination', 'Follow Up', 'Status', 'Assigned To']];
                inqs.forEach(i => inqRows.push([i.id, i.clientName, i.destination, i.followUpDate, i.status, i.assignedName || '']));
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(inqRows), 'Inquiries');

                const att = Storage.getAttendance() || [];
                const attRows = [['Date', 'Staff', 'Check In', 'Check Out', 'Hours', 'Status', 'Notes']];
                att.forEach(a => attRows.push([a.date, a.employeeName || a.empName || '', a.clockIn || '', a.clockOut || '', Math.round((a.durationMinutes || 0) / 60), a.status, a.notes || '']));
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(attRows), 'Attendance');

                const exp = Storage.getExpenses() || [];
                const expRows = [['ID', 'Title', 'Category', 'Amount', 'Date', 'Paid By']];
                exp.forEach(e => expRows.push([e.id, e.title, e.category, e.amount, e.date, e.paidBy || '']));
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expRows), 'Expenses');

            async saveNewEmployee(e) {

                const phone = document.getElementById('nePhone')?.value?.trim();

                    employeeId: uid,

                    role,
                    status,
                    baseSalary: salary,
                    shiftIn,
                    shiftOut,
                    weekOff,
                    notes,
                    createdAt: new Date().toISOString()
                };

                Storage.saveEmployee(empObj);
                Storage.saveSalarySettings(empId, { baseSalary: salary, status: 'Pending' });

                Modal.close();
                Utils.showToast('Employee Added', `${name} (${uid}) has been enrolled successfully.`);
                Router.navigate('employees');

            async saveEditEmployee(e, id) {
                if (e) e.preventDefault();
                const emp = Storage.getAllEmployeesRaw().find(x => x.id === id);
                if (!emp) return;

                const name = document.getElementById('eeName')?.value?.trim();
                const email = document.getElementById('eeEmail')?.value?.trim().toLowerCase();
                const phone = document.getElementById('eePhone')?.value?.trim();
                const uid = document.getElementById('eeUid')?.value?.trim();
                const joinDate = document.getElementById('eeJoinDate')?.value;
                const rank = document.getElementById('eeRank')?.value?.trim();

                const salary = Number(document.getElementById('eeSalary')?.value) || 2800;
                const shiftIn = document.getElementById('eeShiftIn')?.value;
                const shiftOut = document.getElementById('eeShiftOut')?.value;
                const notes = document.getElementById('eeNotes')?.value?.trim();

                emp.name = name;
                emp.fullName = name;
                emp.email = email;
                emp.phone = phone;
                emp.contact = phone;
                emp.uid = uid;
                emp.employeeId = uid;
                emp.joinDate = joinDate;
                emp.rank = rank;
                emp.role = role;
                emp.status = status;
                emp.baseSalary = salary;
                emp.shiftIn = shiftIn;
                emp.shiftOut = shiftOut;
                emp.weekOff = weekOff;
                emp.notes = notes;
                emp.updatedAt = new Date().toISOString();

                Storage.saveEmployee(emp);

                Modal.close();
                Utils.showToast('Employee Updated', `Profile for ${name} updated successfully.`);
                Router.navigate('employees');
            },

                if (!emp) return;

                Modal.open({
                    title: `Delete Employee Account — ${Utils.escapeHtml(emp.name || emp.fullName)}`,
                    html: `
                        <div class="space-y-4">
                            <div style="background:#fff1f2;border:1.5px solid #fecdd3;border-radius:14px;padding:16px;">
                                <div style="display:flex;align-items:center;gap:10px;color:#b91c1c;font-weight:700;font-size:14.5px;">

                                </div>
                                <div style="font-size:13px;color:#9f1239;margin-top:6px;">
                                    You are removing <strong>${Utils.escapeHtml(emp.name || emp.fullName)}</strong> (${Utils.escapeHtml(emp.email)}). Please choose your deletion method below:
                                </div>
                            </div>

                            <div style="display:flex;flex-direction:column;gap:12px;">
                                <div style="background:#ffffff;border:1.5px solid #cbd5e1;border-radius:12px;padding:14px;">

                                        <i class="uil uil-history" style="color:#0284c7;"></i> Option 1: 24-Hour Recovery Window (Recommended)
                                    </div>
                                    <div style="font-size:12.5px;color:#64748b;margin-top:4px;">
                                        Moves the account to Trash. It remains recoverable by Admin for <strong>24 hours</strong>. If not restored, it will be automatically purged after 24 hours.
                                    </div>
                                    <button class="btn btn-outline" style="margin-top:10px;color:#0284c7;border-color:#bae6fd;background:#f0f9ff;" onclick="Employees.confirmSoftDelete('${emp.id}')">
                                        <i class="uil uil-trash-alt"></i> Move to Trash (24h Recovery Window)
                                    </button>
                                </div>

                                <div style="background:#fff5f5;border:1.5px solid #fed7d7;border-radius:12px;padding:14px;">
                                    <div style="font-weight:700;color:#c53030;font-size:13.5px;display:flex;align-items:center;gap:6px;">
                                        <i class="uil uil-fire" style="color:#e53e3e;"></i> Option 2: Delete Permanently Now
                                    </div>
                                    <div style="font-size:12.5px;color:#742a2a;margin-top:4px;">

                                    </div>
                                    <button class="btn btn-outline-danger" style="margin-top:10px;background:#fee2e2;color:#b91c1c;border-color:#fca5a5;" onclick="Employees.confirmPermanentDelete('${emp.id}')">
                                        <i class="uil uil-times-circle"></i> Delete Permanently Now
                                    </button>
                                </div>
                            </div>

                            <div style="display:flex;justify-content:flex-end;margin-top:10px;">
                                <button type="button" class="btn btn-outline" onclick="Modal.close()">Cancel</button>
                            </div>
                        </div>
                    `
                });
            },

            confirmSoftDelete(id) {
                Storage.softDeleteEmployee(id);
                Modal.close();
                Utils.showToast('Moved to Trash', 'Account moved to Trash with a 24-hour recovery window.');
                Router.navigate('employees');
            },

            confirmPermanentDelete(id) {
                const emp = Storage.getAllEmployeesRaw().find(x => x.id === id);
                if (!confirm(`Are you absolutely sure you want to permanently delete ${emp?.name || 'this employee'}? This cannot be recovered.`)) return;
                Storage.permanentDeleteEmployee(id);
                Modal.close();
                Utils.showToast('Permanently Deleted', 'Employee record purged immediately.');
                Router.navigate('employees');
            },

            restore(id) {
                Storage.restoreEmployee(id);
                Utils.showToast('Account Recovered', 'Employee account restored to active status.');
                Router.navigate('employees');
            },

            purgePermanent(id) {
                if (!confirm('Permanently delete this account right now? This cannot be undone.')) return;

        /* ==========================================================================
   CALENDAR MODULE (FULL-FEATURED: MONTH, WEEK, DAY, AGENDA, HEATMAP)
   ========================================================================== */
        const Calendar = {
            view: 'month', // 'month' | 'week' | 'day' | 'agenda' | 'heatmap'
            currentDate: new Date(),
            filterType: 'all',
            filterEmp: 'all',
            searchQuery: '',

            setView(v) {
                this.view = v;
                Router.navigate('calendar');
            },

            prev() {
                if (this.view === 'month' || this.view === 'heatmap') {
                    this.currentDate = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth() - 1, 1);
                } else if (this.view === 'week') {
                    this.currentDate = new Date(this.currentDate.getTime() - 7 * 86400000);
                } else if (this.view === 'day') {
                    this.currentDate = new Date(this.currentDate.getTime() - 86400000);
                } else {
                    this.currentDate = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth() - 1, 1);
                }
                Router.navigate('calendar');
            },

            next() {
                if (this.view === 'month' || this.view === 'heatmap') {
                    this.currentDate = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth() + 1, 1);
                } else if (this.view === 'week') {
                    this.currentDate = new Date(this.currentDate.getTime() + 7 * 86400000);
                } else if (this.view === 'day') {
                    this.currentDate = new Date(this.currentDate.getTime() + 86400000);
                } else {
                    this.currentDate = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth() + 1, 1);
                }
                Router.navigate('calendar');
            },

            today() {
                this.currentDate = new Date();
                Router.navigate('calendar');
            },

            onSearch(val) {
                this.searchQuery = (val || '').toLowerCase().trim();
                const container = document.getElementById('calendarBodyContainer');
                if (container) container.innerHTML = this.renderBody();
            },

            onTypeFilter(val) {
                this.filterType = val;
                const container = document.getElementById('calendarBodyContainer');
                if (container) container.innerHTML = this.renderBody();
            },

            onEmpFilter(val) {
                this.filterEmp = val;
                const container = document.getElementById('calendarBodyContainer');
                if (container) container.innerHTML = this.renderBody();
            },

            // Collect and normalize events from all collections
            getAllEvents() {
                const u = Auth.getUser() || {};
                const isAdmin = u.role === 'admin';
                const events = [];

                // 1. Company Holidays
                const holidays = Storage.getHolidays() || [];
                holidays.forEach(h => {
                    events.push({
                        id: h.id,
                        originId: h.id,
                        type: 'holiday',
                        title: '🎉 ' + (h.name || 'Holiday'),
                        date: h.date,
                        time: 'All Day',
                        notes: h.description || h.type || 'Company Holiday',
                        status: 'Observed',
                        category: 'Holiday',
                        canEdit: isAdmin
                    });
                });

                // 2. Bookings
                const bookings = Storage.getAllBookingsRaw() || [];
                bookings.forEach(b => {
                    if (!isAdmin && b.consultantId && b.consultantId !== u.id && b.createdBy !== u.name) return;
                    if (this.filterEmp !== 'all' && b.consultantId !== this.filterEmp) return;

                    if (b.travelDate) {
                        events.push({
                            id: 'BK-' + b.id,
                            originId: b.id,
                            type: 'booking',
                            title: '✈️ ' + (b.clientName || 'Traveler') + ' - ' + (b.destination || 'Tour'),
                            date: b.travelDate,
                            time: b.travelTime || '09:00',
                            clientName: b.clientName,
                            destination: b.destination,
                            notes: `Flight/Pkg: ${b.pnr || 'N/A'}, Sales: ${Utils.formatCurrency(b.salesPrice || 0)}`,
                            status: b.status || 'Confirmed',
                            consultant: b.consultantName || 'Staff',
                            category: 'Booking'
                        });
                    }
                });

                // 3. Inquiries
                const inqs = Storage.getAllInquiriesRaw() || [];
                inqs.forEach(inq => {
                    if (!isAdmin && inq.assignedTo && inq.assignedTo !== u.id && inq.createdBy !== u.name) return;
                    if (this.filterEmp !== 'all' && inq.assignedTo !== this.filterEmp) return;

                    const date = inq.followUpDate || inq.travelDate || inq.createdDate;
                    if (date) {
                        events.push({
                            id: 'INQ-' + inq.id,
                            originId: inq.id,
                            type: 'inquiry',
                            title: '📋 ' + (inq.clientName || 'Inquiry') + ' (' + (inq.destination || 'Trip') + ')',
                            date: date.slice(0, 10),
                            time: inq.followUpTime || '10:00',
                            clientName: inq.clientName,
                            destination: inq.destination,
                            notes: inq.requirements || inq.notes || 'Client Inquiry',
                            status: inq.status || 'Pending',
                            consultant: inq.assignedName || inq.createdBy || 'Staff',
                            category: 'Inquiry'
                        });
                    }
                });

                // 4. Custom Calendar Events / Meetings / Reminders
                const customEvents = Storage.getCalendarEvents() || [];
                customEvents.forEach(ev => {
                    if (!isAdmin && ev.empId && ev.empId !== u.id && ev.createdBy !== u.name && ev.attendees !== 'All Staff') return;
                    if (this.filterEmp !== 'all' && ev.empId && ev.empId !== this.filterEmp) return;

                    events.push({
                        id: ev.id,
                        originId: ev.id,
                        type: ev.type || 'meeting',
                        title: (ev.type === 'meeting' ? '👥 ' : '🔔 ') + (ev.title || 'Event'),
                        date: ev.date,
                        time: ev.startTime ? `${ev.startTime} - ${ev.endTime || ''}` : '10:00',
                        notes: ev.description || '',
                        status: 'Scheduled',
                        consultant: ev.createdBy || 'Team',
                        attendees: ev.attendees || 'All Staff',
                        recurring: ev.recurring || 'none',
                        category: ev.type === 'meeting' ? 'Meeting' : 'Reminder',
                        canEdit: isAdmin || ev.createdBy === u.name
                    });
                });

                // 5. Attendance & Leaves
                const attList = Storage.getAttendance() || [];
                attList.forEach(a => {
                    if (!isAdmin && a.employeeId !== u.id && a.empId !== u.id) return;
                    const aEmp = a.employeeId || a.empId;
                    if (this.filterEmp !== 'all' && aEmp !== this.filterEmp) return;

                    if (a.leaveType || a.status === 'leave' || a.status === 'On Leave') {
                        events.push({
                            id: 'LV-' + (a.id || Math.random()),
                            originId: a.leaveRequestId || a.id,
                            leaveRequestId: a.leaveRequestId || a.id,
                            empId: aEmp,
                            type: 'leave',
                            title: '🌴 ' + (a.employeeName || a.empName || 'Staff') + ' (' + (a.leaveType || 'Leave') + ')',
                            date: a.date,
                            time: 'Full Day',
                            notes: a.notes || a.reason || 'Leave approved',
                            status: a.leaveStatus || 'Approved',
                            consultant: a.employeeName || a.empName || 'Staff',
                            category: 'Leave',
                            isLeave: true
                        });
                    }
                });

                // Also include pending leave requests from Storage.getLeaves()
                const leaveRequests = Storage.getLeaves() || [];
                leaveRequests.forEach(l => {
                    if (!isAdmin && l.employeeId !== u.id && l.empId !== u.id) return;
                    const empTarget = l.employeeId || l.empId;
                    if (this.filterEmp !== 'all' && empTarget !== this.filterEmp) return;
                    if (l.status !== 'Pending') return; // Approved ones already tracked via attendance

                    const cur = new Date(l.startDate + 'T12:00:00');
                    const end = new Date(l.endDate + 'T12:00:00');
                    while (cur <= end) {
                        const dStr = cur.toISOString().slice(0, 10);
                        events.push({
                            id: 'LVR-' + l.id + '-' + dStr,
                            originId: l.id,
                            leaveRequestId: l.id,
                            empId: empTarget,
                            type: 'leave',
                            title: `⏳ ${l.employeeName || 'Staff'} (${l.leaveType || 'Leave'}) [Pending]`,
                            date: dStr,
                            time: 'Full Day',
                            notes: l.reason || 'Leave requested awaiting approval',
                            status: 'Pending',
                            consultant: l.employeeName || 'Staff',
                            category: 'Leave',
                            isLeave: true,
                            isPendingLeave: true
                        });
                        cur.setDate(cur.getDate() + 1);
                    }
                });

                // Filter by type
                let filtered = events;
                if (this.filterType !== 'all') {
                    if (this.filterType === 'meetings') {
                        filtered = filtered.filter(e => e.type === 'meeting' || e.type === 'reminder');
                    } else {
                        filtered = filtered.filter(e => e.type === this.filterType);
                    }
                }

                // Filter by search query
                if (this.searchQuery) {
                    const q = this.searchQuery;
                    filtered = filtered.filter(e =>
                        (e.title && e.title.toLowerCase().includes(q)) ||
                        (e.clientName && e.clientName.toLowerCase().includes(q)) ||
                        (e.destination && e.destination.toLowerCase().includes(q)) ||
                        (e.consultant && e.consultant.toLowerCase().includes(q)) ||
                        (e.notes && e.notes.toLowerCase().includes(q))
                    );
                }

                return filtered;
            },

                                            <a href="javascript:void(0)" onclick="Calendar.exportICS()" class="dropdown-item"><i class="uil uil-schedule"></i> iCalendar (.ics)</a>
                                            <a href="javascript:void(0)" onclick="window.print()" class="dropdown-item"><i class="uil uil-print"></i> Print Calendar</a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Filter & Search Controls -->
                            <div class="cal-filter-bar">
                                <div class="cal-filters-left">
                                    <input type="text" class="form-input" style="width:220px;padding:6px 12px;font-size:13px;" placeholder="Search events, clients..." oninput="Calendar.onSearch(this.value)">
                                    <select class="form-select" style="width:160px;padding:6px 12px;font-size:13px;" onchange="Calendar.onTypeFilter(this.value)">
                                        <option value="all" ${this.filterType === 'all' ? 'selected' : ''}>All Events</option>
                                        <option value="booking" ${this.filterType === 'booking' ? 'selected' : ''}>✈️ Bookings</option>
                                        <option value="inquiry" ${this.filterType === 'inquiry' ? 'selected' : ''}>📋 Inquiries</option>
                                        <option value="leave" ${this.filterType === 'leave' ? 'selected' : ''}>🌴 Leaves</option>
                                        <option value="holiday" ${this.filterType === 'holiday' ? 'selected' : ''}>🎉 Holidays</option>
                                        <option value="meetings" ${this.filterType === 'meetings' ? 'selected' : ''}>👥 Meetings & Notes</option>
                                    </select>

                                    ${isAdmin ? `
                                        <select class="form-select" style="width:180px;padding:6px 12px;font-size:13px;" onchange="Calendar.onEmpFilter(this.value)">
                                            <option value="all" ${this.filterEmp === 'all' ? 'selected' : ''}>All Consultants</option>
                                            ${employees.map(e => `<option value="${e.id}" ${this.filterEmp === e.id ? 'selected' : ''}>${Utils.escape(e.name)}</option>`).join('')}
                                        </select>
                                    ` : ''}
                                </div>

                                <div class="cal-legend-bar">
                                    <span class="cal-legend-item"><span class="cal-dot dot-booking"></span> Booking</span>
                                    <span class="cal-legend-item"><span class="cal-dot dot-inquiry"></span> Inquiry</span>
                                    <span class="cal-legend-item"><span class="cal-dot dot-leave"></span> Leave</span>
                                    <span class="cal-legend-item"><span class="cal-dot dot-holiday"></span> Holiday</span>
                                    <span class="cal-legend-item"><span class="cal-dot dot-meeting"></span> Meeting</span>
                                    <span class="cal-legend-item"><span class="cal-dot dot-reminder"></span> Reminder</span>
                                    <span class="cal-legend-item"><span class="cal-dot" style="background:#0284c7;"></span> Week Off</span>
                                </div>
                            </div>
                        </div>

                        <!-- Calendar Body Container -->
                        <div class="cal-mobile-hint">
                            <i class="uil uil-arrows-h"></i> Swipe sideways to see all 7 days, or switch to <strong>Agenda</strong> view
                        </div>
                        <div id="calendarBodyContainer">
                            ${this.renderBody()}
                        </div>
                    </div>
                `;

                return Layout.render('Calendar & Schedule', innerHtml);
            },

            renderBody() {
                if (this.view === 'month') return this.renderMonthView();
                if (this.view === 'week') return this.renderWeekView();
                if (this.view === 'day') return this.renderDayView();
                if (this.view === 'agenda') return this.renderAgendaView();
                if (this.view === 'heatmap') return this.renderHeatmapView();
                return this.renderMonthView();
            },

            // Month View
            renderMonthView() {
                const u = Auth.getUser() || {};
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();
                const firstDayIndex = new Date(year, month, 1).getDay();
                const totalDays = new Date(year, month + 1, 0).getDate();
                const prevMonthDays = new Date(year, month, 0).getDate();

                const events = this.getAllEvents();
                const eventsByDate = {};
                events.forEach(ev => {
                    if (ev.date) {
                        const dStr = ev.date.slice(0, 10);
                        if (!eventsByDate[dStr]) eventsByDate[dStr] = [];
                        eventsByDate[dStr].push(ev);
                    }
                });

                const todayStr = new Date().toISOString().slice(0, 10);
                const holidays = Storage.getHolidays() || [];
                const holidayByDate = {};
                holidays.forEach(h => { if (h.date) holidayByDate[h.date] = h; });

                const targetEmpId = this.filterEmp !== 'all' ? this.filterEmp : u.id;

                let html = `
                    <div class="cal-grid-scroll-container">
                        <div class="cal-month-grid">
                            <div class="cal-weekday-headers">
                                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                            </div>
                            <div class="cal-grid-body">
                `;

                // Previous month padding days
                for (let i = firstDayIndex - 1; i >= 0; i--) {
                    const d = prevMonthDays - i;
                    html += `<div class="cal-day-cell other-month"><div class="cal-day-header"><span class="cal-day-number">${d}</span></div></div>`;
                }

                // Current month days
                for (let d = 1; d <= totalDays; d++) {
                    const curDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const isToday = curDateStr === todayStr;
                    const hol = holidayByDate[curDateStr];
                    const dayEvents = eventsByDate[curDateStr] || [];
                    const isWeekOff = Storage.isEmployeeWeekOff(targetEmpId, curDateStr);

                    // Performance highlight for Admin (>=2 bookings or >=3 inquiries)
                    const bCount = dayEvents.filter(e => e.type === 'booking').length;
                    const inqCount = dayEvents.filter(e => e.type === 'inquiry').length;
                    const isHighPerf = (bCount >= 2 || inqCount >= 3);

                    html += `
                        <div class="cal-day-cell ${isToday ? 'today' : ''}" onclick="Calendar.onCellClick('${curDateStr}')" style="cursor:pointer;" title="Click to preview events & schedule for ${curDateStr}">
                            <div class="cal-day-header">
                                <span class="cal-day-number">${d}</span>
                                <div class="cal-day-badges">
                                    ${isWeekOff ? `<span class="cal-holiday-indicator" style="background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;" title="Scheduled Week Off">🏖️ Week Off</span>` : ''}
                                    ${hol ? `<span class="cal-holiday-indicator" title="${Utils.escape(hol.name)}">🎉 ${Utils.escape(hol.name)}</span>` : ''}
                                    ${isHighPerf ? `<span class="cal-performance-badge" title="High Activity Day: ${bCount} Bookings, ${inqCount} Inquiries">⭐ Peak</span>` : ''}
                                </div>
                            </div>
                            <div class="cal-events-wrap" style="display:flex;flex-direction:column;gap:3px;margin-top:2px;">
                    `;

                    // Show up to 3 events, rest as +N more
                    const displayEvents = dayEvents.slice(0, 3);
                    displayEvents.forEach(ev => {
                        const pillClass = `event-${ev.type}`;
                        html += `
                            <div class="cal-event-pill ${pillClass}" onclick="event.stopPropagation(); Calendar.showEventModal('${ev.id}')" title="${Utils.escape(ev.title)}">
                                <span>${Utils.escape(ev.title)}</span>
                            </div>
                        `;
                    });

                    if (dayEvents.length > 3) {
                        const moreCount = dayEvents.length - 3;
                        html += `
                            <div class="cal-more-pill" onclick="event.stopPropagation(); Calendar.showDayPreviewModal('${curDateStr}')">
                                +${moreCount} more
                            </div>
                        `;
                    }

                    html += `</div></div>`;
                }

                // Next month padding days to fill 35 or 42 cells
                const totalCellsRendered = firstDayIndex + totalDays;
                const nextMonthCells = (totalCellsRendered <= 35 ? 35 : 42) - totalCellsRendered;
                for (let i = 1; i <= nextMonthCells; i++) {
                    html += `<div class="cal-day-cell other-month"><div class="cal-day-header"><span class="cal-day-number">${i}</span></div></div>`;
                }

                html += `</div></div></div>`;
                return html;
            },

            // Week View
            renderWeekView() {
                const start = new Date(this.currentDate);
                start.setDate(start.getDate() - start.getDay());
                const days = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(start);
                    d.setDate(d.getDate() + i);
                    days.push(d);
                }

                const events = this.getAllEvents();
                let html = `
                    <div class="cal-grid-scroll-container">
                        <div class="cal-month-grid">
                            <div class="cal-weekday-headers">
                                ${days.map(d => `<div>${d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</div>`).join('')}
                            </div>
                            <div class="cal-grid-body" style="min-height:450px;">
                `;

                days.forEach(d => {
                    const dStr = d.toISOString().slice(0, 10);
                    const isToday = dStr === new Date().toISOString().slice(0, 10);
                    const dayEvents = events.filter(e => e.date && e.date.slice(0, 10) === dStr);

                    html += `
                        <div class="cal-day-cell ${isToday ? 'today' : ''}" style="min-height:380px;" onclick="Calendar.onCellClick('${dStr}')">
                            <div class="cal-day-header">
                                <span class="cal-day-number">${d.getDate()}</span>
                            </div>
                            <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px;">
                                ${dayEvents.map(ev => `
                                    <div class="cal-event-pill event-${ev.type}" style="white-space:normal;padding:6px;" onclick="event.stopPropagation(); Calendar.showEventModal('${ev.id}')">
                                        <div style="font-size:10px;opacity:0.8;">${ev.time || 'All Day'}</div>
                                        <div style="font-weight:700;">${Utils.escape(ev.title)}</div>
                                        ${ev.notes ? `<div style="font-size:10px;color:#475569;">${Utils.escape(ev.notes.slice(0, 45))}</div>` : ''}
                                    </div>
                                `).join('')}
                                ${dayEvents.length === 0 ? '<div style="font-size:11px;color:#94a3b8;text-align:center;margin-top:20px;">No events</div>' : ''}
                            </div>
                        </div>
                    `;
                });

                html += `</div></div></div>`;
                return html;
            },

            // Day View
            renderDayView() {
                const dStr = this.currentDate.toISOString().slice(0, 10);
                const events = this.getAllEvents().filter(e => e.date && e.date.slice(0, 10) === dStr);
                const dayLabel = this.currentDate.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

                return `
                    <div class="calendar-header-card" style="gap:14px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;">
                            <div style="font-size:18px;font-weight:700;color:#1e293b;">${dayLabel}</div>
                            <button class="btn btn-primary btn-sm" onclick="Calendar.showAddEventModal('${dStr}')"><i class="uil uil-plus"></i> Add Event</button>
                        </div>
                        <div style="display:flex;flex-direction:column;gap:10px;">
                            ${events.map(ev => `
                                <div class="cal-agenda-item" style="border-radius:12px;border:1px solid #e2e8f0;cursor:pointer;" onclick="Calendar.showEventModal('${ev.id}')">
                                    <div style="display:flex;align-items:center;gap:12px;">
                                        <span class="cal-dot dot-${ev.type}" style="width:14px;height:14px;"></span>
                                        <div>
                                            <div style="font-weight:700;color:#1e293b;font-size:14px;">${Utils.escape(ev.title)}</div>
                                            <div style="font-size:12px;color:#64748b;">${ev.time || 'All Day'} • ${ev.category || ev.type} • Assigned: ${Utils.escape(ev.consultant || 'N/A')}</div>
                                            ${ev.notes ? `<div style="font-size:12px;color:#334155;margin-top:4px;">${Utils.escape(ev.notes)}</div>` : ''}
                                        </div>
                                    </div>
                                    <span class="badge badge-outline">${Utils.escape(ev.status || 'Active')}</span>
                                </div>
                            `).join('')}
                            ${events.length === 0 ? '<div style="text-align:center;padding:40px;color:#94a3b8;">No events scheduled for this day.</div>' : ''}
                        </div>
                    </div>
                `;
            },

            // Agenda View
            renderAgendaView() {
                const events = this.getAllEvents().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
                if (events.length === 0) {
                    return `<div class="calendar-header-card" style="text-align:center;padding:50px;color:#94a3b8;">No upcoming events matching your criteria.</div>`;
                }

                const groups = {};
                events.forEach(ev => {
                    const k = ev.date ? ev.date.slice(0, 10) : 'Upcoming';
                    if (!groups[k]) groups[k] = [];
                    groups[k].push(ev);
                });

                return `
                    <div class="cal-agenda-container">
                        ${Object.keys(groups).map(dateStr => {
                    const dateObj = new Date(dateStr);
                    const label = !isNaN(dateObj) ? dateObj.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : dateStr;
                    return `
                                <div class="cal-agenda-group">
                                    <div class="cal-agenda-date-hdr">
                                        <span><i class="uil uil-calendar-alt"></i> ${label}</span>
                                        <span style="font-size:12px;color:#64748b;font-weight:500;">${groups[dateStr].length} items</span>
                                    </div>
                                    ${groups[dateStr].map(ev => `
                                        <div class="cal-agenda-item" onclick="Calendar.showEventModal('${ev.id}')">
                                            <div style="display:flex;align-items:center;gap:14px;">
                                                <span class="cal-dot dot-${ev.type}" style="width:12px;height:12px;"></span>
                                                <div>
                                                    <div style="font-weight:700;color:#1e293b;font-size:13px;">${Utils.escape(ev.title)}</div>
                                                    <div style="font-size:12px;color:#64748b;">${ev.time || 'All Day'} • ${ev.category || ev.type} • ${Utils.escape(ev.consultant || '')}</div>
                                                </div>
                                            </div>
                                            <div style="display:flex;align-items:center;gap:8px;">
                                                <span class="badge badge-outline">${Utils.escape(ev.status || 'Active')}</span>
                                                <button class="btn btn-outline btn-sm" style="padding:4px 8px;"><i class="uil uil-eye"></i></button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `;
                }).join('')}
                    </div>
                `;
            },

            // Team Attendance Heatmap (Admin Only)
            renderHeatmapView() {
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();
                const totalDays = new Date(year, month + 1, 0).getDate();
                const employees = Storage.getEmployees() || [];
                const attendance = Storage.getAttendance() || [];

                const daysArray = [];
                for (let d = 1; d <= totalDays; d++) {
                    daysArray.push(d);
                }

                return `
                    <div class="cal-heatmap-card">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                            <div>
                                <h3 style="font-size:16px;font-weight:700;color:#1e293b;">Team Attendance Matrix & Heatmap</h3>
                                <div style="font-size:12px;color:#64748b;">Daily attendance overview across all staff for ${this.currentDate.toLocaleDateString('default', { month: 'long', year: 'numeric' })}</div>
                            </div>
                            <div class="cal-legend-bar" style="background:#ffffff;">
                                <span class="cal-legend-item"><span class="hm-cell hm-present" style="width:14px;height:14px;"></span> Present</span>
                                <span class="cal-legend-item"><span class="hm-cell hm-late" style="width:14px;height:14px;"></span> Late</span>
                                <span class="cal-legend-item"><span class="hm-cell hm-halfday" style="width:14px;height:14px;"></span> Half Day</span>
                                <span class="cal-legend-item"><span class="hm-cell hm-leave" style="width:14px;height:14px;"></span> Leave</span>
                                <span class="cal-legend-item"><span class="hm-cell" style="background:#bae6fd;color:#0369a1;width:14px;height:14px;">🏖️</span> Week Off</span>
                                <span class="cal-legend-item"><span class="hm-cell hm-absent" style="width:14px;height:14px;"></span> Absent</span>
                            </div>
                        </div>

                        <div style="overflow-x:auto;">
                            <table class="cal-heatmap-table">
                                <thead>
                                    <tr>
                                        <th style="text-align:left;min-width:180px;">Team Member</th>
                                        ${daysArray.map(d => {
                    const dayDate = new Date(year, month, d);
                    const isWeekend = dayDate.getDay() === 0;
                    return `<th style="color:${isWeekend ? '#0284c7' : '#334155'};">${d}</th>`;
                }).join('')}
                                        <th style="min-width:60px;">Days</th>
                                        <th style="min-width:60px;">Late</th>
                                        <th style="min-width:60px;">Leaves</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${employees.map(emp => {
                    let daysWorked = 0;
                    let lateMarks = 0;
                    let leaveCount = 0;

                    const dayCells = daysArray.map(d => {
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        const dateObj = new Date(year, month, d);
                        const isFuture = dateObj > new Date();
                        const isEmpWeekOff = Storage.isEmployeeWeekOff(emp.id, dateStr);

                        const rec = attendance.find(a => a.empId === emp.id && a.date === dateStr);
                        let cellClass = 'hm-absent';
                        let title = 'Absent';
                        let cellContent = '';

                        if (isFuture) {
                            cellClass = 'hm-future';
                            title = 'Future date';
                        } else if (rec) {
                            if (rec.leaveType || rec.status === 'leave') {
                                cellClass = 'hm-leave';
                                title = `Leave: ${rec.leaveType || 'General'}`;
                                leaveCount++;
                                cellContent = 'P';
                            } else if (rec.status === 'late' || (rec.checkIn && rec.checkIn > '09:45')) {
                                cellClass = 'hm-late';
                                title = `Late: ${rec.checkIn} - ${rec.checkOut || 'Open'}`;
                                daysWorked++;
                                lateMarks++;
                                cellContent = 'L';
                            } else if (rec.hours && Number(rec.hours) < 4.5) {
                                cellClass = 'hm-halfday';
                                title = `Half Day: ${rec.hours} hrs`;
                                daysWorked += 0.5;
                                cellContent = 'H';
                            } else {
                                cellClass = 'hm-present';
                                title = `Present: ${rec.checkIn || '09:30'} - ${rec.checkOut || '18:30'} (${rec.hours || 9}h)`;
                                daysWorked++;
                                cellContent = '✓';
                            }
                        } else if (isEmpWeekOff) {
                            cellClass = 'hm-weekend';
                            title = `${emp.name}: Scheduled Week Off`;
                            cellContent = '🏖️';
                        }

                        return `
                                                <td>
                                                    <span class="hm-cell ${cellClass}" style="${cellClass === 'hm-weekend' ? 'background:#bae6fd;color:#0369a1;' : ''}" title="${emp.name} (${dateStr}): ${title}">
                                                        ${cellContent}
                                                    </span>
                                                </td>
                                            `;
                    }).join('');

                    return `
                                            <tr>
                                                <td class="emp-name-col">
                                                    <div>${Utils.escape(emp.name)}</div>
                                                    <div style="font-size:10px;color:#64748b;">${Utils.escape(emp.rank || 'Consultant')}</div>
                                                </td>
                                                ${dayCells}
                                                <td style="text-align:center;font-weight:700;color:#10b981;">${daysWorked}</td>
                                                <td style="text-align:center;font-weight:700;color:#f59e0b;">${lateMarks}</td>
                                                <td style="text-align:center;font-weight:700;color:#8b5cf6;">${leaveCount}</td>
                                            </tr>
                                        `;
                }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            // Employee Leave Balance Widget
            renderEmployeeLeaveWidget(u) {
                const comp = Storage.getCompanySettings();
                const totalPaid = Number(comp.privilegeLeaves) || 15;
                const totalSick = Number(comp.sickLeaves) || 10;
                const totalCasual = Number(comp.casualLeaves) || 12;

                const att = Storage.getAttendance() || [];
                const myLeaves = att.filter(a => a.empId === u.id && (a.leaveType || a.status === 'leave'));

                const usedPaid = myLeaves.filter(l => (l.leaveType || '').toLowerCase().includes('annual') || (l.leaveType || '').toLowerCase().includes('privilege')).length;
                const usedSick = myLeaves.filter(l => (l.leaveType || '').toLowerCase().includes('sick')).length;
                const usedCasual = myLeaves.filter(l => (l.leaveType || '').toLowerCase().includes('casual')).length;

                return `
                    <div class="emp-cal-summary-row">
                        <div class="emp-leave-card">
                            <div>
                                <div style="font-size:12px;color:#64748b;font-weight:600;">Annual / Paid Leaves</div>
                                <div class="emp-leave-num">${totalPaid - usedPaid} <span style="font-size:13px;color:#94a3b8;font-weight:500;">/ ${totalPaid} left</span></div>
                            </div>
                            <span class="nav-icon-3d" style="background:#eff6ff;color:#2563eb;"><i class="uil uil-sun"></i></span>
                        </div>
                        <div class="emp-leave-card">
                            <div>
                                <div style="font-size:12px;color:#64748b;font-weight:600;">Sick Leaves</div>
                                <div class="emp-leave-num" style="color:#059669;">${totalSick - usedSick} <span style="font-size:13px;color:#94a3b8;font-weight:500;">/ ${totalSick} left</span></div>
                            </div>
                            <span class="nav-icon-3d" style="background:#ecfdf5;color:#059669;"><i class="uil uil-medkit"></i></span>
                        </div>
                        <div class="emp-leave-card">
                            <div>
                                <div style="font-size:12px;color:#64748b;font-weight:600;">Casual Leaves</div>
                                <div class="emp-leave-num" style="color:#8b5cf6;">${totalCasual - usedCasual} <span style="font-size:13px;color:#94a3b8;font-weight:500;">/ ${totalCasual} left</span></div>
                            </div>
                            <span class="nav-icon-3d" style="background:#f5f3ff;color:#8b5cf6;"><i class="uil uil-coffee"></i></span>
                        </div>
                        <div class="emp-leave-card" style="cursor:pointer;" onclick="Calendar.showApplyLeaveModal()">
                            <div>
                                <div style="font-size:13px;font-weight:700;color:#1e293b;">Need Time Off?</div>
                                <div style="font-size:11px;color:#64748b;">Request approval from boss</div>
                            </div>
                            <button class="btn btn-primary btn-sm" style="padding:6px 12px;"><i class="uil uil-plus"></i> Apply</button>
                        </div>
                    </div>
                `;
            },

            onCellClick(dateStr) {
                this.showDayPreviewModal(dateStr);
            },

            // Day Preview Modal (displays preview of all data for clicked day)
            showDayPreviewModal(dateStr) {
                const u = Auth.getUser() || {};
                const targetEmpId = this.filterEmp !== 'all' ? this.filterEmp : u.id;
                const dateObj = new Date(dateStr + 'T12:00:00');
                const formattedDate = dateObj.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

                const holidays = Storage.getHolidays() || [];
                const hol = holidays.find(h => h.date === dateStr);
                const isWeekOff = Storage.isEmployeeWeekOff(targetEmpId, dateStr);

                const events = this.getAllEvents().filter(e => e.date && e.date.slice(0, 10) === dateStr);

                let headerBadges = '';
                if (isWeekOff) {
                    headerBadges += `<span class="badge" style="background:#e0f2fe;color:#0369a1;font-weight:700;padding:5px 12px;font-size:12px;"><i class="uil uil-desert"></i> Scheduled Week Off</span> `;

            exportICS() {
                const events = this.getAllEvents();
                let ics = [
                    'BEGIN:VCALENDAR',
                    'VERSION:2.0',
                    'PRODID:-//AJ Tours & Travels//Travel Desk Calendar//EN',
                    'CALSCALE:GREGORIAN',
                    'METHOD:PUBLISH',
                    'X-WR-CALNAME:AJ Tours & Travels Calendar'
                ];

                events.forEach(ev => {
                    const cleanDate = (ev.date || '').replace(/[^0-9]/g, '');
                    if (!cleanDate) return;
                    const startStr = cleanDate.length === 8 ? `${cleanDate}T090000Z` : cleanDate;
                    const endStr = cleanDate.length === 8 ? `${cleanDate}T180000Z` : cleanDate;

                    ics.push('BEGIN:VEVENT');
                    ics.push(`UID:AJ-${ev.id}-${cleanDate}@ajtravels.co.uk`);
                    ics.push(`DTSTAMP:${cleanDate}T000000Z`);
                    ics.push(`DTSTART:${startStr}`);
                    ics.push(`DTEND:${endStr}`);
                    ics.push(`SUMMARY:${(ev.title || 'Event').replace(/[\n\r]/g, ' ')}`);
                    ics.push(`DESCRIPTION:${(ev.notes || '').replace(/[\n\r]/g, ' ')}`);
                    ics.push(`STATUS:CONFIRMED`);
                    ics.push('END:VEVENT');
                });

                ics.push('END:VCALENDAR');
                const icsContent = ics.join('\\r\\n');

                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AJ_Calendar_${new Date().toISOString().slice(0, 10)}.ics`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 250);
                Utils.showToast('iCalendar Exported', 'Downloaded .ics file. Import it to Google Calendar, Apple Calendar or Outlook.');
            },

                                <button type="button" class="auth-tab ${activeTab === 'signup' ? 'active' : ''}" id="tabNewEmployee" onclick="Router.switchAuthTab('signup')">New employee</button>
                            </div>

                            <!-- Sign In Form -->
                            <form id="loginForm" class="${activeTab === 'signin' ? '' : 'hidden'}">
                                <div class="auth-input-group">
                                    <label class="auth-label" for="loginEmail">Email address</label>
                                    <input type="text" id="loginEmail" class="auth-input" placeholder="name@company.co.uk" required autocomplete="email">
                                </div>
                                <div class="auth-input-group">
                                    <label class="auth-label" for="loginPassword">Password</label>
                                    <div class="auth-password-wrapper">
                                        <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
                                        <button type="button" class="auth-password-toggle" onclick="Utils.togglePassword('loginPassword', this)" title="Toggle password visibility" tabindex="-1">👁</button>
                                    </div>
                                </div>
                                <button type="submit" class="auth-submit-btn" id="loginBtn">Sign in</button>

                                <div class="auth-meta-row">
                                    <a href="javascript:void(0)" class="auth-forgot-link" onclick="Router.showForgotPassword()">Forgot password?</a>
                                    <span class="auth-method-label">Email & password sign-in</span>
                                </div>
                            </form>

                            <!-- New Employee Form -->
                            <form id="signupForm" class="${activeTab === 'signup' ? '' : 'hidden'}">
                                <div class="auth-input-group">
                                    <label class="auth-label">Full Name *</label>
                                    <input type="text" id="suName" class="auth-input" placeholder="Jane Doe" required>
                                </div>
                                <div class="auth-input-group">
                                    <label class="auth-label">Contact No. *</label>
                                    <input type="text" id="suContact" class="auth-input" placeholder="+44 7123 456789" required>
                                </div>
                                <div class="auth-input-group">
                                    <label class="auth-label">Employee Email *</label>
                                    <input type="email" id="suEmail" class="auth-input" placeholder="name@company.co.uk" required>
                                </div>
                                <div class="auth-input-group">
                                    <label class="auth-label">Password *</label>
                                    <div class="auth-password-wrapper">
                                        <input type="password" id="suPassword" class="auth-input" placeholder="••••••••" required>
                                        <button type="button" class="auth-password-toggle" onclick="Utils.togglePassword('suPassword', this)" tabindex="-1">👁</button>
                                    </div>
                                </div>
                                <div class="auth-input-group">
                                    <label class="auth-label">Confirm Password *</label>
                                    <div class="auth-password-wrapper">
                                        <input type="password" id="suPassword2" class="auth-input" placeholder="••••••••" required>
                                        <button type="button" class="auth-password-toggle" onclick="Utils.togglePassword('suPassword2', this)" tabindex="-1">👁</button>
                                    </div>
                                </div>
                                <div style="margin-bottom: 12px;">
                                    <button type="button" class="btn btn-outline w-full" style="font-size:12.5px; padding:7px 12px;" onclick="Router.generateSignupOtp()">Generate demo OTP</button>
                                    <div id="otpBox" class="otp-box hidden" style="margin-top:8px; padding:8px 12px; background:var(--secondary); border-radius:6px; font-size:12.5px;">Demo OTP: <strong id="otpDisplay" style="color:var(--primary); letter-spacing:2px;">------</strong></div>
                                </div>
                                <div class="auth-input-group">
                                    <label class="auth-label">Enter 6-digit OTP *</label>
                                    <input type="text" id="suOtp" class="auth-input" maxlength="6" placeholder="123456" required>
                                </div>
                                <button type="submit" class="auth-submit-btn" id="suBtn">Create employee account</button>
                            </form>
                        </div>

                        <!-- Notice Box -->
                        <div class="auth-notice-box">
                            New employee accounts need admin approval before portal data becomes available. Ask your AJ Tours & Travel administrator if you cannot access an account.
                        </div>
                    </div>
                </div>
            </div>`;
                setTimeout(() => document.querySelector('.auth-split-card')?.classList.add('animate'), 30);
                this.bindAuthEvents();
            },

            switchAuthTab(tab) {
                const isSignIn = tab === 'signin';
                document.getElementById('tabSignIn')?.classList.toggle('active', isSignIn);
                document.getElementById('tabNewEmployee')?.classList.toggle('active', !isSignIn);
                document.getElementById('loginForm')?.classList.toggle('hidden', !isSignIn);
                document.getElementById('signupForm')?.classList.toggle('hidden', isSignIn);
                const h = document.getElementById('authHeading');
                const s = document.getElementById('authSubheading');
                if (h) h.textContent = isSignIn ? 'Sign in to your travel desk' : 'Request employee access';
                if (s) s.textContent = isSignIn ? 'Use your AJ Tours & Travel employee email and password.' : 'Register your employee credentials with OTP verification.';
            },

            bindAuthEvents() {
                const loginForm = document.getElementById('loginForm');
                if (loginForm) {
                    loginForm.onsubmit = async e => {
                        e.preventDefault();
                        const btn = document.getElementById('loginBtn');
                        if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
                        const res = await Auth.login(
                            document.getElementById('loginEmail').value.trim(),
                            document.getElementById('loginPassword').value
                        );
                        if (btn) { btn.disabled = false; btn.textContent = 'Sign in'; }
                        if (res.success) {
                            Utils.showToast('Welcome', 'Sign-in successful');
                            this.navigate('dashboard');
                        } else {
                            Utils.showToast('Sign-in Failed', res.error, 'error');
                        }
                    };
                }

                const signupForm = document.getElementById('signupForm');
                if (signupForm) {
                    signupForm.onsubmit = async e => {
                        e.preventDefault();
                        const p1 = document.getElementById('suPassword').value;
                        const p2 = document.getElementById('suPassword2').value;
                        if (p1 !== p2) {
                            Utils.showToast('Error', 'Passwords do not match', 'error');
                            return;
                        }
                        if (!this._signupOtp) {
                            Utils.showToast('OTP Required', 'Please generate and enter the demo OTP', 'error');
                            return;
                        }
                        const btn = document.getElementById('suBtn');
                        if (btn) { btn.disabled = true; btn.textContent = 'Creating account…'; }
                        const res = await Auth.signupFirebase({
                            fullName: document.getElementById('suName').value,
                            contact: document.getElementById('suContact').value,
                            email: document.getElementById('suEmail').value,
                            password: p1,
                            otp: document.getElementById('suOtp').value,
                            expectedOtp: this._signupOtp
                        });
                        if (btn) { btn.disabled = false; btn.textContent = 'Create employee account'; }
                        if (res.success) {
                            Utils.showToast('Account Created', 'Your employee account is pending approval');
                            this.switchAuthTab('signin');
                        } else {
                            Utils.showToast('Registration Error', res.error, 'error');
                        }
                    };
                }
            },

            renderSignup() {
                this.renderLogin('signup');
            },

            showForgotPassword() {
                Modal.show(
                    'Reset your password',
                    `<div class="space-y-4">
                        <p style="font-size:13.5px; color:var(--muted-foreground);">Enter your registered employee email address below. We'll send you a password reset link.</p>
                        <div class="auth-input-group">
                            <label class="auth-label">Employee Email address</label>
                            <input type="email" id="resetEmail" class="auth-input" placeholder="name@company.co.uk" required>
                        </div>
                        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
                            <button type="button" class="btn btn-outline" onclick="this.closest('.modal-overlay')?.remove()">Cancel</button>
                            <button type="button" class="btn btn-primary" id="sendResetBtn" onclick="Router.handlePasswordReset(this)">Send reset link</button>
                        </div>
                    </div>`,
                    'Account recovery'
                );
            },

            async handlePasswordReset(btn) {
                const input = document.getElementById('resetEmail');
                const email = (input?.value || '').trim();
                if (!email) {
                    Utils.showToast('Error', 'Please enter your email address', 'error');
                    return;
                }
                btn.disabled = true;
                btn.textContent = 'Sending…';
                try {
                    if (window.Firebase?.auth && window.Firebase?.sendPasswordResetEmail) {
                        await window.Firebase.sendPasswordResetEmail(window.Firebase.auth, email);
                    }
                    Utils.showToast('Email Sent', `Password reset instructions sent to ${email}`);
                    btn.closest('.modal-overlay')?.remove();
                } catch (e) {
                    Utils.showToast('Reset Requested', `Password reset instructions have been dispatched for ${email}`);
                    btn.closest('.modal-overlay')?.remove();
                }
            },
            generateSignupOtp() {
                this._signupOtp = String(Math.floor(100000 + Math.random() * 900000));
                const box = document.getElementById('otpBox');
                const disp = document.getElementById('otpDisplay');
                if (box) { box.classList.remove('hidden'); }
                if (disp) disp.textContent = this._signupOtp;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            Theme.init();
            Auth.init();
            Router.navigate(Auth.isAuthenticated() ? (window.location.hash.slice(1) || 'dashboard') : 'login');
            window.addEventListener('hashchange', () => Router.navigate(window.location.hash.slice(1) || 'dashboard'));
            document.addEventListener('click', e => {
                const nav = e.target.closest('.nav-item');
                if (nav?.dataset?.page) Router.navigate(nav.dataset.page);
            });
        });
        window.addEventListener('firebase-ready', () => {
            const u = Auth.getUser();
            if (u?.source === 'firebase' && window.Firebase?.auth) {
                // Wait for Firebase to fully restore the auth session before listening to the database
                // If we listen before auth is restored, Firestore denies permission and kills the listener!
                window.Firebase.onAuthStateChanged(window.Firebase.auth, (user) => {
                    if (user) {
                        Auth.firebaseUser = user;
                        FirestoreSync.init();
                    }
                });
            }
        });
    </script>
</body>

</html>
