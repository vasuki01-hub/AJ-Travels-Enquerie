            change(type, val) { this[type] = val; this.update(); },
            update() {
                const list = this.filter();
                const status = this.statusData(list);
                const rev = this.revenueData();
                const profit = this.profitData();
                document.getElementById('totalInq').textContent = list.length;
                const succ = list.filter(i => i.status === 'Successful').length;
                document.getElementById('successRate').textContent = list.length ? Math.round(succ / list.length * 100) + '%' : '0%';
                document.getElementById('totalRev').textContent = Utils.formatCurrency(rev.reduce((a, [, v]) => a + v, 0));

                this.renderChart('statusChart', 'bar', status.map(([l]) => l), [
                    { label: 'Success', data: status.map(([, d]) => d.success || 0), backgroundColor: 'hsl(142,76%,36%)' },
                    { label: 'Process', data: status.map(([, d]) => d.process || 0), backgroundColor: 'hsl(38,92%,50%)' },
                    { label: 'Fail', data: status.map(([, d]) => d.fail || 0), backgroundColor: 'hsl(0,74%,51%)' }
                ]);
                this.renderChart('revenueChart', 'line', rev.map(([l]) => l), [{
                    label: 'Sales revenue', data: rev.map(([, v]) => v), borderColor: 'hsl(200,95%,42%)', backgroundColor: 'hsla(200,95%,42%,.1)', tension: 0.3, fill: true
                }]);
                this.renderChart('profitChart', 'bar', profit.map(([l]) => l), [{
                    label: 'Net profit', data: profit.map(([, v]) => v), backgroundColor: 'hsl(185,85%,45%)'
                }]);
            },
            bookingScope() {
                let list = Storage.getBookings();
                const u = Auth.getUser();
                if (u.role === 'employee') list = list.filter(b => b.employeeId === u.id);
                else if (this.emp !== 'all') list = list.filter(b => b.employeeId === this.emp);
                return list;
            },
            bookingPeriodDate(b) {
                const raw = b.issuedDate || b.closingDate || b.travelDate;
                return Utils.parseDateOnly(raw) || new Date(raw);
            },
            filter() {
                let list = Storage.getInquiries();
                const u = Auth.getUser();
                if (u.role === 'employee') list = list.filter(i => i.employeeId === u.id);
                else if (this.emp !== 'all') list = list.filter(i => i.employeeId === this.emp);
                return list;
            },
            statusData(list) {
                const map = new Map();
                list.forEach(i => {
                    const d = new Date(i.inquiryDate);
                    const key = this.key(d);
                    if (!map.has(key)) map.set(key, { success: 0, process: 0, fail: 0 });
                    const s = map.get(key);
                    if (i.status === 'Successful') s.success++;
                    else if (i.status === 'Under Process') s.process++;
                    else s.fail++;
                });
                return Array.from(map);
            },
            revenueData() {
                const map = new Map();
                this.bookingScope().forEach(b => {
                    const d = this.bookingPeriodDate(b);
                    const key = this.key(d);
                    map.set(key, (map.get(key) || 0) + Utils.salesAmount(b));
                });
                return Array.from(map);
            },
            profitData() {
                const map = new Map();
                this.bookingScope().forEach(b => {
                    const d = this.bookingPeriodDate(b);
                    const key = this.key(d);
                    map.set(key, (map.get(key) || 0) + Utils.profitAmount(b));
                });
                return Array.from(map);
            },
            key(d) {
                if (this.period === 'weekly') return `Week ${Math.floor(d.getDate() / 7) + 1}`;
                if (this.period === 'monthly') return d.toLocaleString('default', { month: 'short', year: 'numeric' });

            }

                    </div>
                </div>

                <div class="card" style="border-color:var(--destructive);">
                    <div class="card-header">
                        <div class="card-title" style="color:var(--destructive);">Danger Zone</div>
                        <div class="card-description">Irreversible actions — proceed with caution</div>
                    </div>
                    <div class="card-content">
                        <div class="settings-row">
                            <div>
                                <div class="settings-row-title" style="color:var(--destructive);">Delete Account</div>
                                <div class="settings-row-desc">Permanently delete your account and all associated data. This cannot be undone.</div>
                            </div>
                            <button class="btn" style="background:var(--destructive);color:#fff;" onclick="Settings.confirmDeleteAccount()">
                                🗑 Delete Account
                            </button>
                        </div>
                        <div class="settings-row" style="margin-top:12px;">
                            <div>
                                <div class="settings-row-title">Sign Out</div>
                                <div class="settings-row-desc">Log out of your current session</div>
                            </div>
                            <button class="btn btn-outline" onclick="handleLogout()">Logout</button>
                        </div>
                    </div>
                </div>
            </div>`;
                return Layout.render('Settings', content);
            },
            confirmDeleteAccount() {
                const u = Auth.getUser();
                const isDemo = u?.source === 'demo';
                const html = `
            <div style="text-align:center;padding:8px 0">
                <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
                <p style="font-size:16px;font-weight:600;color:var(--destructive);margin-bottom:8px;">Delete your account permanently?</p>
                <p style="font-size:14px;color:var(--muted-foreground);margin-bottom:24px;">
                    ${isDemo ? 'Demo accounts cannot be deleted. This action is only available for registered Firebase accounts.' : 'This will permanently delete your account and all your data. <strong>This action cannot be undone.</strong>'}
                </p>
                ${isDemo ? '' : `
                <p style="font-size:14px;margin-bottom:16px;">Please type <strong>DELETE</strong> to confirm:</p>
                <input type="text" id="deleteConfirmInput" class="form-input" placeholder="Type DELETE here" style="text-align:center;letter-spacing:4px;font-weight:bold;">
                `}
                <div style="display:flex;gap:12px;margin-top:20px;">
                    <button class="btn btn-outline w-full" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                    ${isDemo ? '' : `<button class="btn w-full" style="background:var(--destructive);color:#fff;" id="confirmDeleteBtn" onclick="Settings.executeDeleteAccount(this)">Delete Account</button>`}
                </div>
            </div>`;
                Modal.show('Delete Account', html, '');
            },
            async executeDeleteAccount(btn) {
                const input = document.getElementById('deleteConfirmInput');
                if (!input || input.value.trim() !== 'DELETE') {
                    Utils.showToast('Error', 'Please type DELETE to confirm', 'error');
                    return;
                }
                btn.disabled = true;
                btn.textContent = 'Deleting…';
                const result = await Auth.deleteAccount();
                if (result.success) {
                    Utils.showToast('Account deleted', 'Your account has been permanently deleted');
                    setTimeout(() => Router.navigate('login'), 1500);
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Delete Account';
                    Utils.showToast('Error', result.error, 'error');
                }
            }
        };

        
        /* ---------- Employees Module (Admin Portal) ---------- */
        const Employees = {
            render() {
                const u = Auth.getUser();
                if (u?.role !== 'admin') return '<div class="card p-6">Access Denied</div>';
                const employees = Storage.getEmployees();
                const content = `
            <div class="space-y-6">
                <div class="card">
                    <div class="card-header card-header-flex">
                        <div>
                            <div class="card-title">Employee Management</div>
                            <div class="card-description">Approve, deactivate, set ranks, or reset passwords for staff</div>
                        </div>
                        <button class="btn btn-primary" onclick="Dashboard.showAddEmployee()">Add New Employee</button>
                    </div>
                    <div class="card-content">
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Name &amp; Email</th>
                                        <th>Permanent UID</th>
                                        <th>Rank / Title</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${employees.length ? employees.map(e => `
                                        <tr>
                                            <td>
                                                <strong>${Utils.escapeHtml(e.name || e.fullName || '—')}</strong>
                                                <div class="text-muted" style="font-size:12px">${Utils.escapeHtml(e.email || '')}</div>
                                            </td>
                                            <td><span class="permanent-uid-badge">🔒 ${Utils.escapeHtml(e.uid || ('AJ-EMP-' + (e.id || '').slice(0, 8).toUpperCase()))}</span></td>
                                            <td><span class="rank-badge">${Utils.escapeHtml(e.rank || (e.role === 'admin' ? 'Managing Director' : 'Travel Consultant'))}</span></td>
                                            <td>${Utils.escapeHtml(e.role || 'employee')}</td>
                                            <td>
                                                <span class="badge ${e.status === 'disabled' ? 'badge-danger' : e.status === 'pending' ? 'badge-warning' : 'badge-success'}">
                                                    ${Utils.escapeHtml(e.status || 'active')}
                                                </span>
                                            </td>
                                            <td>
                                                <div style="display:flex;gap:6px">
                                                    ${e.status === 'pending' ? `
                                                        <button class="btn btn-sm btn-primary" onclick="Employees.approve('${e.id}')">Approve</button>
                                                        <button class="btn btn-sm btn-outline" style="color:var(--destructive)" onclick="Employees.reject('${e.id}')">Reject</button>
                                                    ` : ''}
                                                    ${e.status !== 'disabled' && e.id !== u.id ? `
                                                        <button class="btn btn-sm btn-outline" onclick="Employees.toggleStatus('${e.id}', 'disabled')">Deactivate</button>
                                                    ` : e.status === 'disabled' ? `
                                                        <button class="btn btn-sm btn-primary" onclick="Employees.toggleStatus('${e.id}', 'active')">Activate</button>
                                                    ` : ''}
                                                    <button class="btn btn-sm btn-outline" onclick="Employees.editRankRole('${e.id}')">Edit Rank</button>
                                                    <button class="btn btn-sm btn-outline" onclick="Employees.resetPassword('${e.email}')">Reset PW</button>
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="6" class="text-center text-muted py-6">No employee records in database.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>`;
                return Layout.render('Employee Management', content);
            },
            async approve(id) {
                const emp = Storage.getEmployees().find(x => x.id === id);
                if (emp) {
                    emp.status = 'active';
                    emp.rank = emp.rank || 'Travel Consultant';
                    emp.uid = emp.uid || ('AJ-EMP-' + id.slice(0, 8).toUpperCase());
                    await FirestoreSync.saveDoc('users', id, emp);
                    await Audit.log('approve_employee', id, { name: emp.name });
                    Utils.showToast('Approved', `Employee ${emp.name} approved and activated.`);
                    Router.navigate('employees');
                }
            },
            async reject(id) {
                if (!confirm('Are you sure you want to reject this employee registration?')) return;
                await FirestoreSync.deleteDoc('users', id);
                await Audit.log('reject_employee', id);
                Utils.showToast('Rejected', 'Employee registration rejected.');
                Router.navigate('employees');
            },
            async toggleStatus(id, newStatus) {
                const emp = Storage.getEmployees().find(x => x.id === id);
                if (emp) {
                    emp.status = newStatus;
                    await FirestoreSync.saveDoc('users', id, emp);
                    await Audit.log('status_change_employee', id, { status: newStatus });
                    Utils.showToast('Status Updated', `Employee status set to ${newStatus}.`);
                    Router.navigate('employees');
                }
            },
            async resetPassword(email) {
                if (!email) return;
                if (window.Firebase?.auth && window.Firebase?.sendPasswordResetEmail) {
                    try {
                        await window.Firebase.sendPasswordResetEmail(window.Firebase.auth, email);
                        await Audit.log('admin_reset_password', email);
                        Utils.showToast('Password Reset Dispatched', `Reset instructions sent to ${email}`);
                    } catch (e) {
                        Utils.showToast('Error', e.message || 'Failed to dispatch reset link', 'error');
                    }
                } else {
                    Utils.showToast('Password Reset', `Reset dispatched to ${email}`);
                }
            },
            editRankRole(id) {
                const emp = Storage.getEmployees().find(x => x.id === id);
                if (!emp) return;
                Modal.open({
                    title: 'Edit Rank & Role · ' + (emp.name || emp.fullName),
                    html: `
                        <form id="editRankForm" class="space-y-4">
                            <div class="form-group">
                                <label class="form-label">Rank / Job Title</label>
                                <input type="text" id="erRank" class="form-input" value="${Utils.escapeHtml(emp.rank || 'Travel Consultant')}" placeholder="e.g. Senior Specialist, Branch Manager">
                            </div>
                            <div class="form-group">
                                <label class="form-label">System Role</label>
                                <select id="erRole" class="form-select">
                                    <option value="employee" ${emp.role !== 'admin' ? 'selected' : ''}>Staff (Employee Travel Desk)</option>
                                    <option value="admin" ${emp.role === 'admin' ? 'selected' : ''}>Boss / Administrator (Full Access)</option>
                                </select>
                            </div>
                        </form>
                    `,
                    footer: `
                        <button class="btn btn-outline" onclick="Modal.close()">Cancel</button>
                        <button class="btn btn-primary" onclick="Employees.saveRankRole('${id}')">Save Changes</button>
                    `
                });
            },
            async saveRankRole(id) {
                const rank = document.getElementById('erRank')?.value?.trim();
                const role = document.getElementById('erRole')?.value;
                const emp = Storage.getEmployees().find(x => x.id === id);
                if (emp) {
                    emp.rank = rank;
                    emp.role = role;
                    await FirestoreSync.saveDoc('users', id, emp);
                    await Audit.log('edit_rank_role', id, { rank, role });
                    Modal.close();
                    Utils.showToast('Updated', 'Employee rank and role updated.');
                    Router.navigate('employees');
                }
            }
        };

        /* ---------- Activity & Audit Log Module (Admin Portal) ---------- */
        const AuditLogs = {
            render() {
                const u = Auth.getUser();
                if (u?.role !== 'admin') return '<div class="card p-6">Access Denied</div>';
                const logs = Audit.getLogs();
                const content = `
            <div class="space-y-6">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Activity &amp; Audit Log</div>
                        <div class="card-description">Tamper-evident trail of record additions, edits, deletions, reassignments, and logins</div>
                    </div>
                    <div class="card-content">
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Timestamp</th>
                                        <th>User / Staff</th>
                                        <th>Action</th>
                                        <th>Target / Ref</th>
                                        <th>Details</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${logs.length ? logs.map(l => {
                                        const act = l.action || '';
                                        const badgeClass = act.includes('delete') ? 'audit-delete' :
                                                           act.includes('create') ? 'audit-create' :
                                                           act.includes('reassign') ? 'audit-reassign' :
                                                           act.includes('auth') || act.includes('account') ? 'audit-auth' : 'audit-update';
                                        return `
                                            <tr>
                                                <td style="white-space:nowrap">${new Date(l.timestamp).toLocaleString()}</td>
                                                <td>
                                                    <strong>${Utils.escapeHtml(l.userName || 'System')}</strong>
                                                    <div class="text-muted" style="font-size:11px">${Utils.escapeHtml(l.userRole || '')}</div>
                                                </td>
                                                <td><span class="audit-badge ${badgeClass}">${Utils.escapeHtml(l.action)}</span></td>
                                                <td><code>${Utils.escapeHtml(l.entityId || 'general')}</code></td>
                                                <td style="font-size:12px;color:var(--muted-foreground)">${Utils.escapeHtml(typeof l.details === 'object' ? JSON.stringify(l.details) : String(l.details || ''))}</td>
                                            </tr>
                                        `;
                                    }).join('') : '<tr><td colspan="5" class="text-center text-muted py-6">No audit log records recorded yet.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>`;
                return Layout.render('Activity &amp; Audit Log', content);
            }
        };

        /* ---------- Router ---------- */
        const Router = {
            navigate(page) {
                if (page && page !== 'login') window.location.hash = page;
                // Close sidebar and remove overlay before navigation to prevent blur issues
                const sidebar = document.getElementById('sidebar');
                if (sidebar && sidebar.classList.contains('open')) {
                    toggleSidebar();
                }
                const overlay = document.querySelector('.sidebar-overlay');
                if (overlay) {
                    overlay.remove();
                }

                const publicPages = ['login', 'signup'];
                if (!Auth.isAuthenticated() && !publicPages.includes(page)) { this.renderLogin(); return; }
                const app = document.getElementById('app');
                let html = '';
                switch (page) {
                    case 'login': this.renderLogin(); return;
                    case 'signup': this.renderSignup(); return;
                    case 'dashboard': html = Dashboard.render(); break;
                    case 'my-bookings': html = MyBookings.render(); break;
                    case 'inquiries': html = Inquiries.render(); break;
                    case 'employees': html = Employees.render(); break;
                    case 'audit-logs': html = AuditLogs.render(); break;
                    case 'details': html = Details.render(); break;
                    case 'reports': html = Reports.render(); break;
                    case 'settings': html = Settings.render(); break;
                    default: html = Dashboard.render();
                }
                app.innerHTML = html;
                Layout.updateActiveNav(page);
                Theme.renderToggle();
                setTimeout(animateElements, 50);
                if (page === 'reports') setTimeout(() => Reports.update(), 100);
                if (page === 'my-bookings') setTimeout(() => MyBookings.afterRender(), 50);
                if (page === 'inquiries') {
                    Inquiries.previewId = null;
                    Preview.close();
                    setTimeout(() => { Inquiries.applyFilters(); animateElements(); }, 50);
                }
                if (page === 'details') setTimeout(() => { Details.refresh(); animateElements(); }, 50);
                const curSel = document.getElementById('currencySelect');
                if (curSel) curSel.value = Currency.getCode();
            },
            renderLogin() {
                // Ensure no overlay on login
                const overlay = document.querySelector('.sidebar-overlay');
                if (overlay) overlay.remove();
                const app = document.getElementById('app');
                app.innerHTML = `
            <div class="login-container">
                <div class="card login-card">
                    <div class="card-content">
                        <div class="login-header">
                            <div class="login-logo">AJ</div>
                            <h1>A J Travels</h1>
                            <p>Sign in to your account</p>
                        </div>
                        <form id="loginForm">
                            <div class="form-group">
                                <label class="form-label">Email or Contact</label>
                                <input type="text" id="loginEmail" class="form-input" placeholder="email@example.com or phone number" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                ${Utils.passwordInput('loginPassword')}
                            </div>
                            <button type="submit" class="btn btn-primary w-full" id="loginBtn">Sign In</button>
                        </form>
                        <div class="auth-links">
                            <a onclick="Router.navigate('signup')">Create account</a>
                        </div>
                    </div>
                </div>
            </div>`;
                setTimeout(() => document.querySelector('.login-card')?.classList.add('animate'), 50);
                document.getElementById('loginForm').onsubmit = async e => {
                    e.preventDefault();
                    const btn = document.getElementById('loginBtn');
                    btn.disabled = true; btn.textContent = 'Signing in…';
                    const res = await Auth.login(
                        document.getElementById('loginEmail').value.trim(),
                        document.getElementById('loginPassword').value
                    );
                    btn.disabled = false; btn.textContent = 'Sign In';
                    if (res.success) { Utils.showToast('Welcome', 'Login successful'); this.navigate('dashboard'); }
                    else Utils.showToast('Error', res.error, 'error');
                };
            },
            renderSignup() {
                const app = document.getElementById('app');
                app.innerHTML = `
            <div class="login-container">
                <div class="card login-card" style="max-width:480px">
                    <div class="card-content">
                        <div class="login-header"><div class="login-logo">AJ</div><h1>Create Account</h1><p>Register with OTP verification</p></div>
                        <form id="signupForm">
                            <div class="form-group"><label class="form-label">Full Name *</label><input type="text" id="suName" class="form-input" required></div>
                            <div class="form-group"><label class="form-label">Contact *</label><input type="text" id="suContact" class="form-input" required></div>
                            <div class="form-group"><label class="form-label">Email Id *</label><input type="email" id="suEmail" class="form-input" required></div>
                            <div class="form-group"><label class="form-label">Password *</label>${Utils.passwordInput('suPassword')}</div>
                            <div class="form-group"><label class="form-label">Confirm Password *</label>${Utils.passwordInput('suPassword2')}</div>
                            <button type="button" class="btn btn-outline w-full mb-4" onclick="Router.generateSignupOtp()">Generate demo OTP</button>
                            <div id="otpBox" class="otp-box hidden">Demo OTP: <strong id="otpDisplay">------</strong></div>
                            <div class="form-group"><label class="form-label">Enter OTP *</label><input type="text" id="suOtp" class="form-input" maxlength="6" placeholder="6-digit OTP" required></div>
                            <button type="submit" class="btn btn-primary w-full">Create Account</button>
                        </form>
                        <div class="auth-links"><a onclick="Router.navigate('user-login')">Already have an account?</a></div>
                    </div>
                </div>
            </div>`;
                this._signupOtp = null;
                setTimeout(() => document.querySelector('.login-card')?.classList.add('animate'), 50);
                document.getElementById('signupForm').onsubmit = async e => {
                    e.preventDefault();
                    const p1 = document.getElementById('suPassword').value;
                    const p2 = document.getElementById('suPassword2').value;
                    if (p1 !== p2) { Utils.showToast('Error', 'Passwords do not match', 'error'); return; }
                    if (!this._signupOtp) { Utils.showToast('OTP', 'Generate OTP first', 'error'); return; }
                    const btn = e.target.querySelector('button[type=submit]');
                    btn.disabled = true;
                    const res = await Auth.signupFirebase({
                        fullName: document.getElementById('suName').value,
                        contact: document.getElementById('suContact').value,
                        email: document.getElementById('suEmail').value,
                        password: p1,
                        otp: document.getElementById('suOtp').value,
                        expectedOtp: this._signupOtp
                    });
                    btn.disabled = false;
                    if (res.success) { Utils.showToast('Success', 'Account created'); this.navigate('dashboard'); }
                    else Utils.showToast('Error', res.error, 'error');
                };
            },
            generateSignupOtp() {
                this._signupOtp = String(Math.floor(100000 + Math.random() * 900000));
                const box = document.getElementById('otpBox');
                const disp = document.getElementById('otpDisplay');
                if (box) { box.classList.remove('hidden'); }
                if (disp) disp.textContent = this._signupOtp;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            Theme.init();
            Auth.init();
            Router.navigate(Auth.isAuthenticated() ? (window.location.hash.slice(1) || 'dashboard') : 'login');
            window.addEventListener('hashchange', () => Router.navigate(window.location.hash.slice(1) || 'dashboard'));
            document.addEventListener('click', e => {
                const nav = e.target.closest('.nav-item');
                if (nav?.dataset?.page) Router.navigate(nav.dataset.page);
            });
        });
        window.addEventListener('firebase-ready', () => {
            const u = Auth.getUser();
            if (u?.source === 'firebase' && window.Firebase?.auth) {
                // Wait for Firebase to fully restore the auth session before listening to the database
                // If we listen before auth is restored, Firestore denies permission and kills the listener!
                window.Firebase.onAuthStateChanged(window.Firebase.auth, (user) => {
                    if (user) {
                        Auth.firebaseUser = user;
                        FirestoreSync.init();
                    }
                });
            }
        });
    </script>
</body>

</html>
