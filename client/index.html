                                <div style="flex:1;min-width:200px">
                                    <label class="form-label" style="font-size:11px">Search Expenses</label>

            },
            afterRender() {
                const expenses = Storage.getExpenses();
                const catMap = { 'Rent': 0, 'Salaries': 0, 'Software': 0, 'Marketing': 0, 'Utilities': 0, 'Misc': 0 };
                expenses.forEach(e => {
                    const c = e.category || 'Misc';
                    catMap[c] = (catMap[c] || 0) + (Number(e.amount) || 0);
                });
                ChartHelper.createDonut3D('expensesDonutChart', {
                    labels: Object.keys(catMap),
                    data: Object.values(catMap),
                    colors: ['#ec4899', '#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#64748b'],
                    isCurrency: true,
                    centerSub: 'Total Overheads'
                });
            },
            applyFilterDOM() {
                const q = (this.searchQuery || '').toLowerCase();
                document.querySelectorAll('#expensesTable tbody tr').forEach(tr => {
                    const txt = tr.textContent.toLowerCase();
                    tr.style.display = txt.includes(q) ? '' : 'none';
                });
            },
            showAddModal(id = '') {
                const exp = id ? Storage.getExpenses().find(x => x.id === id) : null;

                    html: `

                                    <select id="expPaymentMode" class="form-select">
                                        ${['Online-Bank Transfer', 'Card', 'Cash', 'Direct Debit', 'Cheque'].map(m => `<option value="${m}" ${exp?.paymentMode === m ? 'selected' : ''}>${m}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Notes / Remarks</label>
                                <input type="text" id="expNotes" class="form-input" value="${Utils.escapeHtml(exp?.notes || '')}" placeholder="Additional notes, invoice ref, etc.">
                            </div>
                        </form>
                    `,
                    footer: `
                        <button class="btn btn-outline" onclick="Modal.close()">Cancel</button>
                        <button class="btn btn-primary" onclick="Expenses.save('${id || ''}')">${exp ? 'Update Expense' : 'Save Expense'}</button>
                    `
                });
            },
            save(id) {
                const title = document.getElementById('expTitle')?.value?.trim();
                const category = document.getElementById('expCategory')?.value;
                const amount = parseFloat(document.getElementById('expAmount')?.value) || 0;
                const date = document.getElementById('expDate')?.value;
                const paymentMode = document.getElementById('expPaymentMode')?.value;
                const notes = document.getElementById('expNotes')?.value?.trim() || '';

                if (!title || !amount || !date) return Utils.showToast('Validation Error', 'Title, amount, and date are required', 'error');

                const record = {
                    id: id || ('EXP-' + Date.now().toString().slice(-6)),
                    title,
                    category,
                    amount,
                    date,
                    paymentMode,
                    paidBy: Auth.getUser()?.name || 'Boss / Admin',
                    notes,
                    updatedAt: new Date().toISOString()
                };

                Storage.saveExpense(record);
                Modal.close();
                Utils.showToast('Expense Saved', `${title} (${Utils.formatCurrency(amount)}) saved successfully.`);
                Router.navigate('expenses');
            },
            deleteExpense(id) {
                if (!confirm('Are you sure you want to delete this expense record?')) return;
                Storage.deleteExpense(id);
                Utils.showToast('Deleted', 'Expense record removed.');
                Router.navigate('expenses');
            },
            exportPdf() {
                const list = Storage.getExpenses().sort((a, b) => String(b.date).localeCompare(String(a.date)));
                const headers = ['Sr. No.', 'ID', 'Date', 'Description', 'Category', 'Amount', 'Payment Mode', 'Notes'];
                let sr = 0;
                const rows = list.map(e => [++sr, e.id, Utils.formatDate(e.date), e.title || '', e.category || 'General', Utils.formatCurrency(e.amount || 0), e.paymentMode || '', e.notes || '']);
                ExportUtil.downloadPdf('Company_Expenses_Report', headers, rows, []);
            },
            exportExcel() {
                const list = Storage.getExpenses().sort((a, b) => String(b.date).localeCompare(String(a.date)));
                const headers = ['Sr. No.', 'ID', 'Date', 'Description', 'Category', 'Amount', 'Payment Mode', 'Notes'];
                let sr = 0;
                const rows = list.map(e => [++sr, e.id, Utils.formatDate(e.date), e.title || '', e.category || 'General', Number(e.amount) || 0, e.paymentMode || '', e.notes || '']);
                ExportUtil.downloadExcel('Company_Expenses_Report', headers, rows, []);
            }
        };

        /* ================= ATTENDANCE & SALARY PAYROLL MODULE ================= */
        const Attendance = {
            SECTION: 'attendance',

            render() {

                const todayStr = new Date().toISOString().slice(0, 10);
                const thisMonthStr = todayStr.slice(0, 7);
                const allRaw = Storage.getAllAttendanceRaw();

                const months = Array.from(new Set(allRaw.map(a => (a.date || '').slice(0, 7)).filter(Boolean))).sort().reverse();
                if (!months.includes(thisMonthStr)) months.unshift(thisMonthStr);

                const allLeavesRaw = Storage.getAllLeavesRaw() || [];
                const pendingLeavesCount = allLeavesRaw.filter(l => l.status === 'Pending').length;

            renderShiftsView(months, thisMonthStr) {
                const authU = Auth.getUser() || { id: 'anon', name: 'Employee', role: 'employee' };
                // Fetch the freshest employee profile to ensure shiftIn / shiftOut set by Admin is instantly visible
                const empRecord = Storage.getEmployees().find(e => e.id === authU.id) || authU;
                const u = { ...authU, ...empRecord };

                const shiftIn = u.shiftIn || '09:00';
                const shiftOut = u.shiftOut || '17:30';
                const [sH, sM] = shiftIn.split(':').map(Number);
                const graceMins = (sH * 60 + (sM || 0) + 15);
                const graceH = Math.floor(graceMins / 60) % 24;
                const graceM = graceMins % 60;
                const graceTimeStr = `${String(graceH).padStart(2, '0')}:${String(graceM).padStart(2, '0')}`;
                const shiftInDisplay = Utils.formatTime12(shiftIn);
                const shiftOutDisplay = Utils.formatTime12(shiftOut);
                const graceDisplay = Utils.formatTime12(graceTimeStr);

                // Clean up any phantom auto-clockin records created by timing setup
                const allRaw = Storage.getAllAttendanceRaw();
                const phantomRecords = allRaw.filter(a => a.notes === 'Assigned via staff timings setup' || a.notes === 'Admin customized timings');
                if (phantomRecords.length > 0) {
                    phantomRecords.forEach(p => Storage.deleteAttendanceRecord(p.id));
                }

                const myAllAttendance = Storage.getAllAttendanceRaw().filter(a => a.employeeId === u.id);
                const todayAttendance = Storage.getTodayAttendance(u.id);

                const targetMonth = this.selectedMonth === 'all' ? thisMonthStr : this.selectedMonth;
                const monthRecords = myAllAttendance.filter(a => (a.date || '').startsWith(targetMonth));
                const daysWorked = monthRecords.filter(a => a.clockIn && a.clockIn !== '—').length;
                const onTimeDays = monthRecords.filter(a => a.status === 'Present').length;
                const lateDays = monthRecords.filter(a => a.status === 'Late').length;
                const totalMinutes = monthRecords.reduce((acc, a) => acc + (a.durationMinutes || 0), 0);
                const totalHoursStr = `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m`;

                let statusBadge = `<span class="badge badge-secondary" style="font-size:12.5px;padding:6px 14px"><i class="uil uil-clock"></i> Shift: ${shiftInDisplay} – ${shiftOutDisplay} (Not Clocked In)</span>`;
                let isClockedIn = false;
                let isClockedOut = false;
                if (todayAttendance) {
                    if (todayAttendance.clockIn && todayAttendance.clockIn !== '—' && !todayAttendance.clockOut) {
                        isClockedIn = true;
                        statusBadge = `<span class="badge badge-success" style="font-size:12.5px;padding:6px 14px;animation:pulse 2s infinite">● Active Shift (Clocked in at ${todayAttendance.clockIn})</span>`;
                    } else if (todayAttendance.clockOut && todayAttendance.clockOut !== '—') {
                        isClockedOut = true;
                        statusBadge = `<span class="badge badge-primary" style="font-size:12.5px;padding:6px 14px">✓ Shift Completed (${todayAttendance.clockIn} – ${todayAttendance.clockOut})</span>`;
                    } else if (todayAttendance.status === 'On Leave') {
                        statusBadge = '<span class="badge badge-secondary" style="font-size:12.5px;padding:6px 14px">🌴 On Leave Today</span>';
                    }
                } else if (Storage.isEmployeeWeekOff(u.id, new Date().toISOString().slice(0, 10))) {
                    statusBadge = '<span class="badge" style="background:#e0f2fe;color:#0369a1;font-size:12.5px;padding:6px 14px;font-weight:700;"><i class="uil uil-desert"></i> Today is your Scheduled Week Off</span>';
                }

                const displayMyAttendance = myAllAttendance.filter(a => {
                    if (this.selectedMonth === 'all') return true;
                    return (a.date || '').startsWith(this.selectedMonth);
                }).sort((a, b) => String(b.date).localeCompare(String(a.date)));

                const adminTeamSection = u.role === 'admin' ? this.renderAdminTeamView(months) : '';

                const allLeavesRaw = Storage.getAllLeavesRaw() || [];
                const pendingLeavesCount = allLeavesRaw.filter(l => l.status === 'Pending').length;
                const pendingAlertBanner = (u.role === 'admin' && pendingLeavesCount > 0) ? `
                    <div style="background:linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);border:1.5px solid #fde68a;border-radius:18px;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 4px 12px rgba(245,158,11,0.08);margin-bottom:18px;">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <span class="nav-icon-3d" style="background:#fef3c7;color:#d97706;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:22px;"><i class="uil uil-bell"></i></span>
                            <div>
                                <div style="font-weight:700;color:#92400e;font-size:14.5px;">${pendingLeavesCount} Employee Leave Request(s) Pending Approval</div>
                                <div style="font-size:12px;color:#b45309;">Staff have applied for time off. Review and approve or reject requests.</div>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="Attendance.activeTab = 'leaves'; Router.navigate('attendance');">
                            <i class="uil uil-check-circle"></i> Review &amp; Approve <i class="uil uil-arrow-right"></i>
                        </button>
                    </div>
                ` : '';

                return `

                    ${pendingAlertBanner}
                    <div class="card attendance-hero" style="background:linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%);border:2px solid rgba(255,255,255,0.9);box-shadow:var(--neu-flat);border-radius:22px;">
                        <div class="card-content" style="padding:22px">

                                    <div class="welcome-kicker" style="color:var(--primary)"><i class="uil uil-clock-three"></i> DAILY TRAVEL DESK ATTENDANCE</div>
                                    <h2 style="font-size:23px;font-weight:700;margin:4px 0 2px">${Utils.escapeHtml(u.name)}</h2>
                                    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px">
                                        <p class="text-muted" style="font-size:13.5px;margin:0">
                                            <span id="attLiveDate">${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</span>
                                            <span style="margin:0 8px">·</span>
                                            <strong id="attLiveClock" style="font-size:16px;color:#0f172a;letter-spacing:0.5px">${new Date().toLocaleTimeString('en-GB')}</strong>
                                        </p>
                                        <div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:rgba(22,119,232,0.08);border:1.5px solid rgba(22,119,232,0.25);border-radius:20px;font-size:12.5px;font-weight:600;color:var(--primary)">
                                            <i class="uil uil-schedule" style="font-size:15px"></i> Assigned Shift: <strong>${shiftInDisplay} – ${shiftOutDisplay}</strong>
                                        </div>
                                    </div>
                                </div>
                                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
                                    ${statusBadge}
                                    ${todayAttendance?.clockIn && todayAttendance.clockIn !== '—' ? `<small class="text-muted">Clock In: <strong>${todayAttendance.clockIn}</strong> ${todayAttendance.clockOut ? `· Out: <strong>${todayAttendance.clockOut}</strong>` : ''}</small>` : ''}
                                </div>
                            </div>

                            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid #e2e8f0">
                                <div style="flex:1;min-width:220px">
                                    <input type="text" id="attNotes" class="form-input" placeholder="Work desk note (e.g. Front desk, Airport transfer, WFH)" value="${Utils.escapeHtml(todayAttendance?.notes || '')}">

                                <button class="btn btn-primary" onclick="Attendance.clockIn()" ${isClockedIn || isClockedOut ? 'disabled style="opacity:0.5"' : ''}>

            /* ---------- SALARY & PAYROLL FEATURE ---------- */
            calculateSalary(empId, monthStr) {
                const set = Storage.getSalarySettings(empId);
                const comp = Storage.getCompanySettings();
                const allRaw = Storage.getAllAttendanceRaw();
                const allLeaves = Storage.getAllLeavesRaw();
                const targetMonth = (!monthStr || monthStr === 'all') ? new Date().toISOString().slice(0, 7) : monthStr;

                const logs = allRaw.filter(a => a.employeeId === empId && (a.date || '').startsWith(targetMonth));
                const presentDays = logs.filter(a => a.status === 'Present').length;
                const lateDays = logs.filter(a => a.status === 'Late').length;
                const halfDays = logs.filter(a => a.status === 'Half-day').length;
                const earlyDays = logs.filter(a => a.durationMinutes && a.durationMinutes < 420 && a.status !== 'On Leave').length;

                // Differentiate Leave Types: Paid, Unpaid, Festive, Custom
                let paidLeaveDays = 0;
                let unpaidLeaveDays = 0;
                let festiveLeaveDays = 0;
                let otherLeaveDays = 0;

                logs.filter(a => a.status === 'On Leave').forEach(a => {
                    const lType = (a.leaveType || a.notes || '').toLowerCase();
                    if (lType.includes('unpaid') || lType.includes('without pay') || lType.includes('lwp')) {
                        unpaidLeaveDays++;
                    } else if (lType.includes('festive') || lType.includes('festival') || lType.includes('holiday')) {
                        festiveLeaveDays++;
                    } else if (lType.includes('annual') || lType.includes('sick') || lType.includes('casual') || lType.includes('paid')) {
                        paidLeaveDays++;
                    } else {
                        otherLeaveDays++;
                    }
                });

                const totalLeaveDays = paidLeaveDays + unpaidLeaveDays + festiveLeaveDays + otherLeaveDays;

                const baseSalary = Number(set.baseSalary) || Number(comp.baseSalary) || 2800;
                const workingDaysBasis = Number(comp.workingDaysBasis) || 26;
                const perDayRate = Number(set.perDayDeduction) || Math.round(baseSalary / workingDaysBasis);

                // Configurable penalties per day from Settings
                const latePenaltyPerDay = Number(set.latePenalty) || Number(comp.latePenalty) || 150;
                const earlyPenaltyPerDay = Number(set.earlyPenalty) || Number(comp.earlyPenalty) || 100;

                const unpaidLeaveDeduction = unpaidLeaveDays * perDayRate;
                const latePenalty = lateDays * latePenaltyPerDay;
                const earlyPenalty = earlyDays * earlyPenaltyPerDay;
                const halfDayDeduction = halfDays * Math.round(perDayRate / 2);
                const customDeductions = Number(set.customDeductions) || 0;

                const totalDeductions = unpaidLeaveDeduction + latePenalty + earlyPenalty + halfDayDeduction + customDeductions;
                const bonus = Number(set.bonus) || 0;
                const netSalary = Math.max(0, baseSalary + bonus - totalDeductions);

                return {
                    empId,
                    targetMonth,
                    set,
                    baseSalary,
                    presentDays,
                    lateDays,
                    halfDays,
                    earlyDays,
                    totalLeaveDays,
                    paidLeaveDays,
                    unpaidLeaveDays,
                    festiveLeaveDays,
                    otherLeaveDays,
                    perDayRate,
                    latePenaltyPerDay,
                    earlyPenaltyPerDay,
                    unpaidLeaveDeduction,
                    latePenalty,
                    earlyPenalty,
                    halfDayDeduction,
                    customDeductions,
                    totalDeductions,
                    bonus,
                    netSalary,
                    status: set.status || 'Pending',
                    notes: set.notes || ''
                };
            },

            onSalaryBaseInput() {

                const hintEl = document.getElementById('smPerDayHint');
                if (perDayEl && base > 0) {
                    const calculated = Math.round(base / workingDays);
                    perDayEl.value = calculated;
                    if (hintEl) {
                        hintEl.innerHTML = `<span style="color:#059669;font-weight:600">✓ Auto-calculated: ${Utils.formatCurrency(calculated)}/day (based on ${workingDays} working days)</span>`;
                    }
                }
            },

                const set = Storage.getSalarySettings(empId);

                Modal.open({
                    title: `Customize Salary &amp; Payroll · ${Utils.escapeHtml(emp.name || emp.fullName)}`,
                    html: `

            saveSalaryModal(empId) {
                const baseSalary = parseFloat(document.getElementById('smBase')?.value) || 28000;
                const perDayDeduction = parseFloat(document.getElementById('smPerDay')?.value) || 900;
                const latePenalty = parseFloat(document.getElementById('smLate')?.value) || 150;
                const earlyPenalty = parseFloat(document.getElementById('smEarly')?.value) || 100;
                const bonus = parseFloat(document.getElementById('smBonus')?.value) || 0;
                const customDeductions = parseFloat(document.getElementById('smDeductions')?.value) || 0;
                const status = document.getElementById('smStatus')?.value || 'Pending';
                const notes = document.getElementById('smNotes')?.value?.trim() || '';

                Storage.saveSalarySettings(empId, {
                    baseSalary,
                    perDayDeduction,
                    latePenalty,
                    earlyPenalty,
                    bonus,
                    customDeductions,
                    status,
                    notes
                });

                Modal.close();
                Utils.showToast('Salary Settings Saved', 'Payroll parameters updated.');

                const set = Storage.getSalarySettings(empId);
                const nextStatus = set.status === 'Paid' ? 'Pending' : 'Paid';
                Storage.saveSalarySettings(empId, { ...set, status: nextStatus });
                Utils.showToast('Payroll Status', `Salary marked as ${nextStatus}.`);
                Router.navigate('attendance');

            downloadSalarySlipPdf(empId, monthStr) {
                const emp = Storage.getEmployees().find(x => x.id === empId) || Auth.getUser();
                const calc = this.calculateSalary(empId, monthStr);
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait' });
                const pageWidth = doc.internal.pageSize.getWidth();

                // Branded Header Banner
                doc.setFillColor(22, 119, 232);
                doc.rect(0, 0, pageWidth, 28, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(15);
                doc.setFont('helvetica', 'bold');
                doc.text('AJ Tours & Travels', 14, 12);
                doc.setFontSize(9);
                doc.setFont('helvetica', 'normal');
                doc.text('World Wide Flight & Package Specialists · London, UK', 14, 18);
                doc.text('OFFICIAL SALARY DISBURSEMENT STATEMENT / PAYSLIP', 14, 24);

                // Meta Info Box
                doc.setTextColor(15, 23, 42);
                doc.setFontSize(11);
                doc.setFont('helvetica', 'bold');
                doc.text(`Employee: ${emp?.name || emp?.fullName || 'Staff Member'}`, 14, 38);
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8.5);
                doc.setTextColor(71, 85, 105);
                doc.text(`Designation: ${emp?.rank || 'Travel Consultant'}   |   Staff ID: ${emp?.uid || empId}`, 14, 44);
                doc.text(`Period: ${Utils.monthLabel(calc.targetMonth)}   |   Status: ${calc.status}   |   Issued: ${new Date().toLocaleDateString('en-GB')}`, 14, 50);

                // Table
                const headers = ['Compensation Component', 'Calculation Basis', 'Earnings', 'Deductions'];
                const rows = [
                    ['Basic Monthly Salary', 'Contracted Monthly Base', Utils.formatCurrency(calc.baseSalary), '—'],
                    ['Attendance Late Marks', `${calc.lateDays} Late arrivals (>9:30 AM)`, '—', Utils.formatCurrency(calc.latePenalty)],
                    ['Early Leave Penalties', `${calc.earlyDays} Early leave shift(s)`, '—', Utils.formatCurrency(calc.earlyPenalty)],
                    ['Half-Day Shift Penalties', `${calc.halfDays} Half-day shift(s)`, '—', Utils.formatCurrency(calc.halfDayDeduction)],
                    ['Custom Administrative Deductions', 'Authorised adjustments', '—', Utils.formatCurrency(calc.customDeductions)],
                    ['Sales Commission & Performance Bonus', 'Monthly Target Incentives', Utils.formatCurrency(calc.bonus), '—'],
                    ['TOTAL AMOUNT', 'Gross Earnings vs Total Deductions', Utils.formatCurrency(calc.baseSalary + calc.bonus), Utils.formatCurrency(calc.totalDeductions)]
                ];

                doc.autoTable({
                    head: [headers],
                    body: rows,
                    startY: 56,
                    theme: 'grid',
                    styles: {
                        fontSize: 8.5,
                        cellPadding: 3.5,
                        lineColor: [100, 116, 139],
                        lineWidth: 0.6,
                        textColor: [15, 23, 42]
                    },
                    headStyles: {
                        fillColor: [22, 119, 232],
                        textColor: [255, 255, 255],
                        fontStyle: 'bold',
                        fontSize: 9,
                        lineColor: [30, 41, 59],
                        lineWidth: 0.8
                    },
                    tableLineColor: [71, 85, 105],
                    tableLineWidth: 1
                });

                const finalY = doc.lastAutoTable.finalY + 12;

                // Net Pay Highlight Box
                doc.setFillColor(240, 247, 255);
                doc.setDrawColor(22, 119, 232);
                doc.setLineWidth(1);
                doc.roundedRect(14, finalY, pageWidth - 28, 22, 3, 3, 'FD');

                doc.setTextColor(3, 105, 161);
                doc.setFontSize(9.5);
                doc.setFont('helvetica', 'bold');
                doc.text('NET DISBURSABLE TAKE-HOME SALARY:', 20, finalY + 9);
                doc.setFontSize(14);
                doc.setTextColor(22, 119, 232);
                doc.text(Utils.formatCurrency(calc.netSalary), 20, finalY + 17);

                // Signatures
                const sigY = finalY + 45;
                doc.setFontSize(8.5);
                doc.setTextColor(100, 116, 139);
                doc.text('_________________________________', 20, sigY);
                doc.text('Authorized Signatory (Managing Director)', 20, sigY + 6);

                doc.text('_________________________________', pageWidth - 75, sigY);
                doc.text('Employee Acknowledgment', pageWidth - 75, sigY + 6);

                doc.save(`Payslip_${(emp?.name || 'Staff').replace(/\s+/g, '_')}_${calc.targetMonth}.pdf`);
            },

                const a = Storage.getAllAttendanceRaw().find(x => x.id === recordId);
                if (!a) return Utils.showToast('Error', 'Record not found', 'error');
                const u = Auth.getUser();
                const isAdmin = u?.role === 'admin';

                Modal.open({
                    title: `Edit Attendance · ${a.employeeName || 'Shift'}`,
                    html: `
                        <form id="editAttForm" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">

                                    </select>
                                </div>

                                    <label class="form-label">Notes / Reason</label>

                        <button class="btn btn-outline" onclick="Modal.close()">Cancel</button>

                    `
                });
            },

            saveEditedRecord(recordId) {
                const a = Storage.getAllAttendanceRaw().find(x => x.id === recordId);
                if (!a) return;

                const date = document.getElementById('edAttDate')?.value || a.date;
                const inTime = document.getElementById('edAttIn')?.value || '';
                const outTime = document.getElementById('edAttOut')?.value || '';
                const status = document.getElementById('edAttStatus')?.value || a.status;
                const notes = document.getElementById('edAttNotes')?.value || '';

                let durationMins = 0;
                if (inTime && outTime && inTime !== '—' && outTime !== '—') {
                    const [inH, inM] = inTime.split(':').map(Number);
                    const [outH, outM] = outTime.split(':').map(Number);
                    durationMins = Math.max(0, (outH * 60 + outM) - (inH * 60 + inM));
                }

                a.date = date;
                a.clockIn = inTime || '—';
                a.clockOut = outTime || '—';
                a.durationMinutes = durationMins;
                a.status = status;
                a.notes = notes;

                Storage.saveAttendanceRecord(a);
                Audit.log('edit_attendance', recordId, { employee: a.employeeName, date, status });
                Modal.close();
                Utils.showToast('Attendance Updated', 'Record saved successfully.');
                Router.navigate('attendance');
            },

            deleteRecord(recordId) {
                if (!confirm('Are you sure you want to delete this attendance record?')) return;
                Storage.deleteAttendanceRecord(recordId);
                Utils.showToast('Deleted', 'Attendance record removed.');
                Router.navigate('attendance');
            },

            afterRender() {
                if (this.clockTimer) clearInterval(this.clockTimer);
                this.clockTimer = setInterval(() => {
                    const el = document.getElementById('attLiveClock');
                    if (el) el.textContent = new Date().toLocaleTimeString('en-GB');
                }, 1000);
            },

            async clockIn() {
                const authU = Auth.getUser();
                if (!authU) return;
                const emp = Storage.getEmployees().find(e => e.id === authU.id) || authU;
                const u = { ...authU, ...emp };
                const todayStr = new Date().toISOString().slice(0, 10);
                const existing = Storage.getTodayAttendance(u.id);
                if (existing?.clockIn && existing.clockIn !== '—') return Utils.showToast('Already Clocked In', 'You have already clocked in today.', 'warning');

                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

                // Compare with this employee's scheduled shiftIn
                const shiftIn = u.shiftIn || '09:00';
                const [sH, sM] = shiftIn.split(':').map(Number);
                const shiftInMinutes = (sH * 60) + (sM || 0);
                const nowMinutes = (now.getHours() * 60) + now.getMinutes();
                // 15 min grace period after scheduled shift start
                const isLate = nowMinutes > (shiftInMinutes + 15);
                const notes = document.getElementById('attNotes')?.value?.trim() || '';

                const record = {
                    id: 'ATT_' + u.id + '_' + todayStr,
                    employeeId: u.id,
                    employeeName: u.name,
                    employeeEmail: u.email,
                    date: todayStr,
                    clockIn: timeStr,
                    clockInTimestamp: now.toISOString(),
                    clockOut: '',
                    durationMinutes: 0,
                    status: isLate ? 'Late' : 'Present',
                    notes: notes
                };
                Storage.saveAttendanceRecord(record);
                await Audit.log('clock_in', u.id, { time: timeStr, shiftIn, status: record.status });
                Utils.showToast('Clocked In!', `Shift started at ${timeStr} (${record.status}). Assigned Shift: ${Utils.formatTime12(shiftIn)}`);
                Router.navigate('attendance');
            },

            async clockOut() {
                const u = Auth.getUser();
                if (!u) return;
                const todayAttendance = Storage.getTodayAttendance(u.id);
                if (!todayAttendance || !todayAttendance.clockIn || todayAttendance.clockIn === '—') return Utils.showToast('Error', 'You have not clocked in today.', 'error');
                if (todayAttendance.clockOut && todayAttendance.clockOut !== '—') return Utils.showToast('Already Clocked Out', 'Shift is already closed for today.', 'warning');

                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                const inTime = new Date(todayAttendance.clockInTimestamp || (todayAttendance.date + 'T' + todayAttendance.clockIn));
                const diffMs = Math.max(0, now - inTime);
                const diffMins = Math.round(diffMs / 60000);

                todayAttendance.clockOut = timeStr;
                todayAttendance.clockOutTimestamp = now.toISOString();
                todayAttendance.durationMinutes = diffMins;
                if (diffMins < 240 && todayAttendance.status !== 'On Leave') {
                    todayAttendance.status = 'Half-day';
                }
                const notes = document.getElementById('attNotes')?.value?.trim();
                if (notes) todayAttendance.notes = notes;

                Storage.saveAttendanceRecord(todayAttendance);
                await Audit.log('clock_out', u.id, { time: timeStr, durationMinutes: diffMins });
                Utils.showToast('Clocked Out!', `Shift ended at ${timeStr} (${Math.floor(diffMins / 60)}h ${diffMins % 60}m)`);
                Router.navigate('attendance');
            },

            updateLeaveDaysPreview() {
                const sEl = document.getElementById('leaveStartDate');
                const eEl = document.getElementById('leaveEndDate');
                const pEl = document.getElementById('leaveDaysPreview');
                if (!sEl || !eEl || !pEl) return;
                const s = new Date(sEl.value + 'T12:00:00');
                const e = new Date(eEl.value + 'T12:00:00');
                if (isNaN(s.getTime()) || isNaN(e.getTime())) return;
                if (e < s) {
                    pEl.style.background = '#fee2e2';
                    pEl.style.color = '#b91c1c';
                    pEl.innerHTML = '<i class="uil uil-exclamation-triangle"></i> End date cannot be before start date!';
                    return;
                }
                const diffTime = Math.abs(e - s);
                const days = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                pEl.style.background = '#e0f2fe';
                pEl.style.color = '#0369a1';
                pEl.innerHTML = `<i class="uil uil-calendar-alt"></i> Duration: <strong>${days} Day${days > 1 ? 's' : ''}</strong> (${sEl.value} to ${eEl.value})`;
            },

            submitLeaveRequest(e) {
                if (e) e.preventDefault();
                const u = Auth.getUser() || {};
                const isAdmin = u.role === 'admin';
                let targetEmpId = u.id;
                let targetEmpName = u.name;
                let targetEmpEmail = u.email;

                if (isAdmin) {
                    const sel = document.getElementById('leaveEmpSelect');
                    if (sel && sel.value) {
                        targetEmpId = sel.value;
                        const emp = Storage.getEmployees().find(x => x.id === targetEmpId);
                        if (emp) {
                            targetEmpName = emp.name || emp.fullName || 'Staff';
                            targetEmpEmail = emp.email || '';
                        }
                    }
                }

                const leaveType = document.getElementById('leaveType')?.value || 'Annual / Paid Leave';
                const startDate = document.getElementById('leaveStartDate')?.value;
                const endDate = document.getElementById('leaveEndDate')?.value;
                const reason = document.getElementById('leaveReason')?.value || '';

                if (!startDate || !endDate) return Utils.showToast('Missing Date', 'Please select start and end dates', 'error');
                if (new Date(endDate) < new Date(startDate)) return Utils.showToast('Invalid Dates', 'End date cannot be before start date', 'error');

                const d1 = new Date(startDate + 'T12:00:00');
                const d2 = new Date(endDate + 'T12:00:00');
                const diffTime = Math.abs(d2 - d1);
                const daysCount = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

                const req = {
                    id: 'LV-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                    employeeId: targetEmpId,
                    employeeName: targetEmpName,
                    employeeEmail: targetEmpEmail,
                    leaveType: leaveType,
                    startDate: startDate,
                    endDate: endDate,
                    daysCount: daysCount,
                    reason: reason,
                    status: isAdmin ? 'Approved' : 'Pending',
                    appliedAt: new Date().toISOString(),
                    actionBy: isAdmin ? u.name : null,
                    actionAt: isAdmin ? new Date().toISOString() : null,
                    actionNotes: isAdmin ? 'Directly recorded by Admin' : ''
                };

                Storage.saveLeave(req);

                // If admin entered, immediately record attendance for each date
                if (isAdmin) {
                    const cur = new Date(startDate + 'T12:00:00');
                    const end = new Date(endDate + 'T12:00:00');
                    while (cur <= end) {
                        const dStr = cur.toISOString().slice(0, 10);
                        Storage.saveAttendanceRecord({
                            id: 'ATT_' + targetEmpId + '_' + dStr,
                            employeeId: targetEmpId,
                            employeeName: targetEmpName,
                            employeeEmail: targetEmpEmail,
                            date: dStr,
                            clockIn: '—',
                            clockOut: '—',
                            durationMinutes: 0,
                            status: 'On Leave',
                            leaveType: leaveType,
                            leaveStatus: 'Approved',
                            leaveRequestId: req.id,
                            notes: `${leaveType}: ${reason}`
                        });
                        cur.setDate(cur.getDate() + 1);
                    }
                }

                Modal.close();
                Utils.showToast('Leave Request Logged', isAdmin ? 'Leave recorded & approved for employee.' : `Your leave request for ${daysCount} day(s) has been submitted to Admin / Boss for approval.`);
                const page = window.location.hash.slice(1) || 'attendance';
                Router.navigate(page);
            },

            approveLeave(reqId) {
                const u = Auth.getUser() || {};
                if (u.role !== 'admin') return Utils.showToast('Permission Denied', 'Only Admin can approve leaves', 'error');
                const leaves = Storage.getAllLeavesRaw();
                const req = leaves.find(l => l.id === reqId);
                if (!req) return Utils.showToast('Error', 'Leave request not found', 'error');

                req.status = 'Approved';
                req.actionBy = u.name || 'Admin';
                req.actionAt = new Date().toISOString();
                Storage.saveLeave(req);

                // Create attendance records for all dates
                const cur = new Date(req.startDate + 'T12:00:00');
                const end = new Date(req.endDate + 'T12:00:00');
                while (cur <= end) {
                    const dStr = cur.toISOString().slice(0, 10);
                    Storage.saveAttendanceRecord({
                        id: 'ATT_' + req.employeeId + '_' + dStr,
                        employeeId: req.employeeId,
                        employeeName: req.employeeName,
                        employeeEmail: req.employeeEmail,
                        date: dStr,
                        clockIn: '—',
                        clockOut: '—',
                        durationMinutes: 0,
                        status: 'On Leave',
                        leaveType: req.leaveType,
                        leaveStatus: 'Approved',
                        leaveRequestId: req.id,
                        notes: `${req.leaveType}: ${req.reason || 'Approved by Admin'}`
                    });
                    cur.setDate(cur.getDate() + 1);
                }

                Utils.showToast('Leave Approved', `Approved leave for ${req.employeeName} (${req.startDate} to ${req.endDate}).`);
                Router.navigate('attendance');
            },

            showRejectLeaveModal(reqId) {
                const leaves = Storage.getAllLeavesRaw();

                Modal.open({
                    title: `Reject Leave Request — ${req.employeeName}`,

            },

            confirmRejectLeave(e, reqId) {
                if (e) e.preventDefault();
                const u = Auth.getUser() || {};
                if (u.role !== 'admin') return;
                const reason = document.getElementById('rejectReasonInput')?.value || 'Rejected by Admin';
                const leaves = Storage.getAllLeavesRaw();
                const req = leaves.find(l => l.id === reqId);
                if (!req) return;

                req.status = 'Rejected';
                req.actionBy = u.name || 'Admin';
                req.actionAt = new Date().toISOString();
                req.actionNotes = reason;
                Storage.saveLeave(req);

                // Clean up any attendance records linked to this leave
                const allAtt = Storage.getAllAttendanceRaw();
                allAtt.forEach(a => {
                    if (a.leaveRequestId === req.id || (a.employeeId === req.employeeId && a.status === 'On Leave' && a.date >= req.startDate && a.date <= req.endDate)) {
                        Storage.deleteAttendanceRecord(a.id);
                    }
                });

                Modal.close();
                Utils.showToast('Leave Rejected', `Leave request marked as rejected.`);
                Router.navigate('attendance');
            },

                const u = Auth.getUser() || {};
                const leaves = Storage.getAllLeavesRaw();
                const req = leaves.find(l => l.id === reqId);
                if (!req) return;
                if (req.employeeId !== u.id && u.role !== 'admin') return Utils.showToast('Permission Denied', 'You can only cancel your own requests.', 'error');

                    Storage.deleteLeave(reqId);

                emp.shiftNotes = shiftNotes;
                emp.weekOff = selectedWeekOffs;

            async saveAdminAttendance() {
                const empId = document.getElementById('admAttEmp')?.value;
                const emp = Storage.getEmployees().find(e => e.id === empId);
                const date = document.getElementById('admAttDate')?.value;
                const status = document.getElementById('admAttStatus')?.value;
                const inTime = document.getElementById('admAttIn')?.value || '—';
                const outTime = document.getElementById('admAttOut')?.value || '—';
                const notes = document.getElementById('admAttNotes')?.value || 'Admin entered';
                if (!empId || !date) return Utils.showToast('Error', 'Missing required fields', 'error');

                let durationMins = 480;
                if (inTime && outTime && inTime !== '—' && outTime !== '—') {
                    const [inH, inM] = inTime.split(':').map(Number);
                    const [outH, outM] = outTime.split(':').map(Number);
                    durationMins = Math.max(0, (outH * 60 + outM) - (inH * 60 + inM));
                }

                const record = {
                    id: 'ATT_' + empId + '_' + date,
                    employeeId: empId,
                    employeeName: emp?.name || 'Employee',
                    employeeEmail: emp?.email || '',
                    date: date,
                    clockIn: inTime,
                    clockOut: outTime,
                    durationMinutes: durationMins,
                    status: status,
                    notes: notes
                };
                Storage.saveAttendanceRecord(record);
                await Audit.log('edit_attendance', empId, { employee: emp?.name, date, status });
                Modal.close();
                Utils.showToast('Saved', `Attendance recorded for ${emp?.name || 'Employee'}`);
                Router.navigate('attendance');
            },

                    a.employeeName || '',
                    Utils.formatDate(a.date),
                    a.date ? new Date(a.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short' }) : '—',
                    a.clockIn || '—',
                    a.clockOut || '—',
                    a.status || 'Present',
                    a.notes || ''
                ]);
                ExportUtil.downloadExcel('Attendance_Report', headers, rows, []);
            }
        };

        /* ---------- Settings Module ---------- */
        const Settings = {
            activeTab: 'profile', // 'profile' | 'appearance' | 'notifications' | 'regional' | 'privacy' | 'filters' | 'employee' | 'company' | 'policy' | 'backup'

            setTab(tab) {
                this.activeTab = tab;
                Router.navigate('settings');
            },

            render() {
                const u = Auth.getUser() || { name: 'Employee', email: '', role: 'employee' };
                const isAdmin = u.role === 'admin';
                const userSet = Storage.getUserSettings(u.id);
                const comp = Storage.getCompanySettings();

                const innerHtml = `
                    <div class="settings-container">
                        <!-- Navigation Tabs Bar -->
                        <div class="settings-nav-bar">
                            <button class="settings-tab-btn ${this.activeTab === 'profile' ? 'active' : ''}" onclick="Settings.setTab('profile')">
                                <i class="uil uil-user-circle"></i> Profile
                            </button>
                            <button class="settings-tab-btn ${this.activeTab === 'appearance' ? 'active' : ''}" onclick="Settings.setTab('appearance')">
                                <i class="uil uil-palette"></i> Appearance
                            </button>
                            <button class="settings-tab-btn ${this.activeTab === 'notifications' ? 'active' : ''}" onclick="Settings.setTab('notifications')">
                                <i class="uil uil-bell"></i> Notifications
                            </button>
                            <button class="settings-tab-btn ${this.activeTab === 'regional' ? 'active' : ''}" onclick="Settings.setTab('regional')">
                                <i class="uil uil-globe"></i> Regional
                            </button>
                            <button class="settings-tab-btn ${this.activeTab === 'privacy' ? 'active' : ''}" onclick="Settings.setTab('privacy')">
                                <i class="uil uil-shield-check"></i> Data & Privacy
                            </button>
                            <button class="settings-tab-btn ${this.activeTab === 'filters' ? 'active' : ''}" onclick="Settings.setTab('filters')">
                                <i class="uil uil-filter"></i> Custom Filters
                            </button>
                            ${!isAdmin ? `
                                <button class="settings-tab-btn ${this.activeTab === 'employee' ? 'active' : ''}" onclick="Settings.setTab('employee')">
                                    <i class="uil uil-briefcase"></i> Work Preferences
                                </button>
                            ` : `
                                <button class="settings-tab-btn ${this.activeTab === 'company' ? 'active' : ''}" onclick="Settings.setTab('company')">
                                    <i class="uil uil-building"></i> Company Operations
                                </button>
                                <button class="settings-tab-btn ${this.activeTab === 'policy' ? 'active' : ''}" onclick="Settings.setTab('policy')">
                                    <i class="uil uil-sliders-v-alt"></i> Staff Policies
                                </button>
                                <button class="settings-tab-btn ${this.activeTab === 'backup' ? 'active' : ''}" onclick="Settings.setTab('backup')">
                                    <i class="uil uil-database"></i> System Backup
                                </button>
                            `}
                        </div>

                        <!-- Tab Content Body -->
                        <div class="settings-content-wrapper">
                            ${this.renderActiveTab(u, isAdmin, userSet, comp)}
                        </div>
                    </div>
                `;

                return Layout.render('Settings & Preferences', innerHtml);
            },

            renderActiveTab(u, isAdmin, userSet, comp) {
                switch (this.activeTab) {
                    case 'profile': return this.renderProfileTab(u);
                    case 'appearance': return this.renderAppearanceTab(userSet);
                    case 'notifications': return this.renderNotificationsTab(userSet);
                    case 'regional': return this.renderRegionalTab(userSet, comp);
                    case 'privacy': return this.renderPrivacyTab(u);
                    case 'filters': return this.renderFiltersTab();
                    case 'employee': return this.renderEmployeeTab(u, userSet);
                    case 'company': return this.renderCompanyTab(comp);
                    case 'policy': return this.renderPolicyTab(comp);
                    case 'backup': return this.renderBackupTab(comp);
                    default: return this.renderProfileTab(u);
                }
            },

            /* ---------------- 1. Profile Settings Tab ---------------- */
            renderProfileTab(u) {
                const initials = (u.name || 'AJ').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase() || 'AJ';
                return `
                    <div class="settings-section-card">
                        <div class="settings-group-title">
                            <i class="uil uil-user-circle"></i> Personal Profile Information
                        </div>

                        <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;">
                            <div class="avatar" style="width:72px;height:72px;font-size:24px;border-radius:20px;background:linear-gradient(135deg, #1677e8, #60a5fa);box-shadow:4px 4px 10px rgba(22,119,232,0.25);">
                                ${initials}
                            </div>
                            <div>
                                <div style="font-weight:700;font-size:18px;color:#1e293b;">${Utils.escape(u.name || 'Staff Member')}</div>
                                <div style="font-size:13px;color:#64748b;">${Utils.escape(u.email || '')} • <span class="badge badge-primary">${Utils.escape(u.role || 'employee').toUpperCase()}</span></div>
                                <div style="font-size:12px;color:#94a3b8;margin-top:4px;">UID: <strong>${u.uid || u.employeeId || u.id}</strong></div>
                            </div>
                        </div>

                        <form onsubmit="Settings.saveProfile(event)" style="display:flex;flex-direction:column;gap:16px;">
                            <div class="settings-form-grid">
                                <div>
                                    <label class="form-label">Full Legal Name *</label>
                                    <input type="text" id="setProfName" class="form-input" value="${Utils.escape(u.name || '')}" required>
                                </div>
                                <div>
                                    <label class="form-label">Official Work Email</label>
                                    <input type="email" class="form-input" value="${Utils.escape(u.email || '')}" disabled style="background:#f1f5f9;cursor:not-allowed;">
                                </div>
                                <div>
                                    <label class="form-label">Contact / Mobile Number</label>
                                    <input type="tel" id="setProfPhone" class="form-input" value="${Utils.escape(u.phone || u.contact || '')}" placeholder="+44 7700 900123">
                                </div>
                                <div>
                                    <label class="form-label">Job Title / Rank</label>
                                    <input type="text" id="setProfRank" class="form-input" value="${Utils.escape(u.rank || 'Travel Consultant')}" ${u.role !== 'admin' ? 'disabled style="background:#f1f5f9;"' : ''}>
                                </div>
                            </div>

                            <div style="display:flex;justify-content:flex-end;">
                                <button type="submit" class="btn btn-primary"><i class="uil uil-save"></i> Save Profile Details</button>
                            </div>
                        </form>

                        <div class="settings-group-title" style="margin-top:24px;">
                            <i class="uil uil-lock-alt"></i> Change Password & Credentials
                        </div>

                        <form onsubmit="Settings.savePassword(event)" style="display:flex;flex-direction:column;gap:16px;">
                            <div class="settings-form-grid">
                                <div>
                                    <label class="form-label">New Password</label>
                                    <input type="password" id="setNewPass" class="form-input" placeholder="••••••••" minlength="6" oninput="Settings.checkPasswordStrength(this.value)">
                                    <div id="passStrengthMeter" style="height:4px;border-radius:2px;background:#e2e8f0;margin-top:6px;transition:all 0.3s;"></div>
                                </div>
                                <div>
                                    <label class="form-label">Confirm New Password</label>
                                    <input type="password" id="setConfirmPass" class="form-input" placeholder="••••••••">
                                </div>
                            </div>

                            <div style="display:flex;justify-content:flex-end;">
                                <button type="submit" class="btn btn-outline"><i class="uil uil-key-skeleton"></i> Update Password</button>
                            </div>
                        </form>
                    </div>
                `;
            },

            checkPasswordStrength(pass) {
                const meter = document.getElementById('passStrengthMeter');
                if (!meter) return;
                if (!pass) { meter.style.width = '0%'; meter.style.background = '#e2e8f0'; return; }
                let score = 0;
                if (pass.length >= 6) score++;
                if (pass.length >= 10) score++;
                if (/[A-Z]/.test(pass)) score++;
                if (/[0-9]/.test(pass)) score++;
                if (/[^A-Za-z0-9]/.test(pass)) score++;

                const widths = ['20%', '40%', '60%', '80%', '100%'];
                const colors = ['#ef4444', '#f97316', '#eab308', '#3b82f6', '#10b981'];
                meter.style.width = widths[Math.min(score - 1, 4)] || '20%';
                meter.style.background = colors[Math.min(score - 1, 4)] || '#ef4444';
            },

            saveProfile(e) {
                e.preventDefault();
                const u = Auth.getUser() || {};
                const name = document.getElementById('setProfName').value.trim();
                const phone = document.getElementById('setProfPhone').value.trim();
                const rank = document.getElementById('setProfRank')?.value?.trim() || u.rank;

                u.name = name;
                u.phone = phone;
                u.contact = phone;
                u.rank = rank;
                Auth.setUser(u);

                const emps = Storage.getEmployees();
                const cur = emps.find(x => x.id === u.id);
                if (cur) {
                    cur.name = name;
                    cur.phone = phone;
                    cur.contact = phone;
                    cur.rank = rank;
                    Storage.saveEmployees(emps);
                }

                Utils.showToast('Profile Updated', 'Personal profile information saved successfully.');
                Router.navigate('settings');
            },

            async savePassword(e) {
                e.preventDefault();
                const p1 = document.getElementById('setNewPass').value;
                const p2 = document.getElementById('setConfirmPass').value;
                if (!p1) return Utils.showToast('Error', 'Please enter a new password.', 'error');
                if (p1 !== p2) return Utils.showToast('Mismatch', 'Passwords do not match.', 'error');
                if (p1.length < 6) return Utils.showToast('Too Short', 'Password must be at least 6 characters.', 'error');

                const F = window.Firebase;
                if (F?.auth?.currentUser) {
                    try {
                        await F.updatePassword(F.auth.currentUser, p1);
                        Utils.showToast('Password Changed', 'Firebase account password updated successfully.');
                        document.getElementById('setNewPass').value = '';
                        document.getElementById('setConfirmPass').value = '';
                    } catch (err) {
                        Utils.showToast('Update Failed', err.message || 'Please log in again before changing password.', 'error');
                    }
                } else {
                    Utils.showToast('Password Updated', 'Local password updated successfully.');
                    document.getElementById('setNewPass').value = '';
                    document.getElementById('setConfirmPass').value = '';
                }
            },

            /* ---------------- 2. Appearance & UI Theme Tab ---------------- */
            renderAppearanceTab(userSet) {
                const curTheme = userSet.theme || 'light';
                const curColor = userSet.themeColor || '#1677e8';
                const curFont = userSet.fontSize || 'medium';
                const curDensity = userSet.density || 'comfortable';
                const curAnim = userSet.animations !== false;

                const colorPalettes = [
                    { name: 'Sky Sapphire', hex: '#1677e8', desc: 'Default Royal Indigo' },
                    { name: 'Emerald Oasis', hex: '#059669', desc: 'Lush Mint Teal' },
                    { name: 'Sunset Amber', hex: '#d97706', desc: 'Warm Radiant Gold' },
                    { name: 'Crimson Rose', hex: '#e11d48', desc: 'Vibrant Ruby Scarlet' },
                    { name: 'Amethyst Violet', hex: '#7c3aed', desc: 'Deep Royal Purple' }
                ];

                return `
                    <div class="settings-section-card">
                        <div class="settings-group-title">
                            <i class="uil uil-palette"></i> Modern Light Theme Accent Palette
                        </div>
                        <div style="font-size:13px;color:#64748b;margin-bottom:12px;">This portal is designed exclusively in a high-clarity Pure Light Mode. Choose your primary accent hue:</div>

                        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;margin-bottom:24px;">
                            ${colorPalettes.map(c => `
                                <div class="theme-color-card ${curColor === c.hex ? 'active' : ''}" onclick="Settings.setThemeColor('${c.hex}')" style="cursor:pointer;padding:12px;border-radius:14px;background:#ffffff;border:2px solid ${curColor === c.hex ? c.hex : 'transparent'};box-shadow:2px 2px 6px rgba(0,0,0,0.03);text-align:center;">
                                    <div style="width:36px;height:36px;border-radius:50%;background:${c.hex};margin:0 auto 8px;box-shadow:0 3px 6px rgba(0,0,0,0.15);"></div>
                                    <div style="font-weight:600;font-size:13px;color:#1e293b;">${c.name}</div>
                                    <div style="font-size:11px;color:#64748b;">${c.desc}</div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="settings-group-title">
                            <i class="uil uil-text"></i> Typography & Layout Density
                        </div>

                        <div class="settings-form-grid" style="margin-bottom:20px;">
                            <div>
                                <label class="form-label">Font Sizing Scale</label>
                                <select class="form-select" onchange="Settings.setFontSize(this.value)">
                                    <option value="small" ${curFont === 'small' ? 'selected' : ''}>Compact (13px Body)</option>
                                    <option value="medium" ${curFont === 'medium' ? 'selected' : ''}>Standard (14px Body - Default)</option>
                                    <option value="large" ${curFont === 'large' ? 'selected' : ''}>Spacious (15.5px Body)</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Table & Card Density</label>
                                <select class="form-select" onchange="Settings.setDensity(this.value)">
                                    <option value="compact" ${curDensity === 'compact' ? 'selected' : ''}>High Information Density</option>
                                    <option value="comfortable" ${curDensity === 'comfortable' ? 'selected' : ''}>Comfortable / Relaxed (Default)</option>
                                </select>
                            </div>
                        </div>

                        <label class="neu-switch-label">
                            <div>
                                <div style="font-weight:600;color:#1e293b;font-size:14px;">Smooth UI Animations & Transitions</div>
                                <div style="font-size:12px;color:#64748b;">Enables micro-interactions and soft state transitions</div>
                            </div>
                            <div class="neu-switch">
                                <input type="checkbox" ${curAnim ? 'checked' : ''} onchange="Settings.setAnimations(this.checked)">
                                <span class="neu-slider"></span>
                            </div>
                        </label>
                    </div>
                `;
            },

            setThemeColor(hex) {
                const u = Auth.getUser() || {};
                const set = Storage.getUserSettings(u.id);
                set.themeColor = hex;
                Storage.saveUserSettings(u.id, set);
                document.documentElement.style.setProperty('--primary', hex);
                document.documentElement.style.setProperty('--primary-dark', hex);
                Utils.showToast('Accent Updated', 'Portal accent color applied.');
                Router.navigate('settings');
            },

            setFontSize(size) {
                const u = Auth.getUser() || {};
                const set = Storage.getUserSettings(u.id);
                set.fontSize = size;
                Storage.saveUserSettings(u.id, set);
                document.documentElement.setAttribute('data-font-size', size);
                Utils.showToast('Font Scale Updated', `Font sizing switched to ${size}.`);
            },

            setDensity(density) {
                const u = Auth.getUser() || {};
                const set = Storage.getUserSettings(u.id);
                set.density = density;
                Storage.saveUserSettings(u.id, set);
                document.documentElement.setAttribute('data-density', density);
                Utils.showToast('Layout Density', `Density preference set to ${density}.`);
            },

            setAnimations(enabled) {
                const u = Auth.getUser() || {};
                const set = Storage.getUserSettings(u.id);
                set.animations = enabled;
                Storage.saveUserSettings(u.id, set);
                if (enabled) document.documentElement.classList.remove('no-animations');
                else document.documentElement.classList.add('no-animations');
                Utils.showToast('Animation Preferences', enabled ? 'Animations enabled.' : 'Animations reduced.');
            },

            /* ---------------- 3. Notifications Tab ---------------- */
            renderNotificationsTab(userSet) {
                const n = userSet.notifications || { pushEnabled: true, emailFollowups: true, bookingAlerts: true, sound: true };
                return `
                    <div class="settings-section-card">
                        <div class="settings-group-title">
                            <i class="uil uil-bell"></i> Operational Alerts & Reminders
                        </div>

                        <div style="display:flex;flex-direction:column;gap:14px;">
                            <label class="neu-switch-label">
                                <div>
                                    <div style="font-weight:600;color:#1e293b;font-size:14px;">Real-Time Browser Push Alerts</div>
                                    <div style="font-size:12px;color:#64748b;">Instant desktop popups for client inquiries, reassignments, and booking confirmations</div>
                                </div>
                                <div class="neu-switch">
                                    <input type="checkbox" ${n.pushEnabled ? 'checked' : ''} onchange="Settings.togglePush(this.checked)">
                                    <span class="neu-slider"></span>
                                </div>
                            </label>

                            <label class="neu-switch-label">
                                <div>
                                    <div style="font-weight:600;color:#1e293b;font-size:14px;">Sound Effects on Events</div>
                                    <div style="font-size:12px;color:#64748b;">Play chime upon ticket creation and clock in/out confirmation</div>
                                </div>
                                <div class="neu-switch">
                                    <input type="checkbox" ${n.sound ? 'checked' : ''} onchange="Settings.toggleSound(this.checked)">
                                    <span class="neu-slider"></span>
                                </div>
                            </label>
                        </div>
                    </div>
                `;
            },

            togglePush(val) {
                const u = Auth.getUser() || {};
                const set = Storage.getUserSettings(u.id);
                set.notifications = set.notifications || {};
                set.notifications.pushEnabled = val;
                Storage.saveUserSettings(u.id, set);
                if (val && Notification.permission !== 'granted') {
                    Notification.requestPermission();
                }
                Utils.showToast('Notification Saved', val ? 'Push notifications enabled.' : 'Push notifications disabled.');
            },

            toggleSound(val) {
                const u = Auth.getUser() || {};
                const set = Storage.getUserSettings(u.id);
                set.notifications = set.notifications || {};
                set.notifications.sound = val;
                Storage.saveUserSettings(u.id, set);
                Utils.showToast('Audio Alerts', val ? 'Sound effects enabled.' : 'Sound effects muted.');
            },

            /* ---------------- 4. Regional & Currency Tab ---------------- */
            renderRegionalTab(userSet, comp) {
                const curCurrency = comp.currency || 'GBP';
                const curTimeFormat = userSet.timeFormat || '12h';
                const curDateFormat = userSet.dateFormat || 'DD/MM/YYYY';

                return `
                    <div class="settings-section-card">
                        <div class="settings-group-title">
                            <i class="uil uil-globe"></i> International Currency & Localization
                        </div>

                        <form onsubmit="Settings.saveRegional(event)" style="display:flex;flex-direction:column;gap:16px;">
                            <div class="settings-form-grid">
                                <div>
                                    <label class="form-label">Operational Currency Symbol</label>
                                    <select id="regCurrency" class="form-select">
                                        <option value="GBP" ${curCurrency === 'GBP' ? 'selected' : ''}>£ GBP - British Pound Sterling (Default)</option>
                                        <option value="EUR" ${curCurrency === 'EUR' ? 'selected' : ''}>€ EUR - Euro</option>
                                        <option value="USD" ${curCurrency === 'USD' ? 'selected' : ''}>$ USD - United States Dollar</option>
                                        <option value="INR" ${curCurrency === 'INR' ? 'selected' : ''}>₹ INR - Indian Rupee</option>
                                        <option value="AED" ${curCurrency === 'AED' ? 'selected' : ''}>AED - UAE Dirham</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="form-label">Time Representation</label>
                                    <select id="regTimeFormat" class="form-select">
                                        <option value="12h" ${curTimeFormat === '12h' ? 'selected' : ''}>12-Hour Clock (09:30 AM / 06:30 PM)</option>
                                        <option value="24h" ${curTimeFormat === '24h' ? 'selected' : ''}>24-Hour Military Format (09:30 / 18:30)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="form-label">Calendar Date Format</label>
                                    <select id="regDateFormat" class="form-select">
                                        <option value="DD/MM/YYYY" ${curDateFormat === 'DD/MM/YYYY' ? 'selected' : ''}>DD/MM/YYYY (UK / Europe)</option>
                                        <option value="MM/DD/YYYY" ${curDateFormat === 'MM/DD/YYYY' ? 'selected' : ''}>MM/DD/YYYY (US Standard)</option>
                                        <option value="YYYY-MM-DD" ${curDateFormat === 'YYYY-MM-DD' ? 'selected' : ''}>YYYY-MM-DD (ISO Format)</option>
                                    </select>
                                </div>
                            </div>

                            <div style="display:flex;justify-content:flex-end;">
                                <button type="submit" class="btn btn-primary"><i class="uil uil-save"></i> Apply Regional Preferences</button>
                            </div>
                        </form>
                    </div>
                `;
            },

            saveRegional(e) {
                e.preventDefault();
                const u = Auth.getUser() || {};
                const currency = document.getElementById('regCurrency').value;
                const timeFormat = document.getElementById('regTimeFormat').value;
                const dateFormat = document.getElementById('regDateFormat').value;

                const comp = Storage.getCompanySettings();
                comp.currency = currency;
                Storage.saveCompanySettings(comp);

                const set = Storage.getUserSettings(u.id);
                set.timeFormat = timeFormat;
                set.dateFormat = dateFormat;
                Storage.saveUserSettings(u.id, set);

                Utils.showToast('Settings Saved', 'Currency and regional formats updated across the portal.');
                Router.navigate('settings');
            },

            /* ---------------- 5. Data & Privacy Tab (Includes Account Deletion) ---------------- */
            renderPrivacyTab(u) {
                return `
                    <div class="settings-section-card">
                        <div class="settings-group-title">
                            <i class="uil uil-shield-check"></i> Personal Data & Security
                        </div>
                        <div style="font-size:13px;color:#64748b;">Export an official copy of all inquiries, bookings, and attendance logs associated with your account.</div>

                        <div style="display:flex;flex-wrap:wrap;gap:12px;padding:16px;background:#ffffff;border-radius:14px;box-shadow:2px 2px 6px rgba(0,0,0,0.03);margin-top:10px;">
                            <button class="btn btn-primary" onclick="Settings.downloadMyDataExcel()"><i class="uil uil-table"></i> Download My Data (Excel Workbook)</button>
                            <button class="btn btn-outline" onclick="Settings.downloadMyDataPDF()"><i class="uil uil-file-alt"></i> Download My Data (PDF Dossier)</button>
                        </div>

                        <div class="settings-group-title" style="margin-top:24px;">
                            <i class="uil uil-desktop"></i> Active Session & Security
                        </div>

                        <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;background:#f8fafc;padding:16px;border-radius:12px;border:1px solid #e2e8f0;">
                            <div><strong>Current Device:</strong> ${navigator.userAgent.slice(0, 75)}...</div>
                            <div><strong>Signed In As:</strong> ${Utils.escape(u.email || u.name)}</div>
                            <div><strong>Role Privileges:</strong> ${Utils.escape(u.role || 'employee')}</div>
                            <div><strong>Session Security:</strong> Verified via Firebase Authentication</div>
                        </div>

                        <div style="display:flex;justify-content:flex-end;margin-top:12px;">
                            <button class="btn btn-outline" onclick="Storage.clearLocalCache(); Utils.showToast('Cache Refreshed', 'Local browser cache synced.');"><i class="uil uil-sync"></i> Refresh Local Cache</button>
                        </div>

                        <!-- Danger Zone: Account Deletion -->
                        <div class="settings-group-title" style="margin-top:32px;color:var(--destructive);">
                            <i class="uil uil-exclamation-triangle"></i> Danger Zone: Account Deletion
                        </div>

                        <div style="background:#fff1f2;border:1.5px solid #fecdd3;border-radius:14px;padding:18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;">
                            <div style="max-width:540px;">
                                <div style="font-weight:700;color:#991b1b;font-size:14.5px;">Permanently Delete Account</div>
                                <div style="font-size:12.5px;color:#b91c1c;margin-top:4px;line-height:1.5;">
                                    Close your AJ Tours &amp; Travel portal account. You can choose a <strong>24-Hour Recovery Window</strong> to safely recover your account if you change your mind, or <strong>Delete Permanently Now</strong> to erase all records immediately.
                                </div>
                            </div>
                            <button type="button" class="btn btn-destructive" onclick="Settings.showDeleteMyAccountModal()" style="white-space:nowrap;">
                                <i class="uil uil-trash-alt"></i> Delete My Account

            downloadMyDataExcel() {
                const u = Auth.getUser() || {};
                const inqs = (Storage.getAllInquiriesRaw() || []).filter(x => x.assignedTo === u.id || x.createdBy === u.name);
                const bks = (Storage.getAllBookingsRaw() || []).filter(x => x.consultantId === u.id || x.createdBy === u.name);
                const att = (Storage.getAttendance() || []).filter(x => x.empId === u.id || x.employeeId === u.id);

                const wb = XLSX.utils.book_new();

                const profData = [
                    ['Employee ID', u.employeeId || u.uid || u.id],
                    ['Full Name', u.name],
                    ['Email', u.email],
                    ['Role', u.role],
                    ['Phone', u.phone || ''],
                    ['Export Date', new Date().toLocaleString('en-GB')]
                ];
                const wsProf = XLSX.utils.aoa_to_sheet(profData);
                XLSX.utils.book_append_sheet(wb, wsProf, 'My Profile');

                const bkRows = [['Booking ID', 'Client Name', 'Destination', 'Travel Date', 'Sales Fare', 'Status']];
                bks.forEach(b => {
                    bkRows.push([b.bookingId || b.id, b.clientName, b.destination, b.travelDate, Utils.salesAmount(b), b.status]);
                });
                const wsBk = XLSX.utils.aoa_to_sheet(bkRows);
                XLSX.utils.book_append_sheet(wb, wsBk, 'My Bookings');

                const inqRows = [['Inquiry ID', 'Client Name', 'Destination', 'Follow Up', 'Status']];
                inqs.forEach(i => {
                    inqRows.push([i.id, i.clientName, i.destination, i.followUpDate, i.status]);
                });
                const wsInq = XLSX.utils.aoa_to_sheet(inqRows);
                XLSX.utils.book_append_sheet(wb, wsInq, 'My Inquiries');

                const attRows = [['Date', 'Clock In', 'Clock Out', 'Status', 'Duration (Mins)']];
                att.forEach(a => {
                    attRows.push([a.date, a.clockIn || '—', a.clockOut || '—', a.status, a.durationMinutes || 0]);
                });
                const wsAtt = XLSX.utils.aoa_to_sheet(attRows);
                XLSX.utils.book_append_sheet(wb, wsAtt, 'My Attendance');

                XLSX.writeFile(wb, `AJ_Travels_Personal_Data_${(u.name || 'User').replace(/\s+/g, '_')}.xlsx`);
                Utils.showToast('Data Exported', 'Your personal workbook has downloaded.');
            },

            downloadMyDataPDF() {
                const u = Auth.getUser() || {};
                const inqs = (Storage.getAllInquiriesRaw() || []).filter(x => x.assignedTo === u.id || x.createdBy === u.name);

                const att = (Storage.getAttendance() || []).filter(x => x.empId === u.id || x.employeeId === u.id);

                const { jsPDF } = window.jspdf;

                doc.setTextColor(30, 41, 59);
