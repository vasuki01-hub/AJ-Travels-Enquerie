                const aNet = getVal('fNetAdult'), yNet = getVal('fNetYouth'), cNet = getVal('fNetChild'), iNet = getVal('fNetInfant');
                const aQuote = getVal('fQuoteAdult'), yQuote = getVal('fQuoteYouth'), cQuote = getVal('fQuoteChild'), iQuote = getVal('fQuoteInfant');
                const totalNet = (aCount * aNet) + (yCount * yNet) + (cCount * cNet) + (iCount * iNet);
                const totalQuoted = (aCount * aQuote) + (yCount * yQuote) + (cCount * cQuote) + (iCount * iQuote);
                const netEl = document.getElementById('fTotalNet');
                const quoteEl = document.getElementById('fTotalQuoted');
                const profitEl = document.getElementById('fProfit');
                if (netEl) netEl.value = totalNet.toFixed(2);
                if (quoteEl && !quoteEl.dataset.manual) quoteEl.value = totalQuoted.toFixed(2);
                const currentQuote = parseFloat(quoteEl?.value) || totalQuoted;
                if (profitEl) profitEl.value = (currentQuote - totalNet).toFixed(2);

                const amt = document.getElementById('amt') || document.getElementById('ebAmt') || document.getElementById('dbAmt');
                const sales = document.getElementById('salesAmt') || document.getElementById('ebSales') || document.getElementById('dbSalesAmt');
                if (amt && totalNet > 0) amt.value = totalNet.toFixed(2);
                if (sales && currentQuote > 0) sales.value = currentQuote.toFixed(2);
            },
            calcProfitManual() {
                const quoteEl = document.getElementById('fTotalQuoted');
                if (quoteEl) quoteEl.dataset.manual = 'true';
                const net = parseFloat(document.getElementById('fTotalNet')?.value) || 0;
                const quote = parseFloat(quoteEl?.value) || 0;
                const profitEl = document.getElementById('fProfit');
                if (profitEl) profitEl.value = (quote - net).toFixed(2);
                const sales = document.getElementById('salesAmt') || document.getElementById('ebSales') || document.getElementById('dbSalesAmt');

        const MonthGroups = {
            expanded: {},
            ensure(section) {
                if (!this.expanded[section]) this.expanded[section] = new Set([Utils.currentMonthKey()]);
                return this.expanded[section];
            },
            isExpanded(section, monthKey) { return this.ensure(section).has(monthKey); },
            toggle(section, monthKey) {
                const set = this.ensure(section);
                if (set.has(monthKey)) set.delete(monthKey); else set.add(monthKey);
                this.apply(section);
            },
            apply(section) {
                document.querySelectorAll(`tr.month-data-row[data-section="${section}"]`).forEach(tr => {
                    tr.classList.toggle('month-hidden', !this.isExpanded(section, tr.dataset.monthGroup));
                });
                document.querySelectorAll(`tr.month-row-toggle[data-section="${section}"]`).forEach(tr => {
                    const icon = tr.querySelector('.month-toggle-icon');
                    if (icon) icon.textContent = this.isExpanded(section, tr.dataset.monthGroup) ? '▼' : '▶';
                });
            },
            hiddenClass(section, monthKey) { return this.isExpanded(section, monthKey) ? '' : ' month-hidden'; },
            syncVisible(section, monthKeys) {
                if (!monthKeys.length) { this.apply(section); return; }
                const set = this.ensure(section);
                if (!monthKeys.some(k => set.has(k))) {
                    set.clear();
                    const cur = Utils.currentMonthKey();
                    set.add(monthKeys.includes(cur) ? cur : monthKeys[0]);
                }
                this.apply(section);
            },
            reset(section) { delete this.expanded[section]; },
            headerRow(colspan, monthKey, label, section, profitText) {
                const exp = monthKey ? this.isExpanded(section, monthKey) : true;
                const profit = profitText ? `<span class="month-profit-badge">${profitText}</span>` : '';

        /* ================= 3D CHART HELPER (CIRCULAR DONUTS) ================= */
        const ChartHelper = {
            _instances: {},
            createDonut3D(canvasId, config) {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return null;
                if (this._instances[canvasId]) {
                    this._instances[canvasId].destroy();
                    delete this._instances[canvasId];
                }

                const labels = config.labels || [];
                const data = (config.data || []).map(v => Number(v) || 0);
                const total = data.reduce((a, b) => a + b, 0);

                const displayData = total > 0 ? data : [1];
                const displayColors = total > 0 ? (config.colors || ['#1677e8', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4']) : ['#e2e8f0'];
                const displayLabels = total > 0 ? labels : ['No Data'];

                const chart = new Chart(canvas, {
                    type: 'doughnut',
                    data: {
                        labels: displayLabels,
                        datasets: [{
                            data: displayData,
                            backgroundColor: displayColors,
                            borderColor: '#ffffff',
                            borderWidth: 3,
                            hoverOffset: 6,
                            borderRadius: 6,
                            spacing: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '66%',
                        animation: {
                            animateRotate: true,
                            animateScale: true,
                            duration: 900,
                            easing: 'easeOutQuart'
                        },
                        plugins: {
                            legend: {
                                position: config.legendPos || 'bottom',
                                labels: {
                                    boxWidth: 11,
                                    boxHeight: 11,
                                    borderRadius: 6,
                                    usePointStyle: true,
                                    pointStyle: 'circle',
                                    padding: 12,
                                    font: { family: "'DM Sans', sans-serif", size: 12, weight: '600' },
                                    color: '#334155'
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(15, 23, 42, 0.94)',
                                padding: 10,
                                cornerRadius: 10,
                                titleFont: { family: "'DM Sans', sans-serif", size: 13, weight: '700' },
                                bodyFont: { family: "'DM Sans', sans-serif", size: 12 },
                                callbacks: {
                                    label(context) {
                                        if (total === 0) return ' No records';
                                        const val = context.parsed;
                                        const pct = total > 0 ? ((val / total) * 100).toFixed(1) : '0';
                                        return ` ${context.label}: ${config.isCurrency ? Utils.formatCurrency(val) : val} (${pct}%)`;
                                    }
                                }
                            }
                        }
                    },
                    plugins: [{
                        id: 'centerText_' + canvasId,
                        beforeDraw(c) {
                            if (config.centerText == null && !config.showTotal) return;
                            const { ctx } = c;
                            ctx.save();
                            const text = config.centerText != null ? String(config.centerText) : (config.isCurrency ? Utils.formatCurrency(total) : String(total));
                            const sub = config.centerSub || 'Total';
                            const chartArea = c.chartArea;
                            const centerX = (chartArea.left + chartArea.right) / 2;
                            const centerY = (chartArea.top + chartArea.bottom) / 2;

                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';

                            ctx.font = "bold 19px 'DM Sans', sans-serif";
                            ctx.fillStyle = '#0f172a';
                            ctx.fillText(text, centerX, centerY - 8);

                            ctx.font = "500 11px 'DM Sans', sans-serif";
                            ctx.fillStyle = '#64748b';
                            ctx.fillText(sub, centerX, centerY + 13);
                            ctx.restore();
                        }
                    }]
                });

                this._instances[canvasId] = chart;
                return chart;
            }
        };

        /* ================= COLORFUL, BORDERED EXPORT ENGINE (PDF & EXCEL) ================= */
        const ExportUtil = {
            buildTotalRow(headers, rows) {
                if (!rows || rows.length === 0) return null;
                const totalRow = new Array(headers.length).fill('');
                totalRow[0] = 'TOTAL AMOUNT';
                let hasSum = false;

                for (let c = 1; c < headers.length; c++) {
                    const h = (headers[c] || '').toLowerCase();
                    const isFinancialHeader = /amount|fare|net|sales|profit|total|salary|payable|bonus|deduction|expense|price|paid|cost/.test(h);
                    const isNonFinancialHeader = /id|pnr|phone|date|day|time|hour|contact|invoice|ref|status|code|notes|remarks|email|rank|role|name/.test(h);

                    if (isNonFinancialHeader && !isFinancialHeader) continue;

                    let sum = 0;
                    let numCount = 0;
                    rows.forEach(r => {
                        const cell = r[c];
                        if (cell != null) {
                            if (typeof cell === 'number') {
                                sum += cell;
                                numCount++;
                            } else if (typeof cell === 'string') {
                                const clean = cell.replace(/[^0-9.-]/g, '');
                                if (clean && !isNaN(clean) && !cell.includes('@') && !cell.match(/^\d{4}-\d{2}-\d{2}$/)) {
                                    sum += parseFloat(clean);
                                    numCount++;
                                }
                            }
                        }
                    });

                    if (numCount > 0 && (isFinancialHeader || (numCount / rows.length > 0.4 && sum > 0))) {
                        totalRow[c] = Utils.formatCurrency(sum);
                        hasSum = true;
                    }
                }

                if (!hasSum) {
                    totalRow[0] = `TOTAL RECORDS: ${rows.length}`;
                }
                return totalRow;
            },

            downloadExcel(sheetName, headers, rows, monthGroups) {
                const wb = XLSX.utils.book_new();
                const aoa = [];
                aoa.push(['AJ Tours & Travels — World Wide Flight & Package Specialists']);
                aoa.push([sheetName.replace(/_/g, ' '), `Exported: ${new Date().toLocaleString('en-GB')}`]);
                aoa.push([]);

                const hasGroups = Array.isArray(monthGroups) && monthGroups.length > 0;
                const hasRows = Array.isArray(rows) && rows.length > 0;

                if (hasGroups) {
                    monthGroups.forEach(g => {
                        aoa.push([g.profitLabel ? `${g.label}  |  ${g.profitLabel}` : g.label]);
                        if (g.profitLabel) aoa.push(['Total Profit', g.profitValue ?? '']);
                        aoa.push(headers);
                        (g.rows || []).forEach(r => aoa.push(r));
                        const tot = this.buildTotalRow(headers, g.rows);
                        if (tot) aoa.push(tot);
                        aoa.push([]);
                    });
                } else if (hasRows) {
                    aoa.push(headers);
                    rows.forEach(r => aoa.push(r));
                    const tot = this.buildTotalRow(headers, rows);
                    if (tot) aoa.push(tot);
                } else {
                    aoa.push(headers);
                    aoa.push(['No records found for the selected period.']);
                }

                const ws = XLSX.utils.aoa_to_sheet(aoa);
                const colWidths = headers.map((h, i) => {
                    let max = (h || '').length;
                    aoa.forEach(row => {
                        const cell = row[i];
                        if (cell != null) max = Math.max(max, String(cell).length);
                    });
                    return { wch: Math.min(Math.max(max + 3, 12), 40) };
                });
                ws['!cols'] = colWidths;
                XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0, 31));
                XLSX.writeFile(wb, `${sheetName.replace(/\s+/g, '_')}.xlsx`);
            },
            downloadPdf(title, headers, rows, monthGroups) {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: headers.length > 6 ? 'landscape' : 'portrait' });
                const pageWidth = doc.internal.pageSize.getWidth();

                // Branded Banner
                doc.setFillColor(22, 119, 232);
                doc.rect(0, 0, pageWidth, 22, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(13);
                doc.setFont('helvetica', 'bold');
                doc.text('AJ Tours & Travels', 14, 10);
                doc.setFontSize(8.5);
                doc.setFont('helvetica', 'normal');
                doc.text('World Wide Flight & Package Specialists · Official Portal Report', 14, 16);

                // Title
                doc.setTextColor(15, 23, 42);
                doc.setFontSize(15);
                doc.setFont('helvetica', 'bold');
                doc.text(title.replace(/_/g, ' '), 14, 32);

                doc.setFontSize(8.5);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(100, 116, 139);
                doc.text(`Generated: ${new Date().toLocaleString('en-GB')}  |  Author: ${Auth.getUser()?.name || 'Staff User'}`, 14, 38);

                let startY = 44;
                const addTable = (head, body) => {
                    const totalRow = this.buildTotalRow(head, body);
                    const foot = totalRow ? [totalRow] : undefined;
                    doc.autoTable({
                        head: [head],
                        body: body && body.length ? body : [['No records available for the selected period.']],
                        foot: foot,
                        startY,
                        theme: 'grid',
                        styles: {
                            fontSize: 7.5,
                            cellPadding: 2.5,
                            lineColor: [100, 116, 139],
                            lineWidth: 0.6,
                            textColor: [15, 23, 42]
                        },
                        headStyles: {
                            fillColor: [22, 119, 232],
                            textColor: [255, 255, 255],
                            fontStyle: 'bold',
                            fontSize: 8.5,
                            lineColor: [30, 41, 59],
                            lineWidth: 0.8
                        },
                        footStyles: {
                            fillColor: [226, 232, 240],
                            textColor: [15, 23, 42],
                            fontStyle: 'bold',
                            fontSize: 8.5,
                            lineColor: [71, 85, 105],
                            lineWidth: 0.8
                        },
                        alternateRowStyles: {
                            fillColor: [248, 250, 252]
                        },
                        tableLineColor: [71, 85, 105],
                        tableLineWidth: 1
                    });
                    startY = doc.lastAutoTable.finalY + 8;
                };

                const hasGroups = Array.isArray(monthGroups) && monthGroups.length > 0;
                const hasRows = Array.isArray(rows) && rows.length > 0;

                if (hasGroups) {
                    monthGroups.forEach(g => {
                        if (startY > doc.internal.pageSize.getHeight() - 40) {
                            doc.addPage();
                            startY = 16;
                        }
                        doc.setFillColor(240, 247, 255);
                        doc.setDrawColor(186, 230, 253);
                        doc.roundedRect(14, startY - 5, pageWidth - 28, 8, 2, 2, 'FD');
                        doc.setTextColor(3, 105, 161);
                        doc.setFontSize(9.5);
                        doc.setFont('helvetica', 'bold');
                        doc.text(g.label, 18, startY);

                        if (g.profitLabel) {
                            doc.setFillColor(236, 253, 245);
                            doc.setDrawColor(167, 243, 208);
                            const pw = doc.getTextWidth(g.profitLabel) + 8;
                            doc.roundedRect(pageWidth - 14 - pw, startY - 5, pw, 7, 2, 2, 'FD');
                            doc.setTextColor(4, 120, 87);
                            doc.text(g.profitLabel, pageWidth - 14 - pw + 4, startY);
                        }
                        startY += 8;
                        addTable(headers, g.rows);
                    });
                } else if (hasRows) {
                    addTable(headers, rows);
                } else {
                    addTable(headers, [['No records found']]);
                }
                doc.save(`${title.replace(/\s+/g, '_')}.pdf`);
            }
        };

            <div><strong>Staff Owner</strong><br>${Utils.escapeHtml(i.employeeName || 'Assigned Staff')}</div>

            ${fareSummaryHtml}
            ${docsHtml}
        </div>${extra}`;
                return this.panelHtml('Inquiry preview', inner);

        };

        /* ---------- Modal ---------- */
        const Modal = {
            show(title, content, desc = '') {
                return this.open({ title, html: content, desc });
            },
            open(opts, secondArg = '') {
                this.close();
                let title = '', html = '', footer = '', desc = '';
                if (typeof opts === 'string') {
                    title = opts;
                    html = secondArg || '';
                } else if (opts && typeof opts === 'object') {
                    title = opts.title || '';
                    html = opts.html || opts.content || '';
                    footer = opts.footer || '';
                    desc = opts.desc || opts.description || '';
                }
                const o = document.createElement('div');
                o.className = 'modal-overlay';
                o.innerHTML = `
            <div class="modal">
                <div class="modal-header" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                    <div>
                        <div class="modal-title">${title}</div>
                        ${desc ? `<div class="modal-description">${desc}</div>` : ''}
                    </div>
                    <button type="button" class="btn btn-outline btn-sm" onclick="Modal.close()" style="border:none;font-size:20px;cursor:pointer;padding:2px 10px;line-height:1;" title="Close">&times;</button>
                </div>
                <div class="modal-content">${html}</div>
                ${footer ? `<div class="modal-footer" style="display:flex;justify-content:flex-end;gap:8px;padding-top:16px;border-top:1px solid #e2e8f0;margin-top:16px;">${footer}</div>` : ''}
            </div>`;
                document.body.appendChild(o);
                o.addEventListener('click', e => { if (e.target === o) o.remove(); });
                return o;
            },
            close() {
                document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
            }
        };

                        <span class="nav-icon-3d"><i class="uil uil-calendar-alt"></i></span>
                        <span>Calendar</span>

                    ${u.role === 'admin' ? `

                        <span class="nav-icon-3d"><i class="uil uil-users-alt"></i></span>

                    </button>
                    <button class="bottom-nav-item" data-page="expenses" onclick="Router.navigate('expenses')" title="Expenses">

                    <button class="bottom-nav-item" data-page="audit-logs" onclick="Router.navigate('audit-logs')" title="Activity Log">
                        <span class="nav-icon-3d"><i class="uil uil-shield-check"></i></span>

        /* ---------- Animation Helper ---------- */
        function animateElements() {
            document.querySelectorAll('.card').forEach((el, i) => {
                setTimeout(() => el.classList.add('animate'), i * 100);

        /* ---------- Dashboard ---------- */
        const Dashboard = {
            filterYear: 'all',
            filterMonth: 'all',
            filterPreset: 'all',

            applyFilters(rawInqs, rawBks) {
                let inqs = [...rawInqs];
                let bks = [...rawBks];

                // 1. Filter Year
                if (this.filterYear !== 'all') {
                    inqs = inqs.filter(i => (i.createdDate || i.date || i.followUpDate || i.travelDate || '').startsWith(this.filterYear));
                    bks = bks.filter(b => (b.travelDate || b.issuedDate || b.closingDate || b.bookingDate || '').startsWith(this.filterYear));
                }

                // 2. Filter Month
                if (this.filterMonth !== 'all') {
                    if (this.filterYear !== 'all') {
                        const mKey = `${this.filterYear}-${String(this.filterMonth).padStart(2, '0')}`;
                        inqs = inqs.filter(i => (i.createdDate || i.date || i.followUpDate || i.travelDate || '').startsWith(mKey));
                        bks = bks.filter(b => (b.travelDate || b.issuedDate || b.closingDate || b.bookingDate || '').startsWith(mKey));
                    } else {
                        const mSuffix = `-${String(this.filterMonth).padStart(2, '0')}-`;
                        inqs = inqs.filter(i => (i.createdDate || i.date || i.followUpDate || i.travelDate || '').includes(mSuffix));
                        bks = bks.filter(b => (b.travelDate || b.issuedDate || b.closingDate || b.bookingDate || '').includes(mSuffix));
                    }
                }

                // 3. Filter Preset from Storage.getCustomFilters()
                if (this.filterPreset !== 'all') {
                    const presets = Storage.getCustomFilters();
                    const p = presets.find(x => x.id === this.filterPreset);
                    if (p) {
                        if (p.type === 'status') {
                            inqs = inqs.filter(i => (i.status || '').toLowerCase() === p.value.toLowerCase());
                            bks = bks.filter(b => (b.status || '').toLowerCase() === p.value.toLowerCase());
                        } else if (p.type === 'min_fare') {
                            const min = Number(p.value) || 0;
                            bks = bks.filter(b => Utils.salesAmount(b) >= min);
                        } else if (p.type === 'year') {
                            inqs = inqs.filter(i => (i.createdDate || i.date || '').startsWith(p.value));
                            bks = bks.filter(b => (b.travelDate || b.issuedDate || '').startsWith(p.value));
                        } else if (p.type === 'period' && p.value === 'current_month') {
                            const curM = new Date().toISOString().slice(0, 7);
                            inqs = inqs.filter(i => (i.createdDate || i.date || '').startsWith(curM));
                            bks = bks.filter(b => (b.travelDate || b.issuedDate || '').startsWith(curM));
                        }
                    }
                }

                return { inqs, bks };
            },

            render() {
                const u = Auth.getUser() || {};
                const rawInqs = Storage.getInquiries();
                const rawBks = Storage.getBookings();
                const customFilters = Storage.getCustomFilters();

                const { inqs, bks } = this.applyFilters(rawInqs, rawBks);

                const thisMonthKey = new Date().toISOString().slice(0, 7);
                const bksThisMonth = bks.filter(b => (b.issuedDate || b.closingDate || b.travelDate || '').startsWith(thisMonthKey));
                const succ = inqs.filter(i => i.status === 'Successful' || i.status === 'converted' || i.status === 'Booked').length;
                const openInqs = inqs.filter(i => !['Successful', 'converted', 'Booked', 'Unsuccessful', 'Fail', 'Lost'].includes(i.status));
                const totalHandled = inqs.length + bks.length;
                const convRate = totalHandled > 0 ? Math.round((succ / totalHandled) * 100) : 0;

                // Follow-up reminders
                const todayStr = new Date().toISOString().slice(0, 10);
                const followUps = inqs.filter(i => i.followUpDate && i.status !== 'Successful' && i.status !== 'Fail' && i.status !== 'lost');
                const overdue = followUps.filter(i => i.followUpDate < todayStr);
                const dueToday = followUps.filter(i => i.followUpDate === todayStr);
                const upcomingFollow = followUps.filter(i => i.followUpDate > todayStr);
                const totalFollowUpsDue = dueToday.length + overdue.length;

                const isFiltered = (this.filterYear !== 'all' || this.filterMonth !== 'all' || this.filterPreset !== 'all');

                            <span class="nav-icon-3d" style="width:36px;height:36px;font-size:18px;display:flex;align-items:center;justify-content:center;background:#e0f2fe;color:#0284c7;border-radius:10px;">
                                <i class="uil uil-filter"></i>
                            </span>

                                <div style="font-size:11.5px;color:#64748b;">
                                    ${isFiltered ? `<strong style="color:var(--primary)">Active Filter Applied</strong> · Showing ${inqs.length} enquiries, ${bks.length} bookings` : 'Displaying all recorded operations'}

                            <select class="form-select" style="min-width:115px;" onchange="Dashboard.filterYear = this.value; Router.navigate('dashboard');">
                                <option value="all" ${this.filterYear === 'all' ? 'selected' : ''}>All Years</option>
                                <option value="2027" ${this.filterYear === '2027' ? 'selected' : ''}>2027</option>
                                <option value="2026" ${this.filterYear === '2026' ? 'selected' : ''}>2026</option>
                                <option value="2025" ${this.filterYear === '2025' ? 'selected' : ''}>2025</option>

                                <option value="02" ${this.filterMonth === '02' ? 'selected' : ''}>February</option>
                                <option value="03" ${this.filterMonth === '03' ? 'selected' : ''}>March</option>
                                <option value="04" ${this.filterMonth === '04' ? 'selected' : ''}>April</option>

                                <option value="06" ${this.filterMonth === '06' ? 'selected' : ''}>June</option>
                                <option value="07" ${this.filterMonth === '07' ? 'selected' : ''}>July</option>
                                <option value="08" ${this.filterMonth === '08' ? 'selected' : ''}>August</option>
                                <option value="09" ${this.filterMonth === '09' ? 'selected' : ''}>September</option>
                                <option value="10" ${this.filterMonth === '10' ? 'selected' : ''}>October</option>
                                <option value="11" ${this.filterMonth === '11' ? 'selected' : ''}>November</option>
                                <option value="12" ${this.filterMonth === '12' ? 'selected' : ''}>December</option>
                            </select>

                            <!-- Custom Preset Filter -->
                            <select class="form-select" style="min-width:165px;" onchange="Dashboard.filterPreset = this.value; Router.navigate('dashboard');">
                                <option value="all" ${this.filterPreset === 'all' ? 'selected' : ''}>Preset: Default (All)</option>
                                ${customFilters.filter(f => f.scope !== 'reports').map(f => `<option value="${f.id}" ${this.filterPreset === f.id ? 'selected' : ''}>Preset: ${Utils.escape(f.name)}</option>`).join('')}
                            </select>

                            <!-- Reset Button -->
                            ${isFiltered ? `
                                <button class="btn btn-outline btn-sm" onclick="Dashboard.filterYear='all'; Dashboard.filterMonth='all'; Dashboard.filterPreset='all'; Router.navigate('dashboard');" title="Reset Filters">
                                    <i class="uil uil-redo"></i> Reset
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>

                <!-- Personal Dashboard 4 Metrics -->
                <div class="grid grid-cols-4 gap-4">
                    <div class="card metric-card">
                        <div class="metric-card-header"><div class="metric-card-title">Open Enquiries</div></div>
                        <div class="metric-value" style="color:var(--primary)">${openInqs.length}</div>
                        <div class="metric-label">${isFiltered ? 'Active filtered requests' : 'Active client requests'}</div>
                    </div>
                    <div class="card metric-card">
                        <div class="metric-card-header"><div class="metric-card-title">Bookings ${isFiltered ? 'Filtered' : 'This Month'}</div></div>
                        <div class="metric-value" style="color:var(--success)">${isFiltered ? bks.length : bksThisMonth.length}</div>
                        <div class="metric-label">${Utils.formatCurrency((isFiltered ? bks : bksThisMonth).reduce((s, b) => s + Utils.salesAmount(b), 0))} revenue</div>
                    </div>
                    <div class="card metric-card">
                        <div class="metric-card-header"><div class="metric-card-title">Follow-ups Due</div></div>
                        <div class="metric-value" style="color:${overdue.length > 0 ? 'var(--destructive)' : 'var(--warning)'}">${totalFollowUpsDue}</div>

                    <div class="card metric-card">

                        <div class="metric-label">${succ} won of ${totalHandled} total</div>

                <!-- 3D DONUT CHARTS (DASHBOARD) -->

                <!-- FOLLOW-UP REMINDERS WIDGET -->

                            <div class="card-title">Follow-up Reminders</div>
                            <div class="card-description">Clients scheduled for follow-up</div>
                        </div>
                        <div style="display:flex;gap:6px">
                            <span class="badge ${overdue.length > 0 ? 'badge-danger' : ''}">${overdue.length} Overdue</span>
                            <span class="badge ${dueToday.length > 0 ? 'badge-warning' : ''}">${dueToday.length} Due Today</span>
                            <span class="badge">${upcomingFollow.length} Upcoming</span>
                        </div>
                    </div>
                    <div class="card-content">
                        ${overdue.length === 0 && dueToday.length === 0 && upcomingFollow.length === 0 ? `

                        ` : `
                            <div style="display:flex;flex-direction:column;gap:8px">
                                ${[...overdue, ...dueToday, ...upcomingFollow].slice(0, 5).map(i => {
                    const isO = i.followUpDate < todayStr;
                    const isT = i.followUpDate === todayStr;
                    return `
                                        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:var(--muted);border-radius:6px;font-size:13px">

                                                <span class="text-muted" style="margin:0 6px">·</span>

                                                ${(i.phone || i.contactNumber) ? `<span class="text-muted" style="margin:0 6px">·</span><span>${Utils.escapeHtml(i.phone || i.contactNumber)}</span>` : ''}

                                            </div>
                                        </div>
                                    `;
                }).join('')}
                            </div>
                        `}
                    </div>
                </div>

                <div class="card"><div class="card-header"><div class="card-title">Quick Actions</div></div>
                    <div class="card-content"><div class="actions-flex">
                        ${u.role === 'admin' ? `<button class="btn btn-primary" onclick="Dashboard.showAddEmployee()">Add Employee</button>` : ''}
                        <button class="btn btn-primary" onclick="Router.navigate('inquiries')">New Inquiry</button>
                    </div></div>
                </div>

                <div class="card"><div class="card-header"><div class="card-title">PNR Search</div></div>
                    <div class="card-content"><div class="flex gap-2"><input type="text" id="pnrSearch" class="form-input" placeholder="Airline/GDS PNR"><button class="btn btn-primary" onclick="Dashboard.searchPNR()">Search</button></div><div id="pnrResult" class="mt-4"></div></div>
                </div>

                <div class="card"><div class="card-header"><div class="card-title">Recent Inquiries</div></div>
                    <div class="card-content"><div class="page-split" id="dashPreviewWrap">
                    <div><div class="table-container"><table class="table">
                        <thead><tr><th>ID</th><th>Client</th><th>Dest</th><th>Date</th><th>Status</th><th>View</th></tr></thead>
                        <tbody>${inqs.slice(0, 5).map(i => `
                            <tr><td class="font-mono">${i.id}</td><td>${i.clientName}</td><td>${i.destination}</td><td>${Utils.formatDate(i.travelDate)}</td>
                            <td><span class="badge ${Utils.getStatusBadgeClass(i.status)}">${i.status}</span></td>
                            <td><button class="btn-action btn-action-view" onclick="Dashboard.viewInquiry('${i.id}')"><i class="uil uil-eye"></i> View</button></td></tr>`).join('')}
                        </tbody></table></div></div>
                    </div></div></div>
                </div>
            </div>`;
                return Layout.render('Dashboard', content);
            },

            afterRender() {
                const rawInqs = Storage.getInquiries();
                const rawBks = Storage.getBookings();
                const { inqs, bks } = this.applyFilters(rawInqs, rawBks);

                // 1. Enquiries Pipeline 3D Donut
                const inqCounts = { 'New': 0, 'Contacted': 0, 'Quote Sent': 0, 'Follow-up': 0, 'Won/Booked': 0, 'Lost': 0 };
                inqs.forEach(i => {
                    const s = i.status;
                    if (s === 'New') inqCounts['New']++;
                    else if (s === 'Contacted') inqCounts['Contacted']++;
                    else if (s === 'Quote Sent') inqCounts['Quote Sent']++;
                    else if (s === 'Follow-up') inqCounts['Follow-up']++;
                    else if (s === 'Successful' || s === 'converted' || s === 'Booked') inqCounts['Won/Booked']++;
                    else if (s === 'Fail' || s === 'Lost' || s === 'Unsuccessful') inqCounts['Lost']++;
                    else inqCounts['New']++;
                });
                ChartHelper.createDonut3D('dashInqDonut', {
                    labels: Object.keys(inqCounts),
                    data: Object.values(inqCounts),
                    colors: ['#0ea5e9', '#8b5cf6', '#f59e0b', '#f97316', '#10b981', '#94a3b8'],
                    centerSub: 'Enquiries'
                });

                // 2. Bookings Fulfilment 3D Donut
                const bkCounts = { 'Confirmed': 0, 'Completed': 0, 'Pending': 0, 'Cancelled': 0 };
                bks.forEach(b => {
                    const s = (b.status || '').toLowerCase();
                    if (s === 'completed') bkCounts['Completed']++;
                    else if (s === 'cancelled') bkCounts['Cancelled']++;
                    else if (s === 'pending') bkCounts['Pending']++;
                    else bkCounts['Confirmed']++;
                });
                ChartHelper.createDonut3D('dashBksDonut', {
                    labels: Object.keys(bkCounts),
                    data: Object.values(bkCounts),
                    colors: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'],
                    centerSub: 'Bookings'
                });

                // 3. Attendance Donut
                const att = Storage.getAttendance();
                const attCounts = { 'Present': 0, 'Late': 0, 'Half Day': 0, 'On Leave': 0 };
                att.forEach(a => {
                    const s = a.status;
                    if (s === 'Late') attCounts['Late']++;
                    else if (s === 'Half Day') attCounts['Half Day']++;
                    else if (s === 'On Leave' || s === 'leave') attCounts['On Leave']++;
                    else attCounts['Present']++;
                });
                ChartHelper.createDonut3D('dashAttDonut', {
                    labels: Object.keys(attCounts),
                    data: Object.values(attCounts),
                    colors: ['#10b981', '#f59e0b', '#d97706', '#ec4899'],
                    centerSub: 'Shifts'
                });

                // 4. Financial Performance Donut
                const sales = bks.reduce((s, b) => s + Utils.salesAmount(b), 0);
                const net = bks.reduce((s, b) => s + Utils.issuedAmount(b), 0);
                const profit = Math.max(0, sales - net);
                ChartHelper.createDonut3D('dashFinDonut', {
                    labels: ['Net Profit', 'Supplier Cost'],
                    data: [profit, net],
                    colors: ['#10b981', '#3b82f6'],
                    isCurrency: true,
                    centerSub: 'Finance'
                });
            },

            searchPNR() {
                const pnr = document.getElementById('pnrSearch')?.value?.trim().toUpperCase();
                const container = document.getElementById('pnrResult');
                if (!pnr || !container) return;
                const bks = Storage.getBookings();
                const found = bks.find(b => (b.pnr || '').toUpperCase() === pnr);
                if (found) {
                    container.innerHTML = `
                        <div class="card" style="background:rgba(22,119,232,0.06);border:1.5px solid #93c5fd;border-radius:12px;padding:14px;">
                            <div style="font-weight:700;color:var(--primary);font-size:14px;">Found Booking PNR: ${Utils.escapeHtml(found.pnr)}</div>
                            <div style="font-size:12px;color:#1e293b;margin-top:4px;">
                                Client: <strong>${Utils.escapeHtml(found.clientName)}</strong> · Destination: <strong>${Utils.escapeHtml(found.destination)}</strong> · Fare: <strong>${Utils.formatCurrency(Utils.salesAmount(found))}</strong>
                            </div>
                            <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="Router.navigate('my-bookings')">Open in Bookings</button>
                        </div>
                    `;
                } else {
                    container.innerHTML = `<div class="text-muted" style="font-size:12px;padding:8px;">No matching booking found for PNR "${pnr}".</div>`;
                }
            },

            viewInquiry(id) {
                Router.navigate('inquiries');
            },

            showAddEmployee() {
                Employees.showAddModal();
            }
        };

        /* ---------- My Bookings ---------- */
        const MyBookings = {
            SECTION: 'bookings',
            HEADERS: ['Sr. No.', 'Invoice', 'Client', 'Phone', 'Email', 'From', 'Destination', 'Travel date', 'Type', 'Airline PNR', 'GDS PNR', 'Issued amount', 'Sales amount', 'Payment', 'Mode', 'Details', 'Actions'],
            PAY_MODES: ['Cash', 'Online-Bank Transfer', 'Card', 'Cheque', 'UPI / QR', 'Others'],
            _uploadedDocs: [],
            partialRowHtml(amt = '', mode = '', index = 0) {
                const defaultModes = ['Cash', 'Online-Bank Transfer', 'Card', 'Cheque', 'UPI / QR'];
                const chosenMode = mode || (defaultModes[index % defaultModes.length] || 'Cash');
                const modeOpts = this.PAY_MODES.map(m => `<option ${m === chosenMode ? 'selected' : ''}>${m}</option>`).join('');
                return `
                <div class="partial-pay-row partial-row" style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px;padding:12px;background:#f8fafc;border:2px solid #cbd5e1;border-radius:12px;">
                    <div class="form-group" style="margin:0">
                        <label class="form-label" style="font-size:12px;font-weight:600;margin-bottom:4px">Amount *</label>
                        <input type="number" class="form-input partial-amt" placeholder="Enter amount" value="${amt}" step="any" required>
                    </div>
                    <div class="form-group" style="margin:0">
                        <label class="form-label" style="font-size:12px;font-weight:600;margin-bottom:4px">Payment Mode *</label>
                        <select class="form-select partial-mode">${modeOpts}</select>
                    </div>
                    <button type="button" class="btn btn-ghost icon-btn" title="Remove Field" onclick="this.closest('.partial-row').remove()" style="color:var(--destructive);height:38px;width:38px;display:flex;align-items:center;justify-content:center;border-radius:8px">
                        <i class="uil uil-trash-alt" style="font-size:16px"></i>
                    </button>
                </div>`;
            },
            addPartialRow(containerId = 'dbPartialRows', amt = '', mode = '') {
                const box = document.getElementById(containerId);
                if (box) {
                    const count = box.querySelectorAll('.partial-row').length;
                    box.insertAdjacentHTML('beforeend', this.partialRowHtml(amt, mode, count));
                }
            },
            syncPayForm(statusId = 'dbPayStatus', partialBlockId = 'dbPartialBlock', rowsId = 'dbPartialRows', paidBlockId = 'dbPaidBlock') {
                const st = document.getElementById(statusId)?.value;
                const partialBlock = document.getElementById(partialBlockId);
                const paidBlock = document.getElementById(paidBlockId);
                const rows = document.getElementById(rowsId);

                if (paidBlock) paidBlock.classList.toggle('hidden', st === 'Partially Paid');
                if (partialBlock) {
                    partialBlock.classList.toggle('hidden', st !== 'Partially Paid');
                    if (st === 'Partially Paid' && rows) {
                        while (rows.querySelectorAll('.partial-row').length < 2) {
                            this.addPartialRow(rowsId);
                        }
                    }
                }
            },
            collectPartialRows(rowsId = 'dbPartialRows') {
                const rows = [];
                document.querySelectorAll(`#${rowsId} .partial-row`).forEach(row => {
                    const amt = parseFloat(row.querySelector('.partial-amt')?.value);
                    const mode = row.querySelector('.partial-mode')?.value;
                    if (!Number.isNaN(amt) && amt > 0 && mode) {
                        rows.push({ amount: amt, mode: mode });
                    }
                });
                return rows;
            },
            handleFiles(e) {
                const files = Array.from(e.target.files || []);
                const list = document.getElementById('bDocList') || document.getElementById('ebDocList');
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        MyBookings._uploadedDocs.push({
                            name: file.name,
                            size: file.size,
                            type: file.type,
                            data: evt.target.result,
                            uploadedAt: new Date().toISOString()
                        });
                        if (list) {
                            list.innerHTML = MyBookings._uploadedDocs.map((d, idx) => `
                                <span class="badge" style="font-size:11px;display:inline-flex;align-items:center;gap:4px">
                                    📎 ${Utils.escapeHtml(d.name)} (${(d.size / 1024).toFixed(0)}KB)
                                    <button type="button" style="border:none;background:none;cursor:pointer;color:var(--destructive)" onclick="MyBookings.removeDoc(${idx})">✕</button>
                                </span>
                            `).join('');
                        }
                    };
                    reader.readAsDataURL(file);
                });
            },
            removeDoc(idx) {
                MyBookings._uploadedDocs.splice(idx, 1);
                const list = document.getElementById('bDocList') || document.getElementById('ebDocList');
                if (list) {
                    list.innerHTML = MyBookings._uploadedDocs.map((d, i) => `
                        <span class="badge" style="font-size:11px;display:inline-flex;align-items:center;gap:4px">
                            📎 ${Utils.escapeHtml(d.name)} (${(d.size / 1024).toFixed(0)}KB)
                            <button type="button" style="border:none;background:none;cursor:pointer;color:var(--destructive)" onclick="MyBookings.removeDoc(${i})">✕</button>
                        </span>
                    `).join('');
                }
            },
            render() {
                const u = Auth.getUser();
                const bks = Storage.getBookings().filter(b => u.role === 'admin' || b.employeeId === u.id);
                this.lastList = bks;
                const content = `
            <div class="space-y-6"><div class="card"><div class="card-header"><div class="card-title">My Bookings</div></div>
                <div class="card-content">
                    <div class="page-split" id="bookingsPreviewWrap">
                    <div>
                    <div class="mb-4"><div class="search-box"><span class="search-icon">Search</span><input type="text" id="bookingSearch" class="form-input" placeholder="" oninput="MyBookings.filter()"></div></div>
                    <div class="export-bar" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                        <button class="btn btn-primary btn-sm" onclick="MyBookings.add()">+ New Booking</button>
                        <div style="display:flex;gap:8px">
                            <button class="btn btn-outline btn-sm" onclick="MyBookings.exportPdf()">Download PDF</button>
                            <button class="btn btn-outline btn-sm" onclick="MyBookings.exportExcel()">Download Excel</button>
                        </div>
                    </div>
                    <div id="bookingsTableArea">${this.tableHtml(bks)}</div>
                    <div class="summary-box"><p>Total: <span id="totalCount">${bks.length}</span> | Revenue (Sales): <span id="totalRev">${Utils.formatCurrency(bks.reduce((s, b) => s + Utils.salesAmount(b), 0))}</span></p></div>
                    </div></div>
                </div></div></div>`;
                return Layout.render('My Bookings', content);
            },
            groupByMonth(bks) {
                const map = new Map();
                bks.forEach(b => {
                    const k = Utils.bookingMonthKey(b);
                    if (!map.has(k)) map.set(k, []);
                    map.get(k).push(b);
                });
                return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
            },
            monthProfit(items) { return items.reduce((s, b) => s + Utils.profitAmount(b), 0); },
            exportRow(b, sr) {
                return [sr, b.invoiceNumber, b.clientName, b.contactNumber || '', b.email || '', b.fromLocation || '', b.destination, Utils.formatDate(b.travelDate), b.inquiryFor || '', b.airlinePNR || '', b.gdsPNR || '', Utils.issuedAmount(b), Utils.salesAmount(b), b.paymentStatus || '', Utils.formatPaymentDisplay(b), b.bookingDetails || ''];
            },
            tableHtml(bks) {
                if (!bks.length) return '<p class="text-center" style="padding:24px;color:var(--muted-foreground)">No bookings</p>';
                const cols = this.HEADERS.length + 1;
                const sec = this.SECTION;
                let html = `<div class="table-container"><table class="table table-bordered"><thead><tr>${this.HEADERS.map(h => `<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>`;
                this.groupByMonth(bks).forEach(([key, items]) => {
                    const profit = this.monthProfit(items);
                    const profitLabel = `Total Profit: ${Utils.formatCurrency(profit)}`;
                    html += MonthGroups.headerRow(cols, key, Utils.monthLabel(key), sec, profitLabel);
                    html += this.dataRows(items, key, sec);
                });
                html += '</tbody></table></div>';
                this.lastList = bks;
                return html;
            },
            dataRows(bks, monthKey, section) {
                let sr = 0;
                return bks.map(b => {
                    sr++;
                    const hc = MonthGroups.hiddenClass(section, monthKey);
                    return `<tr class="month-data-row data-animate tr-clickable${hc}" data-month-group="${monthKey}" data-section="${section}" data-booking-id="${b.id}" onclick="MyBookings.openPreview('${b.id}', this)">
        <td>${sr}</td><td class="font-mono">${Utils.escapeHtml(b.invoiceNumber)}</td><td>${Utils.escapeHtml(b.clientName)}</td><td>${Utils.escapeHtml(b.contactNumber || '—')}</td><td>${Utils.escapeHtml(b.email || '—')}</td>
        <td>${Utils.escapeHtml(b.fromLocation || '—')}</td><td>${Utils.escapeHtml(b.destination)}</td><td>${Utils.formatDate(b.travelDate)}</td><td>${Utils.escapeHtml(b.inquiryFor || '—')}</td>
        <td class="font-mono">${Utils.escapeHtml(b.airlinePNR || '—')}</td><td class="font-mono">${Utils.escapeHtml(b.gdsPNR || '—')}</td>
        <td>${Utils.formatCurrency(Utils.issuedAmount(b))}</td><td>${Utils.formatCurrency(Utils.salesAmount(b))}</td>
        <td><span class="badge ${Utils.getStatusBadgeClass(b.paymentStatus)}">${Utils.escapeHtml(b.paymentStatus || '—')}</span></td>
        <td>${Utils.escapeHtml(Utils.formatPaymentDisplay(b))}</td><td>${Utils.escapeHtml(b.bookingDetails || '—')}</td>
        <td onclick="event.stopPropagation()"><div class="row-actions" style="display:flex;gap:6px;align-items:center;">
            <button class="btn-action btn-action-view" title="Preview Booking" onclick="MyBookings.openPreview('${b.id}')"><i class="uil uil-eye"></i> View</button>
            <button class="btn-action btn-action-edit" title="Edit Booking" onclick="MyBookings.edit('${b.id}')"><i class="uil uil-pen"></i> Edit</button>
            ${Auth.getUser()?.role === 'admin' ? `<button class="btn-action btn-action-reassign" onclick="Inquiries.showReassignModal('booking', '${b.id}')" title="Reassign Staff"><i class="uil uil-exchange-alt"></i> Reassign</button>` : ''}
            <button class="btn-action btn-action-delete" title="Delete Booking" onclick="MyBookings.del('${b.id}')"><i class="uil uil-trash-alt"></i> Delete</button>
        </div></td></tr>`;
                }).join('');
            },
            exportGroups(list) {
                return this.groupByMonth(list).map(([k, items]) => {
                    const profit = this.monthProfit(items);
                    const profitLabel = `Total Profit: ${Utils.formatCurrency(profit)}`;
                    let sr = 0;
                    return { label: Utils.monthLabel(k), profitLabel, profitValue: profit, rows: items.map(b => this.exportRow(b, ++sr)) };
                });
            },
            exportPdf() {
                ExportUtil.downloadPdf('Bookings', this.HEADERS, [], this.exportGroups(this.lastList || []));
            },
            exportExcel() {
                ExportUtil.downloadExcel('Bookings', this.HEADERS, [], this.exportGroups(this.lastList || []));
            },
            afterRender() {
                const keys = this.groupByMonth(this.lastList || []).map(([k]) => k);
                MonthGroups.syncVisible(this.SECTION, keys);
            },
            openPreview(id, rowEl) {
                const b = Storage.getBookings().find(x => x.id === id);
                if (!b) return;
                document.querySelectorAll('#bookingsTableArea .tr-selected').forEach(r => r.classList.remove('tr-selected'));
                if (rowEl) rowEl.classList.add('tr-selected');
                Preview.mount('bookingsPreviewWrap', Preview.booking(b));
            },
            edit(id) {
                const b = Storage.getBookings().find(x => x.id === id);
                if (!b) return;
                MyBookings._uploadedDocs = Array.isArray(b.documents) ? [...b.documents] : [];
                const modeOpts = MyBookings.PAY_MODES.map(m => `<option ${b.paymentMode === m ? 'selected' : ''}>${m}</option>`).join('');
                const html = `<form id="editBkForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group"><label class="form-label">Invoice #</label><input type="text" id="ebInv" class="form-input" value="${Utils.escapeHtml(b.invoiceNumber)}" required></div>
                <div class="form-group"><label class="form-label">Travel date</label><input type="date" id="ebDate" class="form-input" value="${b.travelDate}"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group"><label class="form-label">Airline PNR</label><input type="text" id="ebAPnr" class="form-input" value="${Utils.escapeHtml(b.airlinePNR || '')}"></div>
                <div class="form-group"><label class="form-label">GDS PNR</label><input type="text" id="ebGPnr" class="form-input" value="${Utils.escapeHtml(b.gdsPNR || '')}"></div>
            </div>
            <div class="form-group"><label class="form-label">Details</label><textarea id="ebDet" class="form-textarea">${Utils.escapeHtml(b.bookingDetails || '')}</textarea></div>
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group"><label class="form-label">Issued / Cost Amount</label><input type="number" id="ebAmt" class="form-input" value="${b.amount}" required></div>
                <div class="form-group"><label class="form-label">Sales / Quoted Amount</label><input type="number" id="ebSales" class="form-input" value="${b.salesAmount ?? b.amount}"></div>
            </div>
            ${Utils.fareBreakdownHtml(b)}
            <div class="form-group"><label class="form-label">Payment Status *</label>
                <select id="ebPayStatus" class="form-select" onchange="MyBookings.syncPayForm('ebPayStatus', 'ebPartialBlock', 'ebPartialRows', 'ebPaidBlock')">
                    <option ${b.paymentStatus === 'Paid' ? 'selected' : ''}>Paid</option>
                    <option ${b.paymentStatus === 'Partially Paid' ? 'selected' : ''}>Partially Paid</option>
                    <option ${b.paymentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                </select>
            </div>
            <div id="ebPaidBlock" class="form-group ${b.paymentStatus === 'Partially Paid' ? 'hidden' : ''}">
                <label class="form-label">Payment Mode</label>
                <select id="ebMode" class="form-select">${modeOpts}</select>
            </div>
            <div id="ebPartialBlock" class="${b.paymentStatus === 'Partially Paid' ? '' : 'hidden'}" style="margin-top:10px;margin-bottom:14px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                    <label class="form-label" style="margin:0;font-weight:700;display:flex;align-items:center;gap:6px">
                        <i class="uil uil-money-bill" style="color:var(--primary);font-size:18px"></i> Partial Payment Details
                    </label>
                    <button type="button" class="btn btn-outline btn-sm" onclick="MyBookings.addPartialRow('ebPartialRows')" style="display:inline-flex;align-items:center;gap:4px;font-weight:600">
                        <i class="uil uil-plus" style="font-size:16px;font-weight:bold"></i> Add Field
                    </button>
                </div>
                <div id="ebPartialRows"></div>
            </div>
            <div class="form-group">
                <label class="form-label">Attached Documents (Tickets, Vouchers, Invoices)</label>
                <input type="file" id="ebDocs" class="form-input" multiple onchange="MyBookings.handleFiles(event)">
                <div id="ebDocList" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
                    ${MyBookings._uploadedDocs.map((d, idx) => `
                        <span class="badge" style="font-size:11px;display:inline-flex;align-items:center;gap:4px">
                            📎 ${Utils.escapeHtml(d.name)} (${(d.size / 1024).toFixed(0)}KB)
                            <button type="button" style="border:none;background:none;cursor:pointer;color:var(--destructive)" onclick="MyBookings.removeDoc(${idx})">✕</button>
                        </span>
                    `).join('')}
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full">Save</button>
        </form>`;
                const m = Modal.show('Edit booking', html);
                if (b.paymentStatus === 'Partially Paid') {
                    if (Array.isArray(b.partialPayments) && b.partialPayments.length) {
                        b.partialPayments.forEach((p, idx) => MyBookings.addPartialRow('ebPartialRows', p.amount, p.mode));
                    }
                    const rows = document.getElementById('ebPartialRows');
                    while (rows && rows.querySelectorAll('.partial-row').length < 2) {
                        MyBookings.addPartialRow('ebPartialRows');
                    }
                }
                document.getElementById('editBkForm').onsubmit = e => {
                    e.preventDefault();
                    b.invoiceNumber = document.getElementById('ebInv').value;
                    b.travelDate = document.getElementById('ebDate').value;
                    b.airlinePNR = document.getElementById('ebAPnr').value;
                    b.gdsPNR = document.getElementById('ebGPnr').value;
                    b.bookingDetails = document.getElementById('ebDet').value;
                    b.amount = parseFloat(document.getElementById('ebAmt').value);
                    b.salesAmount = parseFloat(document.getElementById('ebSales').value);
                    b.documents = MyBookings._uploadedDocs;
                    b.paymentStatus = document.getElementById('ebPayStatus').value;
                    if (b.paymentStatus === 'Partially Paid') {
                        const parts = MyBookings.collectPartialRows('ebPartialRows');
                        b.partialPayments = parts;
                        b.paidAmount = parts.reduce((s, p) => s + p.amount, 0);
                        b.paymentMode = parts.map(p => p.mode).join(', ');
                    } else {
                        b.paymentMode = document.getElementById('ebMode')?.value || '';
                        delete b.partialPayments;
                    }
                    const fareData = Utils.extractFareData();
                    Object.assign(b, fareData);
                    Storage.saveBooking(b);
                    Utils.showToast('Saved', 'Booking updated');
                    m.remove();
                    Router.navigate('my-bookings');

                const q = (document.getElementById('inqSearch')?.value || '').toLowerCase().trim();

                const m = Modal.show('Mark Successful', html);

            partialRowHtml(amt = '', mode = '', index = 0) {

                const chosenMode = mode || (defaultModes[index % defaultModes.length] || 'Cash');

        /* ---------- Details (Completed / Upcoming travel) ---------- */
        const Details = {
            SECTION: 'details',
            tab: 'upcoming',
            render() {
                const content = `<div class="space-y-6"><div class="card"><div class="card-header"><div class="card-title">Details</div>
            <div class="card-description">Completed and upcoming travel records</div></div>
            <div class="card-content">
                <div class="sub-tabs">
                    <button type="button" class="sub-tab ${this.tab === 'upcoming' ? 'active' : ''}" onclick="Details.switchTab('upcoming')">Upcoming Travel</button>

                    </div>

            </div></div></div>`;
                return Layout.render('Details', content);
            },
            switchTab(t) { this.tab = t; MonthGroups.reset(this.SECTION); Router.navigate('details'); },
            getBookings() {
                const u = Auth.getUser();
                return Storage.getBookings().filter(b => u.role === 'admin' || b.employeeId === u.id);
            },
            filtered() {
                let list = this.getBookings();
                if (this.tab === 'completed') list = list.filter(b => Utils.isTravelBeforeToday(b.travelDate));
                else list = list.filter(b => Utils.isTravelOnOrAfterToday(b.travelDate));
                const fromEl = document.getElementById('detDateFrom');
                const toEl = document.getElementById('detDateTo');
                if (fromEl?.value) {
                    const f = Utils.parseDateOnly(fromEl.value);
                    if (f) list = list.filter(b => { const td = Utils.parseDateOnly(b.travelDate); return td && td >= f; });
                }
                if (toEl?.value) {
                    const t = Utils.parseDateOnly(toEl.value);
                    if (t) { t.setHours(23, 59, 59, 999); list = list.filter(b => { const td = Utils.parseDateOnly(b.travelDate); return td && td <= t; }); }
                }
                const q = (document.getElementById('detSearch')?.value || '').toLowerCase();
                if (q) list = list.filter(b => JSON.stringify(b).toLowerCase().includes(q));
                return list.sort((a, b) => Utils.compareDateOnly(a.travelDate, b.travelDate));
            },
            tableHtml() {
                const list = this.filtered();
                if (!list.length) return '<p class="text-center" style="padding:24px;color:var(--muted-foreground)">No records</p>';
                const groups = new Map();
                list.forEach(b => {
                    const k = Utils.monthKey(b.travelDate);
                    if (!groups.has(k)) groups.set(k, []);
                    groups.get(k).push(b);
                });
                let html = '<div class="page-split" id="detailsPreviewWrap"><div><div class="table-container"><table class="table table-bordered"><thead><tr><th>Sr. No.</th><th>Invoice</th><th>Client</th><th>Contact</th><th>From</th><th>Dest</th><th>Travel</th><th>PNR / GDS</th><th>Flight / package</th><th>Issued</th><th>Sales</th><th>Payment</th><th>Actions</th></tr></thead><tbody>';
                const sec = this.SECTION;
                Array.from(groups.entries()).sort((a, b) => a[0].localeCompare(b[0])).forEach(([key, items]) => {
                    html += MonthGroups.headerRow(13, key, Utils.monthLabel(key), sec, null);
                    let sr = 0;
                    items.forEach(b => {
                        sr++;
                        const urgent = this.tab === 'upcoming' && Utils.daysUntil(b.travelDate) >= 0 && Utils.daysUntil(b.travelDate) <= 3;
                        const hc = MonthGroups.hiddenClass(sec, key);
                        html += `<tr class="month-data-row data-animate tr-clickable${hc} ${urgent ? 'upcoming-urgent' : ''}" data-month-group="${key}" data-section="${sec}" onclick="Details.openPreview('${b.id}')">
                    <td>${sr}</td><td class="font-mono">${Utils.escapeHtml(b.invoiceNumber)}</td>
                    <td>${Utils.escapeHtml(b.clientName)}</td>
                    <td>${Utils.escapeHtml(b.contactNumber || '—')}</td>
                    <td>${Utils.escapeHtml(b.fromLocation || '—')}</td>
                    <td>${Utils.escapeHtml(b.destination)}</td>
                    <td>${Utils.formatDate(b.travelDate)}</td>
                    <td class="font-mono">${Utils.escapeHtml(b.airlinePNR || '—')} / ${Utils.escapeHtml(b.gdsPNR || '—')}</td>
                    <td>${Utils.escapeHtml(b.bookingDetails || '—')}</td>
                    <td>${Utils.formatCurrency(Utils.issuedAmount(b))}</td>
                    <td>${Utils.formatCurrency(Utils.salesAmount(b))}</td>
                    <td><span class="badge ${Utils.getStatusBadgeClass(b.paymentStatus)}">${Utils.escapeHtml(b.paymentStatus || '—')}</span></td>
                    <td onclick="event.stopPropagation()"><button class="btn-action btn-action-view" onclick="Details.openPreview('${b.id}')"><i class="uil uil-eye"></i> View</button></td>
                </tr>`;
                    });
                });
                html += '</tbody></table></div></div></div>';
                this.lastFiltered = list;
                this.lastMonthKeys = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b));
                return html;

            refresh() {

                MonthGroups.syncVisible(this.SECTION, this.lastMonthKeys || []);
            },
            exportRow(b, sr) {
                return [sr, b.invoiceNumber, b.clientName, b.contactNumber || '', b.fromLocation || '', b.destination, Utils.formatDate(b.travelDate), `${b.airlinePNR || ''} / ${b.gdsPNR || ''}`, b.bookingDetails || '', b.amount, b.salesAmount ?? b.amount, b.paymentStatus];
            },
            exportPdf() {
                const list = this.lastFiltered || this.filtered();
                const title = this.tab === 'upcoming' ? 'Upcoming_Travel' : 'Completed_Travel';
                const headers = ['Sr. No.', 'Invoice', 'Client', 'Contact', 'From', 'Dest', 'Travel', 'PNR/GDS', 'Details', 'Issued', 'Sales', 'Payment'];
                const map = new Map();
                list.forEach(b => { const k = Utils.monthKey(b.travelDate); if (!map.has(k)) map.set(k, []); map.get(k).push(b); });
                const groups = Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([k, items]) => { let s = 0; return { label: Utils.monthLabel(k), rows: items.map(b => this.exportRow(b, ++s)) }; });
                ExportUtil.downloadPdf(title, headers, [], groups);
            },
            exportExcel() {
                const list = this.lastFiltered || this.filtered();
                const title = this.tab === 'upcoming' ? 'Upcoming_Travel' : 'Completed_Travel';
                const headers = ['Sr. No.', 'Invoice', 'Client', 'Contact', 'From', 'Dest', 'Travel', 'PNR/GDS', 'Details', 'Issued', 'Sales', 'Payment'];
                const map = new Map();
                list.forEach(b => { const k = Utils.monthKey(b.travelDate); if (!map.has(k)) map.set(k, []); map.get(k).push(b); });
                const groups = Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0])).map(([k, items]) => { let s = 0; return { label: Utils.monthLabel(k), rows: items.map(b => this.exportRow(b, ++s)) }; });
                ExportUtil.downloadExcel(title, headers, [], groups);
            }
        };

        /* ================= REPORTS & ANALYTICS (CIRCULAR 3D CHARTS) ================= */
        const Reports = {
            charts: {},
            period: 'monthly',
            emp: 'all',

            filterMonth: 'all',
            filterPreset: 'all',

            update() {
                this.afterRender();
            },

            applyFilters(rawInqs, rawBks, rawExp) {
                let inqs = [...rawInqs];
                let bks = [...rawBks];
                let exp = [...rawExp];

                // Employee filter
                if (this.emp !== 'all') {
                    inqs = inqs.filter(i => i.employeeId === this.emp || i.assignedTo === this.emp);
                    bks = bks.filter(b => b.employeeId === this.emp || b.assignedTo === this.emp || b.consultantId === this.emp);
                }

                // Year filter
                if (this.filterYear !== 'all') {
                    inqs = inqs.filter(i => (i.createdDate || i.date || i.followUpDate || i.travelDate || '').startsWith(this.filterYear));
                    bks = bks.filter(b => (b.travelDate || b.issuedDate || b.closingDate || b.bookingDate || '').startsWith(this.filterYear));
                    exp = exp.filter(e => (e.date || '').startsWith(this.filterYear));
                }

                // Month filter
                if (this.filterMonth !== 'all') {
                    if (this.filterYear !== 'all') {
                        const mKey = `${this.filterYear}-${String(this.filterMonth).padStart(2, '0')}`;
                        inqs = inqs.filter(i => (i.createdDate || i.date || i.followUpDate || i.travelDate || '').startsWith(mKey));
                        bks = bks.filter(b => (b.travelDate || b.issuedDate || b.closingDate || b.bookingDate || '').startsWith(mKey));
                        exp = exp.filter(e => (e.date || '').startsWith(mKey));
                    } else {
                        const mSuffix = `-${String(this.filterMonth).padStart(2, '0')}-`;
                        inqs = inqs.filter(i => (i.createdDate || i.date || i.followUpDate || i.travelDate || '').includes(mSuffix));
                        bks = bks.filter(b => (b.travelDate || b.issuedDate || b.closingDate || b.bookingDate || '').includes(mSuffix));
                        exp = exp.filter(e => (e.date || '').includes(mSuffix));
                    }
                }

                // Custom Presets
                if (this.filterPreset !== 'all') {
                    const presets = Storage.getCustomFilters();
                    const p = presets.find(x => x.id === this.filterPreset);
                    if (p) {
                        if (p.type === 'status') {
                            inqs = inqs.filter(i => (i.status || '').toLowerCase() === p.value.toLowerCase());
                            bks = bks.filter(b => (b.status || '').toLowerCase() === p.value.toLowerCase());
                        } else if (p.type === 'min_fare') {
                            const min = Number(p.value) || 0;
                            bks = bks.filter(b => Utils.salesAmount(b) >= min);
                        } else if (p.type === 'year') {
                            inqs = inqs.filter(i => (i.createdDate || i.date || '').startsWith(p.value));
                            bks = bks.filter(b => (b.travelDate || b.issuedDate || '').startsWith(p.value));
                            exp = exp.filter(e => (e.date || '').startsWith(p.value));
                        } else if (p.type === 'period' && p.value === 'current_month') {
                            const curM = new Date().toISOString().slice(0, 7);
                            inqs = inqs.filter(i => (i.createdDate || i.date || '').startsWith(curM));
                            bks = bks.filter(b => (b.travelDate || b.issuedDate || '').startsWith(curM));
                            exp = exp.filter(e => (e.date || '').startsWith(curM));
                        }
                    }
                }

                return { inqs, bks, exp };

            afterRender() {
                const rawInqs = Storage.getInquiries();
                const rawBks = Storage.getBookings();
                const rawExp = Storage.getExpenses();
                const { inqs, bks, exp } = this.applyFilters(rawInqs, rawBks, rawExp);

                // 1. Employees Donut
                const employees = Storage.getEmployees();
                const roleCounts = { 'Admin': 0, 'Consultant': 0, 'Operations': 0 };
                employees.forEach(e => {
                    if (e.role === 'admin') roleCounts['Admin']++;
                    else roleCounts['Consultant']++;
                });
                ChartHelper.createDonut3D('repEmpDonut', {
                    labels: Object.keys(roleCounts),
                    data: Object.values(roleCounts),
                    colors: ['#1677e8', '#0ea5e9', '#6366f1'],
                    centerSub: 'Staff'
                });

                // 2. Attendance Donut
                const att = Storage.getAttendance();
                const attCounts = { 'Present': 0, 'Late': 0, 'Half Day': 0, 'On Leave': 0 };
                att.forEach(a => {
                    const s = a.status;
                    if (s === 'Late') attCounts['Late']++;
                    else if (s === 'Half Day') attCounts['Half Day']++;
                    else if (s === 'On Leave' || s === 'leave') attCounts['On Leave']++;
                    else attCounts['Present']++;
                });
                ChartHelper.createDonut3D('repAttDonut', {
                    labels: Object.keys(attCounts),
                    data: Object.values(attCounts),
                    colors: ['#10b981', '#f59e0b', '#d97706', '#ec4899'],
                    centerSub: 'Logs'
                });

                // 3. Bookings Status Donut
                const bkStatus = { 'Confirmed': 0, 'Completed': 0, 'Pending': 0, 'Cancelled': 0 };
                bks.forEach(b => {
                    const s = (b.status || '').toLowerCase();
                    if (s === 'completed') bkStatus['Completed']++;
                    else if (s === 'cancelled') bkStatus['Cancelled']++;
                    else if (s === 'pending') bkStatus['Pending']++;
                    else bkStatus['Confirmed']++;
                });
                ChartHelper.createDonut3D('repBksDonut', {
                    labels: Object.keys(bkStatus),
                    data: Object.values(bkStatus),
                    colors: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'],
                    centerSub: 'Bookings'
                });

                // 4. Enquiries Donut
                const inqFunnel = { 'New': 0, 'Contacted': 0, 'Quote Sent': 0, 'Follow-up': 0, 'Booked': 0, 'Lost': 0 };
                inqs.forEach(i => {
                    const s = i.status;
                    if (s === 'New') inqFunnel['New']++;
                    else if (s === 'Contacted') inqFunnel['Contacted']++;
                    else if (s === 'Quote Sent') inqFunnel['Quote Sent']++;
                    else if (s === 'Follow-up') inqFunnel['Follow-up']++;
                    else if (s === 'Successful' || s === 'converted' || s === 'Booked') inqFunnel['Booked']++;
                    else if (s === 'Fail' || s === 'Lost' || s === 'Unsuccessful') inqFunnel['Lost']++;
                    else inqFunnel['New']++;
                });
                ChartHelper.createDonut3D('repInqDonut', {
                    labels: Object.keys(inqFunnel),
                    data: Object.values(inqFunnel),
                    colors: ['#0ea5e9', '#8b5cf6', '#f59e0b', '#f97316', '#10b981', '#94a3b8'],
                    centerSub: 'Enquiries'
                });

                    const c = e.category || 'Misc';

                    labels: Object.keys(expCats),

                    labels: ['Net Profit', 'Supplier Costs', 'Overheads'],
                    data: [netProfit, totalDirectNet, totalExpenses],
                    colors: ['#10b981', '#3b82f6', '#f43f5e'],
                    isCurrency: true,
                    centerSub: 'Profit'
                });

        /* ================= COMPANY EXPENSES MODULE (ADMIN / BOSS PORTAL) ================= */
        const Expenses = {
            selectedMonth: 'all',
            selectedCategory: 'all',
            searchQuery: '',
            render() {
                const u = Auth.getUser();
                if (u?.role !== 'admin') return '<div class="card p-6">Access Denied</div>';
                const expenses = Storage.getExpenses();
                const thisMonthStr = new Date().toISOString().slice(0, 7);

                const thisMonthExpenses = expenses.filter(e => (e.date || '').startsWith(thisMonthStr));
                const totalMonth = thisMonthExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
                const totalAll = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);

                const catMap = {};
                expenses.forEach(e => {
                    const c = e.category || 'Misc';
                    catMap[c] = (catMap[c] || 0) + (Number(e.amount) || 0);
                });
                let topCat = 'None', topCatAmt = 0;
                Object.entries(catMap).forEach(([k, v]) => {
                    if (v > topCatAmt) { topCat = k; topCatAmt = v; }
                });

                const filtered = expenses.filter(e => {

                        <div class="card metric-card">

                                        <option value="all" ${this.selectedCategory === 'all' ? 'selected' : ''}>All Categories</option>
                                        <option value="Rent" ${this.selectedCategory === 'Rent' ? 'selected' : ''}>Rent</option>
                                        <option value="Salaries" ${this.selectedCategory === 'Salaries' ? 'selected' : ''}>Salaries / Allowances</option>
                                        <option value="Software" ${this.selectedCategory === 'Software' ? 'selected' : ''}>Software / GDS</option>
                                        <option value="Marketing" ${this.selectedCategory === 'Marketing' ? 'selected' : ''}>Marketing &amp; Ads</option>
                                        <option value="Utilities" ${this.selectedCategory === 'Utilities' ? 'selected' : ''}>Utilities &amp; Telecom</option>
